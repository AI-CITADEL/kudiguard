[project]
name = "kudiguard"
version = "0.1.0"
description = "Voice-first WhatsApp assistant for financial literacy and scam checks, built on N-ATLAS."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4"]
asr = ["faster-whisper>=1.1", "ctranslate2>=4.5", "transformers>=4.44", "torch>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
kudiguard = "kudiguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kudiguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: requires real models/services (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # line length is enforced by ruff format

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["kudiguard"]
ignore_missing_imports = true
