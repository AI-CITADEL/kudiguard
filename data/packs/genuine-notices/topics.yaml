#   https://techeconomy.ng/how-to-detect-fake-credit-debit-sms-alert (accessed 2026-10-11)
- id: notice-bank-security-tips
  title: A security tips message from your bank
  facts:
    - Banks often send messages like "We will never ask for your PIN, OTP or password."
    - A message that only gives advice, and asks you to do nothing, is normal.
    - A fake one mixes the advice with a link, a phone number to call, or a request for details.
    - The one check is to see whether it asks you to do anything. Real tips only warn you.
  actions:
    - You do not need to reply. Ignore any link or number inside such a message.
