# Official reporting channels. `verified: true` only after the value was checked against the organisation's own
# website; the source and date are in `note`. Unverified contacts are never shown to users (render.py).
# Label translations (label_i18n): DRAFT, pending native-speaker review. Numbers and links are never translated.
- label: Your own bank
  kind: note
  value: Call the number printed on the back of your bank card or listed on the bank's official website
  pinned: true
  verified: true
  note: Always-correct instruction rather than a specific number
  label_i18n:
    ha: Bankinku
    yo: Báǹkì yín
    ig: Ụlọ akụ gị
  value_i18n:
    ha: Ku kira lambar da ke bayan katin bankinku ko wadda ke shafin yanar gizon bankin na hukuma
    yo: Ẹ pe nọ́mbà tó wà lẹ́yìn káàdì báǹkì yín tàbí èyí tó wà lórí ojú-ìwé ayélujára báǹkì náà
    ig: Kpọọ nọmba dị n'azụ kaadị ụlọ akụ gị ma ọ bụ nke dị na webụsaịtị ụlọ akụ ahụ

