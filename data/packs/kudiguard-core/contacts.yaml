# Official reporting channels. `verified: true` only after a team member has checked the value against the
# organisation's own website, with the date in `note`. Unverified contacts are shown with a "check first" note.
- label: Your own bank
  kind: note
  value: Call the number printed on the back of your bank card or listed on the bank's official website
  pinned: true
  verified: true
  note: Always-correct instruction rather than a specific number

- label: NCC consumer helpline (telecom and SIM fraud)
  kind: phone
  value: "622"
  flags: [account_threat, impersonation, asks_credentials]
  verified: false

- label: EFCC (report financial crimes)
  kind: web
  value: https://www.efcc.gov.ng
  flags: [asks_credentials, guaranteed_returns, upfront_fee, prize_lottery, wrong_transfer, money_request, impersonation, remote_access, fake_payment]
  verified: false

- label: SEC Nigeria (check if an investment company is registered)
  kind: web
  value: https://sec.gov.ng
  flags: [guaranteed_returns]
  verified: false

- label: FCCPC (approved loan apps, complaints)
  kind: web
  value: https://fccpc.gov.ng
  flags: [upfront_fee]
  verified: false

- label: CBN Consumer Protection (if your bank does not resolve a complaint)
  kind: email
  value: cpd@cbn.gov.ng
  verified: false
