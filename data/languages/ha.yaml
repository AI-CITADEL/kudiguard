    💛 Muna matuƙar baƙin ciki da abin da kuke ciki. Kuna da muhimmanci, kuma ba ku kaɗai ba ne.
    Idan kuna jin za ku iya aikata abin da kuke tunani, ko kuna cikin haɗari, ku kira *112* (layin agajin ƙasa, kyauta) ko ku je asibiti mafi kusa.
