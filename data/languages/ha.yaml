# Hausa. Loanwords (OTP, BVN, PIN, link…) are covered by the English pivot lexicon, which always applies.
# Native terms below are a starter set and MUST be reviewed by a native speaker before launch.
code: ha
name: Hausa
native_name: Hausa
order: 1
status: stable
asr_model: NCAIR1/Hausa-ASR
asr_whisper_language: ha
review:
  lexicon: pending-native-review
  strings: pending-native-review

commands:
  stop: [daina aiko min, daina turo min sako]  # not "tsaya": it means "wait"
  delete: [goge bayanai na, goge sakonni na]
  language: [harshe, canja harshe]
  donate: [ba da gudummawar murya, bada gudummawar murya]  # DRAFT, pending native review
  stop_donating: [daina gudummawar murya, daina karbar murya ta]  # DRAFT
  greetings: [sannu, sannu da zuwa, ina kwana, ina wuni, barka, barka da safe, barka da rana, barka da yamma,
    salam, assalamu alaikum, na gode, nagode, mun gode, to, madalla]

output_guard:
  safety_claims:
    - 'ba (?:zamba|damfara|yaudara) ba(?:ne)?'
    - 'babu (?:wani )?hadari'
    - '(?:yana|ya) da (?:aminci|tsaro)'
  refusals:
    - 'ba zan iya taimaka'
  # DRAFT, native review pending. Imperatives (ku/ka/ki + verb) at the clause start; "kada"/"kar" before negates.
  unsafe_instructions:
    - '(?:ku|ka|ki)\W+(?:tura|aika|bayar da|ba)\W+(?:(?:su|shi|ta|masu|musu|masa|mata)\W+)?(?:(?:da|wannan|wata|wani)\W+)?(?:lambar sirri|lambar otp|otp|pin|bvn|kalmar sirri|code|kod|lambar(?!\W+(?:asusu\w*|account\w*|waya\w*)))'
    - '(?:ku|ka|ki)\W+biya\W+(?:\w+\W+)?(?:kudin (?:rajista|sarrafawa|caji|kunnawa|saki|processing|registration)|caji|fee)'
    - '(?:ku|ka|ki)\W+(?:danna|bude|latsa)\W+(?:\w+\W+)?(?:link|mahada|mahadar|hanyar)'
    - '(?:ku|ka|ki)\W+(?:sauke|saukar da|shigar da|sanya|zazzage)\W+(?:anydesk|teamviewer|\w*apk)'
    - '(?:ku|ka|ki)\W+(?:sauke|saukar da|shigar da|sanya|zazzage)\W+(?:\w+\W+)?(?:app|manhaja|manhajar)(?!.*(?:play store|app store|google play|bankinku|na banki))'
    - '(?:ku|ka|ki)\W+(?:mayar|maida|maido)\W+(?:musu\W+|masa\W+|mata\W+)?(?:da\W+)?(?:kudin|kudi)'
  instruction_prefixes:
    - '(?:don|allah|sai|yanzu|kawai|kuma|to|maza)'
  negations:
    - '(?:kada|kar)'
  clause_breaks:
    - '(?:kuma|amma|sannan)'

# Malicious-use screens (safety/abuse.py, docs/ABUSE.md). DRAFT, pending native review; the English/Pidgin phrases
# also apply.
