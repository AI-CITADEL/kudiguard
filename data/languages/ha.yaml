    - 'shege'
    - 'mahaukaci\w*'
  scam_tool:
    - 'rubuta\W+(?:min\W+)?sako\w*\W+kamar\W+(?:daga\W+)?(?:na\W+)?banki'
    - 'rubuta\W+(?:min\W+)?(?:\w+\W+){0,3}?sako\w*\W+(?:\w+\W+){0,4}?(?:kama\W+da|kamar)\W+(?:na\W+)?banki'
    - '(?:kirkiro|kera|yi)\W+(?:min\W+)?(?:\w+\W+){0,1}?alert\W+na\W+karya'
    - 'ta\W+yaya\W+zan\W+(?:samu|karbi|dauki|sace)\W+(?:\w+\W+){0,3}?(?:ta|na)\W+wani'
    - 'taimaka\W+min\W+(?:in\W+)?rubuta\W+sako\w*\W+(?:cewa|da)\W+(?:\w+\W+){0,4}?(?:ci|biya|turo)'
  injection:
    - 'system\W*prompt\W+(?:dinka|naka)\b'
    - '(?:manta|mance)\W+da\W+(?:dukkan\W+|duk\W+)?(?:umarni\w*|dokoki\w*|ka''idoji\w*)'
    - 'yi\W+watsi\W+da\W+(?:\w+\W+){0,2}?(?:umarni\w*|dokoki\w*|ka''idoji\w*)'
    - 'ka\W+dauka\W+(?:cewa\W+)?kai\W+(?:ne|ma''aikaci\w*|wakili\w*)'
    - 'yanzu\W+kai\W+(?:ne|ma''aikaci\w*|wakili\w*)'
    - '(?:nuna|rubuta|fadi)\W+(?:min\W+)?(?:\w+\W+){0,2}?umarni\w*\W+(?:\w+\W+){0,2}?(?:aka\W+ba\W+ka|farko)'
    - 'sako\W+ga\W+ai'
    - 'ka\W+fassara\W+(?:\w+\W+){0,6}?(?:sannan|kuma)\W+ka\W+(?:aikata|yi)\W+abin\W+da\W+ya\W+ce'
    - 'daga\W+yanzu\W+ka\W+(?:rika|dinga)\W+(?:amsa|cewa|fada)'
    - '(?:ka\W+ce|fada)\W+(?:cewa\W+)?(?:wannan\W+)?(?:sako\w*\W+)?(?:ba\W+zamba\W+ba|lafiya\W+ne|na\W+gaskiya\W+ne)'
  injection_reported:
    - '(?:ya|ta|sun|an)\W+(?:ce|fada|turo)|bankina\W+ya'
  asr_hallucinations:
    - 'mun\W+gode\W+da\W+kallo'
  asr_annotations:
