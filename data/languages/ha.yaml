    - 'ba\W+na\W+son\W+rayuwa'
    - 'na\W+gaji\W+da\W+rayuwa'
    - 'kashe\W+kai\W*na'
    - '(?:ban|bana|ba\W+na)\W+(?:son|so|bukatar)\W+(?:in|na)\W+(?:rayu|ci\W+gaba\W+da\W+rayuwa)'
    - '(?:gara|gwamma|ina\W+so)\W+(?:in|na)\W+mutu'
    - 'zan\W+(?:kashe\W+kai\W*na|halaka\W+kai\W*na)'
    - 'halaka\W+kai\W*na'
  crisis_other:
    - 'kashe\W+(?:kansa|kanta|kansu)'
  crisis_exemplars:
    - Ina so in kashe kaina
    - Ban son in rayu kuma
    - Na gaji da rayuwa, gara in mutu
  abuse:
    - '(?:kai|ke|ku)\W+(?:\w+\W+){0,1}?(?:wawa|wawiya|dan\W+iska|''yar\W+iska|shege|mahaukaci|mahaukaciya|jahili)\b'
