strings:
  welcome: |-
    👋 Barka da zuwa *KudiGuard*. Ina taimaka muku gane damfarar kuɗi da amsa tambayoyi game da kuɗi.

    Ku aiko mini da *saƙon murya* ko rubutu, ko ku tura saƙon da kuke shakka a kai.

    🔒 Muna adana saƙonninku har tsawon kwanaki {retention_days} don inganta aikinmu. Wasu ƙalilan amintattun masu bita (ƙungiyarmu ko masu harshen a matsayin harshen uwa, ƙarƙashin yarjejeniyar sirri a rubuce) za su iya karanta wasu daga cikin saƙonni da amsoshi, an ɓoye yawancin lambobi kuma babu lambar wayarku ko wata alamar gane ku, don duba inganci da tsaro; ana share kwafinsu bayan binciken. Ana adana lambar wayarku ne kawai a sigar sirri, kuma ana share saƙonnin murya bayan an rubuta su, sai dai idan kun zaɓi ba da gudummawarsu (za mu tambaye ku daban). Ku aika *DELETE* a kowane lokaci don share saƙonninku, ko *STOP* don dakatarwa. Ana adana misalan damfara (an cire yawancin lambobi) daban har kwanaki {pattern_retention_days} don kare wasu da inganta KudiGuard; DELETE yana share waɗanda aka ɗauka daga saƙonninku na kwanan nan. Ta hanyar ci gaba, kun amince da wannan.
    🌍 Don gudanar da KudiGuard, saƙonninku suna wucewa ta WhatsApp (Meta) da Cloudflare, a wajen Najeriya, kuma ana adana su a sabarmu {where}. {risk} Ta hanyar ci gaba, kun kuma amince da wannan canja wurin.
    ℹ️ Wannan jagora ce kawai, ba shawarar kuɗi ta ƙwararru ba.
    _N-ATLaS is an initiative of the Federal Ministry of Communications, Innovation and Digital Economy and powered by Awarri Technologies._
