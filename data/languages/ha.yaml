    Idan kun shirya, zan taimaka da batun kuɗin: ku kira bankinku a lambar da ke jikin katinku ku faɗa musu abin da ya faru.
  crisis_other_reply: |-
    💛 Mun gode da kuka nemi taimako domin su. Idan suna iya aikata hakan yanzu ko suna cikin haɗari, ku kira *112* (layin agajin ƙasa, kyauta) ku zauna tare da su, ko ku kai su asibiti mafi kusa.
