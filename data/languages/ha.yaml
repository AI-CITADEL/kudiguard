  persona_claims:
    - 'ni\W+(?:ne\W+)?ma''aikacin\W+(?:banki|\w+\W+bank)'
    - 'mu\W+ne\W+(?:banki\w*|customer\W+care)'

lexicon:
  flags:
    threat:  # DRAFT, native review pending
      - 'za\W+mu\W+kashe\W+(?:ka|ki|ku)\b'
