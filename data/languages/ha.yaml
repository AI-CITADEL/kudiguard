  welcome: |-
    👋 Barka da zuwa *KudiGuard*. Ina taimaka muku gane damfarar kuɗi da amsa tambayoyi game da kuɗi.

    Ku aiko mini da *saƙon murya* ko rubutu, ko ku tura saƙon da kuke shakka a kai.

    🔒 Muna adana saƙonninku har tsawon kwanaki 90 don inganta aikinmu. Ana adana lambar wayarku ne kawai a sigar sirri, kuma ana share saƙonnin murya bayan an rubuta su. Ku aika *DELETE* a kowane lokaci don share saƙonninku, ko *STOP* don dakatarwa. Ta hanyar ci gaba, kun amince da wannan.
    ℹ️ Wannan jagora ce kawai, ba shawarar kuɗi ta ƙwararru ba.
    _Powered by N-ATLAS · Awarri_
