# Hausa. Loanwords (OTP, BVN, PIN, link…) are covered by the English pivot lexicon, which always applies.
# Native terms below are a starter set and MUST be reviewed by a native speaker before launch.
code: ha
name: Hausa
native_name: Hausa
order: 1
status: stable
asr_model: NCAIR1/Hausa-ASR
asr_whisper_language: ha
review:
  lexicon: pending-native-review
  strings: pending-native-review

commands:
  stop: [daina aiko min, daina turo min sako]  # not "tsaya": it means "wait"
  delete: [goge bayanai na, goge sakonni na]
  language: [harshe, canja harshe]
  donate: [ba da gudummawar murya, bada gudummawar murya]  # DRAFT, pending native review
  stop_donating: [daina gudummawar murya, daina karbar murya ta]  # DRAFT
  greetings: [sannu, sannu da zuwa, ina kwana, ina wuni, barka, barka da safe, barka da rana, barka da yamma,
    salam, assalamu alaikum, na gode, nagode, mun gode, to, madalla]

output_guard:
  safety_claims:
    - 'ba (?:zamba|damfara|yaudara) ba(?:ne)?'
    - 'babu (?:wani )?hadari'
    - '(?:yana|ya) da (?:aminci|tsaro)'
  refusals:
    - 'ba zan iya taimaka'

lexicon:
  flags:
    asks_credentials:
      - 'lambar sirri'
      - '(?:turo|tura|aika|aiko|ba|bayar)\W+(?:masa|mata|musu|mana|shi|ita|su)\W+(?:\w+\W+){0,2}?(?:lamba\w*|code|kod|otp|pin)'
    prize_lottery:
      - '(?:kun|ka|kin|na|an|ya|ta|sun) ci (?:kyauta\w*|gasa\w*|lambar yabo)'
    upfront_fee:
      - 'kudin (?:rajista|rijista|sarrafawa|aiki|kwastam)'
      - '(?:sai|dole|tukuna)\W+(?:\w+\W+){0,2}?(?:ku|ka|ki|kun) biya\W+(?:\w+\W+){0,4}?(?:kafin|domin|don|sannan)'
    account_threat:
      - 'toshe\W+(?:\w+\W+){0,2}?(?:asusu\w*|account\w*|kati\w*|layi\w*|bvn|sim)'
      - '(?:asusu\w*|account\w*|bvn|layi\w*)\W+(?:\w+\W+){0,3}?(?:za a |an |sun |zasu |za su )toshe'
    urgency:
      - 'gaggawa'
      - 'yanzu yanzu'
    guaranteed_returns:
      - 'ninki (?:biyu|uku)'
      - 'riba (?:tabbatacciya|ta tabbata|babu asara)'
    secrecy:
      - '(?:kada|kar) (?:ka|ki|ku) (?:fada|gaya|sanar)\W+(?:\w+\W+){0,1}?kowa'
  check_intent:
    - '(?:dan )?damfara'
    - 'zamba'
    - 'yaudara'

# Fixed user-facing text: DRAFT, pending native-speaker review. Buttons (btn_*) max 20 chars.
strings:
  welcome: |-
    👋 Barka da zuwa *KudiGuard*. Ina taimaka muku gane damfarar kuɗi da amsa tambayoyi game da kuɗi.

    Ku aiko mini da *saƙon murya* ko rubutu, ko ku tura saƙon da kuke shakka a kai.

    🔒 Muna adana saƙonninku har tsawon kwanaki 90 don inganta aikinmu. Wasu ƙalilan amintattun masu bita (ƙungiyarmu ko masu harshen a matsayin harshen uwa, ƙarƙashin yarjejeniyar sirri a rubuce) za su iya karanta wasu daga cikin saƙonni da amsoshi, an ɓoye lambobi kuma babu lambar wayarku ko wata alamar gane ku, don duba inganci da tsaro; ana share kwafinsu bayan binciken. Ana adana lambar wayarku ne kawai a sigar sirri, kuma ana share saƙonnin murya bayan an rubuta su, sai dai idan kun zaɓi ba da gudummawarsu (za mu tambaye ku daban). Ku aika *DELETE* a kowane lokaci don share saƙonninku, ko *STOP* don dakatarwa. Ana adana misalan damfara (an cire yawancin lambobi) daban har shekara 2 don kare wasu da inganta KudiGuard; DELETE yana share waɗanda aka ɗauka daga saƙonninku na kwanan nan. Ta hanyar ci gaba, kun amince da wannan.
    ℹ️ Wannan jagora ce kawai, ba shawarar kuɗi ta ƙwararru ba.
    _N-ATLaS is an initiative of the Federal Ministry of Communications, Innovation and Digital Economy and powered by Awarri Technologies._
  choose_language: Wane harshe zan yi amfani da shi?
  btn_language_menu: Zaɓi harshe
  language_set: ✅ Zan amsa muku da {language}.
  beta_language: ℹ️ Tallafin {language} sabo ne, don haka wasu amsoshi na iya samun kurakurai.
  listening: 🎧 Ina saurare…
  checking: 🔎 Ina dubawa…
  i_heard: '🗣️ Na ji: “{transcript}”'
  verdict_likely_scam: 🔴 *Wannan yana kama da DAMFARA*
  verdict_caution: '🟠 *Ku yi hankali: akwai alamun gargaɗi*'
  verdict_no_flags: 🟢 *Ban ga alamun damfara ba.* Duk da haka ku tabbatar da bankinku kafin ku yi komai.
  what_to_do: '*Abin da za ku yi:*'
  where_to_report: '*Inda za ku kai rahoto:*'
  disclaimer: _Jagora ce kawai, ba shawarar kuɗi ta ƙwararru ba._
  feedback_prompt: Shin wannan ya taimaka?
  feedback_thanks: 🙏 Na gode! Ra'ayinku yana taimaka mana kare mutane da yawa.
  btn_helpful: 👍 Ya taimaka
  btn_not_helpful: 👎 Bai taimaka ba
  btn_what_to_do: Me zan yi?
  btn_report: Ina zan kai rahoto?
  btn_warn_family: Gargaɗi iyalina
  warn_family_intro: Ku tura wannan ga iyalinku da abokanku 👇
  warn_family_footer: An raba daga KudiGuard. Ku duba saƙonnin da kuke shakka kyauta a WhatsApp.
  greeting_reply: 👋 Sannu! Ku aiko mini saƙon murya ko saƙon da kuke shakka, ko ku yi kowace tambaya game da kuɗi.
  not_understood: Yi haƙuri, ban ji sosai ba. Don Allah ku sake gwadawa ko ku rubuta saƙonku.
  audio_too_long: ⏱️ Don Allah ku aika saƙon murya wanda bai wuce daƙiƙa {seconds} ba.
  unsupported: Ina iya karanta rubutu da sauraron saƙon murya. Don Allah ku aika ɗaya daga cikinsu.
  rate_limited: ⏳ Kun aiko saƙonni da yawa. Don Allah ku jira kaɗan sannan ku sake gwadawa.
  error_retry: 😔 Yi haƙuri, an sami matsala a ɓangarena. Don Allah ku sake gwadawa nan ba da daɗewa ba.
  stopped: Ba za ku ƙara samun saƙonni daga KudiGuard ba. Ku aika kowane saƙo don sake farawa.
  deleted: 🗑️ An share saƙonninku da duk saƙonnin murya da kuka ba da gudummawa.
  fallback_scam: "Kada ku tura kuɗi, kuma kada ku bayar da wata lamba, PIN ko kalmar sirri. Ku daina hulɗa da su, ku kira bankinku ta lambar da ke jikin katinku."
  fallback_answer: "Ban iya shirya cikakkiyar amsa yanzu ba. Don Allah ku sake gwadawa nan ba da jimawa ba, ko ku tambayi bankinku kai tsaye."
  fallback_steps: |-
    1. Kada ku bayar da wata lamba (OTP), PIN ko kalmar sirri.
    2. Kada ku tura kuɗi ko ku buɗe hanyar haɗi (link) daga wannan mutumin.
    3. Ku kira bankinku ta lambar da ke jikin katinku ku kai rahoto.
  warn_family_fallback: "⚠️ Gargaɗi kan damfara: wani zai iya tuntuɓarku yana cewa daga banki ko hukumar gwamnati yake, ko yana alƙawarin kuɗi. Kada ku taɓa bayar da OTP, PIN ko BVN ɗinku, kuma kada ku biya kuɗi don karɓar kuɗi. Ku tabbatar da bankinku tukuna."
  at_capacity: "😔 KudiGuard ta cika yanzu. Don Allah ku sake gwadawa bayan 'yan kwanaki."
  busy: "⏳ Mutane da yawa suna tambaya yanzu. Don Allah ku sake gwadawa bayan minti ɗaya."
  privacy_link: "🔐 Sanarwar sirri: {url}"
  # Voice-note donation: DRAFT, pending native-speaker review (keep in step with DONATION_VERSION).
  donation_offer: |-
    🎙️ *Zaɓi ne: ku taimaka wa KudiGuard ta fahimci muryoyin 'yan Najeriya*
    Za mu iya adana saƙonnin murya da kuke aikowa daga yanzu, don gwada da inganta fahimtar magana?
    • Sai idan kun kai shekara *18 ko fiye*, kuma saƙonnin murya da *muryarku* kawai. Don Allah kada ku aiko rikodin muryar wasu mutane; ba a taɓa adana saƙonnin murya da aka tura ba.
    • Wasu ƙalilan amintattun masu bita da masu rubutawa, ƙarƙashin yarjejeniyar sirri a rubuce, za su saurare su su rubuta abin da aka faɗa. Ba ma amfani da muryarku don gane ku, kuma ba ma sayar da ita ko wallafa ta.
    • Ana adana su a ɓoye (encrypted) a sabar KudiGuard ta kanta har tsawon watanni 12, ba tare da lambar wayarku ba.
    • Ku aika *STOP DONATING* a kowane lokaci don dakatarwa da share su (*DELETE* ma yana share su).
    KudiGuard tana aiki iri ɗaya ko kun ce eh ko a'a.
  btn_donate_yes: "✅ Ee, na kai 18+"
  btn_donate_no: "A'a, na gode"
  donation_on: "✅ Na gode! Daga yanzu muna adana saƙonnin murya da kuka aiko da muryarku (ba waɗanda aka tura ba) har tsawon watanni 12 don inganta fahimtar magana. Ku aika *STOP DONATING* a kowane lokaci don dakatarwa da share su."
  donation_off: "🗑️ An dakatar da gudummawar murya. An share duk saƙonnin murya da kuka ba da gudummawa, kuma ba za a adana sababbi ba."
  donation_declined: "👍 Babu damuwa. Ba za a adana saƙonnin muryarku ba: ana share su bayan an rubuta su."
