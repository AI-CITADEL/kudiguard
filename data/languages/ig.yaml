# Igbo (beta). Accents are stripped before matching.
# Native terms below are a starter set and MUST be reviewed by a native speaker before launch.
code: ig
name: Igbo
native_name: Igbo
order: 3
status: beta
asr_model: NCAIR1/Igbo-ASR
asr_whisper_language: null  # Whisper has no Igbo token: the fine-tuned model decides
review:
  lexicon: pending-native-review
  strings: pending-native-review

commands:
  stop: [kwụsị]
  delete: [hichapụ ozi m, hichapụ data m]
  language: [asụsụ, gbanwee asụsụ]
  donate: [nye onyinye olu, onyinye olu]  # DRAFT, pending native review
  stop_donating: [kwụsị onyinye olu]  # DRAFT
  greetings: [ndewo, kedu, kedụ, ụtụtụ ọma, ehihie ọma, mgbede ọma, daalụ, daalụ nke ukwuu, nnọọ, ọ dị mma]

output_guard:
  safety_claims:
    - '(?:o )?a?bughi (?:aghugho|wayo)'
    - 'enweghi ihe ize ndu'
  refusals:
    - 'enweghi m ike inyere'

lexicon:
  flags:
    urgency:
      - 'ngwa ngwa'
    asks_credentials:
      - '(?:zitere|zite|ziga|nye)\W+(?:ya|ha|anyi|m|mu)\W+(?:\w+\W+){0,2}?(?:koodu|code|otp|pin|okwuntughe)'
    account_threat:
      - '(?:akauntu|account)\W+(?:\w+\W+){0,4}?(?:emechi|akpochi|mechie|kpochie)'
      - '(?:emechi|akpochi|mechie|kpochie)\W+(?:\w+\W+){0,1}?(?:akauntu|account)'
    guaranteed_returns:
      - 'okpukpu (?:abuo|ato)'
    upfront_fee:
      - 'kwu\w*\W+(?:\w+\W+){0,4}?(?:tupu|ka i nweta|ka i nata)'
    secrecy:
      - 'agwala onye (?:obula|o bula)'
  check_intent:
    - 'wayo'
    - 'aghugho'

# Fixed user-facing text: DRAFT, pending native-speaker review. Buttons (btn_*) max 20 chars.
strings:
  welcome: |-
    👋 Nnọọ na *KudiGuard*. Ana m enyere gị aka ịmata aghụghọ ego na ịza ajụjụ gbasara ego.

    Zitere m *ozi olu* ma ọ bụ ozi ederede, ma ọ bụ zigharịa ozi ọ bụla ị na-enweghị obi ike na ya.

    🔒 Anyị na-echekwa ozi gị ruo ụbọchị 90 iji melite ọrụ anyị. Ndị nyocha ole na ole a tụkwasịrị obi (ndị otu anyị ma ọ bụ ndị asụsụ ahụ bụ asụsụ obodo ha, n'okpuru nkwekọrịta nzuzo e dere ede) nwere ike ịgụ ụfọdụ ozi na nzaghachi, e zochiri nọmba, na-enweghị nọmba ekwentị gị ma ọ bụ ihe ọ bụla na-egosi onye ị bụ, iji lelee ịdị mma na nchekwa; a na-ehichapụ mbipụta ha mgbe nlele ahụ gasịrị. A na-echekwa nọmba ekwentị gị naanị n'ụdị nzuzo, a na-ehichapụkwa ozi olu mgbe e dechara ha, ma ọ bụrụ na ị họrọghị inye ha onyinye (anyị ga-ajụ iche). Zipu *DELETE* n'oge ọ bụla iji hichapụ ozi gị, ma ọ bụ *STOP* iji kwụsị. A na-echekwa ihe atụ aghụghọ (e wepụrụ ọtụtụ nọmba) iche ruo afọ 2 iji chebe ndị ọzọ ma melite KudiGuard; DELETE na-ehichapụkwa ndị e si n'ozi gị nso nso a wepụta. Site n'ịga n'ihu, ị kwenyere na nke a.
    🌍 Iji rụọ ọrụ KudiGuard, ozi gị na-agafe na WhatsApp (Meta) na Cloudflare, na mpụga Naịjirịa, a na-echekwakwa ha na sava anyị {where}. Iwu nchekwa data nke Naịjirịa nwere ike ọ gaghị echedo data dị na mba ofesi kpamkpam. Site n'ịga n'ihu, ị kwenyekwara na mbufe a.
    ℹ️ Nke a bụ ndụmọdụ, ọ bụghị ndụmọdụ ego nke ọkachamara.
    _N-ATLaS is an initiative of the Federal Ministry of Communications, Innovation and Digital Economy and powered by Awarri Technologies._
