strings:
  welcome: |-
    👋 Nnọọ na *KudiGuard*. Ana m enyere gị aka ịmata aghụghọ ego na ịza ajụjụ gbasara ego.

    Zitere m *ozi olu* ma ọ bụ ozi ederede, ma ọ bụ zigharịa ozi ọ bụla ị na-enweghị obi ike na ya.

    🔒 Anyị na-echekwa ozi gị ruo ụbọchị {retention_days} iji melite ọrụ anyị. Ndị nyocha ole na ole a tụkwasịrị obi (ndị otu anyị ma ọ bụ ndị asụsụ ahụ bụ asụsụ obodo ha, n'okpuru nkwekọrịta nzuzo e dere ede) nwere ike ịgụ ụfọdụ ozi na nzaghachi, e zochiri ọtụtụ nọmba, na-enweghị nọmba ekwentị gị ma ọ bụ ihe ọ bụla na-egosi onye ị bụ, iji lelee ịdị mma na nchekwa; a na-ehichapụ mbipụta ha mgbe nlele ahụ gasịrị. A na-echekwa nọmba ekwentị gị naanị n'ụdị nzuzo, a na-ehichapụkwa ozi olu mgbe e dechara ha, ma ọ bụrụ na ị họrọghị inye ha onyinye (anyị ga-ajụ iche). Zipu *DELETE* n'oge ọ bụla iji hichapụ ozi gị, ma ọ bụ *STOP* iji kwụsị. A na-echekwa ihe atụ aghụghọ (e wepụrụ ọtụtụ nọmba) iche ruo ụbọchị {pattern_retention_days} iji chebe ndị ọzọ ma melite KudiGuard; DELETE na-ehichapụkwa ndị e si n'ozi gị nso nso a wepụta. Site n'ịga n'ihu, ị kwenyere na nke a.
    🌍 Iji rụọ ọrụ KudiGuard, ozi gị na-agafe na WhatsApp (Meta) na Cloudflare, na mpụga Naịjirịa, a na-echekwakwa ha na sava anyị {where}. {risk} Site n'ịga n'ihu, ị kwenyekwara na mbufe a.
