# Igbo (beta). Accents are stripped before matching.
# Native terms below are a starter set and MUST be reviewed by a native speaker before launch.
code: ig
name: Igbo
native_name: Igbo
order: 3
status: beta
asr_model: NCAIR1/Igbo-ASR
# Whisper has no Igbo token. Left on auto, the NCAIR1 Igbo model detects "yo" on every FLEURS clip (p ~1.0), so
# forcing "yo" gives identical transcripts (10/10) and skips detection: ~3 s faster (docs/SPIKES.md H, 10 Oct 2026).
asr_whisper_language: yo
review:
  lexicon: pending-native-review
  strings: pending-native-review

commands:
  stop: [kwụsị]
  delete: [hichapụ ozi m, hichapụ data m]
  language: [asụsụ, gbanwee asụsụ]
  donate: [nye onyinye olu, onyinye olu]  # DRAFT, pending native review
  stop_donating: [kwụsị onyinye olu]  # DRAFT
  greetings: [ndewo, kedu, kedụ, ụtụtụ ọma, ehihie ọma, mgbede ọma, daalụ, daalụ nke ukwuu, nnọọ, ọ dị mma]

output_guard:
  safety_claims:
    - '(?:o )?a?bughi (?:aghugho|wayo)'
    - 'enweghi ihe ize ndu'
  refusals:
    - 'enweghi m ike inyere'
  # DRAFT, native review pending. Positive imperatives only: negative ones are different words ("enyela", "akwula").
  unsafe_instructions:
    - '(?:zite|ziga|nye|gwa)\W+(?:(?:ha|ya|onye)\W+)?(?:\w+\W+)?(?:otp|pin|bvn|koodu|okwuntughe|code)'
    - 'kwuo\W+(?:\w+\W+)?(?:fee|ugwo nhazi|ugwo ndebanye)'
    - '(?:pia|meghe)\W+(?:\w+\W+)?link'
    - '(?:budata|wunye)\W+(?:anydesk|teamviewer|\w*apk)'
    - '(?:budata|wunye)\W+(?:\w+\W+)?app(?!.*(?:play store|app store|google play|ulo aku))'
    - '(?:zighachi|weghachi|nyeghachi)\W+(?:\w+\W+)?ego'
  instruction_prefixes:
    - '(?:biko|ugbu|ozugbo)'
  negations:
    - '(?:ekwela|agaghi|ebula)'
  clause_breaks:
    - '(?:mana)'

# Malicious-use screens (safety/abuse.py, docs/ABUSE.md). DRAFT, pending native review; the English/Pidgin phrases
# also apply.
abuse:
  crisis:
    - 'achoro\W+m\W+ibi\W+ndu\b'
    - '(?:igbu|gbuo|gbue|egbu)\W*onwe\W*m\b'
    - 'achoghi\W+m\W+(?:ibi\W+ndu|idi\W+ndu)'
    - 'achoro\W+m\W+inwu'
    - '(?:ka|ya)\W+m\W+nwuo'
  crisis_other:
    - '(?:igbu|gbuo|gbue|egbu)\W*onwe\W*ya\b'
  crisis_exemplars:
    - Achoro m igbu onwe m
    - Achoghi m ibi ndu ozo
    - Ka m nwuo, ego m niile agaala
  abuse:
    - 'onye\W+nzuzu'
    - 'onye\W+ara\b'
    - 'nwa\W+ofeke'
    - 'i\W+bu\W+(?:onye\W+)?(?:nzuzu|ara|ofeke|anu\W+ohia)'
  scam_tool:
    - 'dee\W+(?:m\W+)?ozi\W+(?:aghugho|adigboroja|ntiwapu|ugha)'
    - 'dee\W+(?:m\W+)?ozi\W+(?:di|dika)\W+(?:ka\W+)?nke\W+(?:banki|ulo\W+aku)'
    - 'dee\W+(?:m\W+)?ozi\W+(?:\w+\W+){0,4}?(?:ka|dika)\W+(?:\w+\W+){0,1}?nke\W+ulo\W+aku'
    - 'kedu\W+ka\W+m\W+ga\W+esi\W+(?:nweta|zuru)\W+(?:\w+\W+){0,2}?onye\W+ozo'
    - 'alert\W+adigboroja'
    - 'nyere\W+m\W+aka\W+dee\W+ozi\W+na'
  injection:
    - 'system\W*prompt\W+(?:gi)\b'
    - 'chefuo\W+(?:\w+\W+){0,2}?ntuziaka'
    - 'e?leghara\W+(?:\w+\W+){0,2}?(?:iwu|ntuziaka)\w*\W+(?:\w+\W+){0,1}?anya'
    - 'mee\W+ka\W+a\W+si\W+na\W+i\W+bu'
    - 'ugbu\W+a\W+i\W+bu\W+(?:onye\W+oru|onye\W+nnochite|customer\W+care)'
    - 'ntuziaka\W+(?:\w+\W+){0,1}?e\W+nyere\W+gi'
    - 'ozi\W+nye\W+ai'
    - 'tugharia\W+(?:\w+\W+){0,8}?ma\W+mee\W+ihe\W+o\W+kwuru'
    - 'site\W+ugbu\W+a\W+(?:zaa|kwuo)'
    - 'kwuo\W+na\W+(?:ozi\W+)?(?:a\W+)?(?:abughi\W+(?:aghugho|wayo)|di\W+mma|bu\W+eziokwu)'
  injection_reported:
    - '(?:kwuru|si|siri)\W+na|zitere\W+m'
  asr_hallucinations:
    - 'daalu\W+maka\W+ikiri'
  asr_annotations:
    - 'egwu'
  ai_questions:  # DRAFT
    - 'i\W+bu\W+(?:mmadu|igwe)\b'
  ai_denials:  # DRAFT
    - 'abu\W+m\W+mmadu\b'
    - 'abughi\W+m\W+igwe'
  persona_claims:
    - '(?:abu\W+m|anyi\W+bu)\W+(?:onye\W+oru|ndi\W+oru)\W+(?:\w+\W+){0,1}?ulo\W+aku'

lexicon:
  # Terms marked H were added for parity with Hausa (workstream H, 10 Oct 2026): DRAFT, pending native review.
  # Each is pinned by a firing message and a no-fire check on the packs and safe advice (tests/unit/test_scam_rules.py).
  flags:
    threat:  # DRAFT, native review pending
      - 'ma\W+o\W+bu\W+anyi\W+ga\W+egbu\W+gi\b'
      - 'anyi\W+ga\W+egbu\W+gi\b'
      - 'ma\W+o\W+bu\W+i\W+ga\W+anwu\b'
    urgency:
      - 'ngwa ngwa'
      - 'ozugbo ozugbo'  # H: "immediately, immediately"
    asks_credentials:
      - '(?:zitere|zite|ziga|nye)\W+(?:ya|ha|anyi|m|mu)\W+(?:\w+\W+){0,2}?(?:koodu|code|otp|pin|okwuntughe)'
      # H: "tell him/them the code". Third-person objects only: "gwa m ihe OTP putara" (tell me what OTP means) and
      # "agwaghi m ya PIN m" (I did not tell him my PIN) are ordinary.
      - '(?:agwa|gwa|agwaghi)\W+(?:ya|ha)\W+(?:\w+\W+){0,2}?(?:koodu|code|otp|pin|okwuntughe)'
    account_threat:
      - '(?:akauntu|account)\W+(?:\w+\W+){0,4}?(?:emechi|akpochi|mechie|kpochie)'
      - '(?:emechi|akpochi|mechie|kpochie)\W+(?:\w+\W+){0,1}?(?:akauntu|account)'
    guaranteed_returns:
      - 'okpukpu (?:abuo|ato)'
      # H: "if I put in ... I/they will get/give ... within N weeks/months" (mirrors the English pivot term)
      - 'tinye\W+(?:\w+\W+){0,6}?(?:ga-enweta|ga-enye|ga-anata|ga enweta|ga enye|ga anata)\W+(?:\w+\W+){0,6}?(?:n\Wime|kwa) (?:\w+\W+){0,1}?(?:izu|onwa|ubochi)'
    upfront_fee:
      - 'kwu\w*\W+(?:\w+\W+){0,4}?(?:tupu|ka i nweta|ka i nata)'
      - 'ugwo (?:ndebanye aha|nhazi|registration|processing)'  # H: "registration/processing fee"
    prize_lottery:
      - 'meriri\W+(?:\w+\W+){0,2}?(?:ego|onyinye|nrite)'  # H: "won money/a prize"
    secrecy:
      - 'agwala onye (?:obula|o bula)'
  check_intent:
    - 'wayo'
    - 'aghugho'

