    👋 Nnọọ na *KudiGuard*. Ana m enyere gị aka ịmata aghụghọ ego na ịza ajụjụ gbasara ego.

    Zitere m *ozi olu* ma ọ bụ ozi ederede, ma ọ bụ zigharịa ozi ọ bụla ị na-enweghị obi ike na ya.

    🔒 Anyị na-echekwa ozi gị ruo ụbọchị 90 iji melite ọrụ anyị. A na-echekwa nọmba ekwentị gị naanị n'ụdị nzuzo, a na-ehichapụkwa ozi olu mgbe e dechara ha. Zipu *DELETE* n'oge ọ bụla iji hichapụ ozi gị, ma ọ bụ *STOP* iji kwụsị. Site n'ịga n'ihu, ị kwenyere na nke a.
    ℹ️ Nke a bụ ndụmọdụ, ọ bụghị ndụmọdụ ego nke ọkachamara.
