  where_nigeria: "in Nigeria"
  risk_outside: "Nigerian data-protection law may not fully protect data held abroad."
  risk_nigeria: "Data passing through Meta and Cloudflare may be processed abroad, where Nigerian data-protection law may not fully apply."
  # Sent before the welcome reached the user: not taken as consent.
  read_welcome: "☝️ Please read the message above, then reply to continue."
  # Malicious-use screens (docs/ABUSE.md). crisis_reply help resources, checked by web search 2026-10-10/11 from
  # third-party sources only (SURPIN's own site, surpinng.com, could not be reached):
  #   112: Nigeria's toll-free national emergency number (Nigerian Communications Commission, ncc.gov.ng; adopted as
  #        the unified national emergency number by the National Economic Council, 30 Apr 2026).
  #   SURPIN (Suicide Research and Prevention Initiative), 24 hours:
  #     0800 078 7746, toll-free: Lifeline International member page (lifeline-international.com/member/nigeria-surpin,
  #       "+234 (0) 8000787746 (Toll Free) 24 hours") and findahelpline.com (Nigeria, suicidal thoughts).
  #     0903 440 0009 and 0908 021 7555: the same Lifeline International page, and findahelpline.com's SURPIN listing
  #       (labelled MTN and 9mobile lines).
  #     0814 224 1007, Hausa line run with Jos University Teaching Hospital (JUTH), in ha.yaml only: the same
  #       Lifeline International page ("Hausa - Helpline services provided by partners JUTH") and findahelpline.com's
  #       SURPIN listing ("support in Hausa +234-814-224-1007"), both checked 2026-10-11.
  #   Never use 08111909909 or 07013811143 (unverified numbers seen in some lists).
  #   LAUNCH BLOCKER (docs/DEPLOY.md): call every number before launch and every quarter; remove any that fails here
  #   and in ha/yo/ig, and keep "112 / someone you trust" if no SURPIN line works.
  crisis_reply: |-
    💛 I am really sorry you are going through this. You matter, and you do not have to face this alone.
    If you might act on these thoughts or you are in danger now, call *112* (free emergency line) or go to the nearest hospital.
    You can talk to someone at the *SURPIN* helpline, open 24 hours: *0800 078 7746* (free), or *0903 440 0009* / *0908 021 7555*.
    Please also tell someone you trust how you feel today.
    When you are ready, I can help with the money: call your bank on the number printed on your card and tell them what happened.
  crisis_other_reply: |-
    💛 Thank you for reaching out for them. If they might act on it now or they are in danger, call *112* (free emergency line) and stay with them, or take them to the nearest hospital.
    They, or you, can talk to someone at the *SURPIN* helpline, open 24 hours: *0800 078 7746* (free), or *0903 440 0009* / *0908 021 7555*.
    Listen to them without judging, and do not leave them alone if you are worried. If you feel this way too, the same help is there for you.
