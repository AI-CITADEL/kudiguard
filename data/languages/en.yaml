# English — also the pivot language: every message is translated to English, so this lexicon always applies.
# Terms are Python regular expressions matched against normalised text (lower-case, accents stripped,
# "o.t.p" / "o t p" -> "otp", curly quotes -> ') with word boundaries added automatically.
# Terms must be lower-case ASCII-folded and must not match the empty string (enforced at load time).
#
# Gap idiom: (?:(?!my\b|our\b)\w+\W+){0,6}? = "up to 6 words, never crossing 'my'/'our'", so a user asking
# about *their own* PIN ("should I give my PIN to anyone?") is not read as someone *requesting* it.
code: en
name: English
native_name: English
order: 4
status: stable
asr_model: NCAIR1/NigerianAccentedEnglish
asr_whisper_language: en

# Output guard: patterns (accent-folded, like the lexicon) checked on every generated reply.
commands:
  stop: [stop, unsubscribe, stop messages]
  delete: [delete, delete my data, erase my data, delete everything]
  language: [language, change language, languages]
  greetings: [hi, hello, hey, hiya, good morning, good afternoon, good evening, good day, thanks, thank you,
    thank you so much, thanks a lot, ok, okay, ok thanks, okay thank you, alright, nice, great, cool]

output_guard:
  # Anchored to a subject so ordinary advice ("keep your PIN safe", "your money is safe only when...") passes.
  safety_claims:
    - '(?:(?:it|this|that)''s|(?:it|this|that|the)\W+(?:(?:offer|message|link|app|company|investment|deal|person|caller|alert|account|business|opportunity)\W+)?(?:is|looks|seems|appears|sounds))\W+(?:to be\W+)?(?:completely\W+|totally\W+|very\W+|quite\W+)?(?:safe|genuine|legit\w*|trustworthy|real|authentic|verified)(?!\W+to\W+(?:say|pay|send|share|click|invest|proceed|transfer)\b)'
    - '(?:not|isn''t|is not|isnt)\W+(?:a\W+)?(?:scam|fraud\w*)'
    - 'no (?:scam|fraud)\w*(?: here)?'
    - 'no (?:risk|danger)(?!\W*free)'
    - 'nothing to (?:worry|fear)'
    - '(?:safe|okay|ok|fine|alright) to (?:pay|send|share|click|invest|proceed|transfer)(?!\W+(?:this|the|our)\W+(?:message|warning|alert|information|tip)\w*|\W+this\W+(?:with|to)\W+(?:your\W+|the\W+)?(?:family|friends|others|loved ones|people|bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))|police|efcc|ncc|fccpc|cbn))'
    - 'go ahead (?:and )?(?:pay|send|share|invest|transfer|click)'
    - 'you can (?:trust (?:them|him|her|it|this)|go ahead)'
    - 'e dey real'
    - 'na correct'
    - 'nothing suspicious'
    - 'feel free to (?:pay|send|share|transfer|invest)(?!\W+(?:this|the|our)\W+(?:message|warning|alert|information|tip)\w*|\W+this\W+(?:with|to)\W+(?:your\W+|the\W+)?(?:family|friends|others|loved ones|people|bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))|police|efcc|ncc|fccpc|cbn))'
    - '(?:perfectly )?fine for you to (?:pay|send|share|transfer|invest)'
    - '(?:don''t|do not|dont) (?:need|have) to worry'
  refusals:
    - 'i\W*(?:can''t|cannot|can not|am unable to|''m unable to|won''t be able to)\W+(?:help|assist|provide)'
    - 'as an ai'
    - 'i''m sorry,? but i'
  # Instructions that do what the scammer wants, per clause, after lead-in only (see safety/output_guard.py and the
  # probe set tests/fixtures/guard_probes.yaml: every probe must keep passing).
  unsafe_instructions:
    - '(?:share|send|give|tell|forward|reveal|disclose|text|paste|dictate|provide|submit)\W+(?:(?:them|him|her|me|it|anyone|someone|the\W+[\w'']+(?:\W+[\w'']+)?)\W+)?(?:(?:your|the|that|this|their|any|a|my)\W+)?(?:\d+\W*digits?\W+|six\W+digit\W+|new\W+|secret\W+)?(?:otp|pin|(?:bvn|nin)(?!.*\b(?:your bank|branch|the bank|bank app|agent banking)\b)|password|passcode|cvv|code|card details|card number|token|login details)(?!\W+(?:was|is|were|has|had|got|will)\b(?!\W+\d))(?!\W+only\W+(?:in|on|through|via|inside|to|with)\W+(?:the\W+)?official\W+(?:bank\W+)?app\b(?!\W+(?:that|which|he|she|they|someone|the)\b))(?!\W+only\W+(?:in|on|through|via|inside|to|with)\W+your\W+(?:own\W+)?(?:(?:app|phone|banking app)\b|bank(?:''s)?\W+app\b|bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:officer|agent|manager|staff|representative|rep|customer|man)\b)))'
    - 'read\W+(?:out\W+)?(?:(?:your|the|that|this|my)\W+)?(?:otp|pin|code|password|bvn)\W+(?:out\W+)?to\b'
    - 'read\W+out\W+(?:(?:your|the|that|this|my)\W+)?(?:otp|pin|code|password|bvn)'
    - '(?:here\W+is|here''s)\W+(?:my|the)\W+(?:pin|otp|code|password|bvn)'
    - '(?:my|our)\W+(?:pin|otp|code|password|bvn)\W+is\W+\d+'
    - '(?:say|tell|read\W+out|type)\W+(?:(?:them|him|her)\W+)?(?:that\W+)?(?:my|the|your)\W+(?:pin|otp|code|password|bvn)\W+is\W+\d+(?!.*\bbank''s\W+(?:ivr|app)\b)'
    # a place someone else controls: their link/page/form/chat/email (any determiner) ...
    - '(?:type|enter|input|put|paste|insert)\W+(?:(?:your|the|that|this|my)\W+)?(?:new\W+)?(?:otp|pin|bvn|password|passcode|code|cvv|card details|card number)\s+(?:[\w'']+\s+){0,4}?(?:in|on|into|at)\s+(?:the|their|this|that|his|her|its|(?:their|his|her|its|someone''s|(?:the\s+)?(?!bank''s)[\w''.-]+''s))\s+(?:[\w''.-]+\s+)?(?:link|page|site|website|form|chat|email|e-mail|sms|ivr)(?!.*\b(?:yourself|your own|own app|your bank''?s? app|the bank''?s? app|bank''s own)\b)'
    # ... or a device that is someone else's ("his phone", "the agent's POS", "the machine he gives you"), not
    # the user's own app/phone/ATM/keypad ("enter your PIN in the app", "on the ATM screen")
    - '(?:type|enter|input|put|paste|insert)\W+(?:(?:your|the|that|this|my)\W+)?(?:new\W+)?(?:otp|pin|bvn|password|passcode|code|cvv|card details|card number)\s+(?:[\w'']+\s+){0,4}?(?:in|on|into|at)\s+(?:(?:their|his|her|its|someone''s|(?:(?:the|a|an)\s+)?(?!(?:bank|merchant|shop|store|cashier|supermarket|attendant)''s)[\w''.-]+''s|your\s+(?!(?:phone|device|own|bank|mobile|laptop|computer)''s)[\w''.-]+''s)\s+(?:[\w''.-]+\s+)?(?:phone|laptop|computer|machine|pos|terminal|device|screen|app|keypad|atm)|the\s+(?:[\w''.-]+\s+)?(?:phone|laptop|computer|machine|pos|device)\s+(?:that|which|the|he|she|they|someone)\b|the\s+(?:[\w''.-]+\s+)?(?:screen|keypad|terminal)\s+(?:he|she|they|someone|the\s+(?:agent|caller|man|woman|scammer|person|officer|staff|stranger))\b)(?!.*\b(?:yourself|your own|own app|your bank''?s? app|the bank''?s? app|bank''s own)\b)'
    - 'reply\W+(?:(?:to\W+)?(?:them|him|her|(?:his|her|their|the)\W+[\w'']+)\W+)?with\W+(?:(?:your|the|that|this)\W+)?(?:otp|pin|bvn|password|code|cvv)'
    - 'pay\W+(?:(?:the|a|an|this|that|their|his|her)\W+)?(?:(?:n|ngn)?\d[\d,.]*k?\W+)?(?:(?:processing|registration|clearance|activation|delivery|release|unlock(?:ing)?|verification|admin|service|upfront|insurance|membership|application|transfer|tax|customs|small)\W+)?(?:fees?|charges?)(?!\W+only\W+(?:if|after|at|in|on|when)\b)(?!\W+(?:only\W+)?(?:through|via|from|using|in|on|at)\W+(?:your|the official|official|the bank))'
    - '(?:pay|send|transfer)\W+(?:(?:them|him|her|the agent|the caller)\W+)?(?:n|ngn)?\d[\d,.]*k?'
    - 'pay\W+(?:only\W+)?(?:via|through|using|with)\W+(?:the|their|this|that|his|her)\W+(?:[\w''.-]+\W+)?(?:link|page|site|website|form|agent(?!\W+(?:at|in)\W+(?:your|the)\W+bank))'
    - '(?:pay|send money|transfer)\W+(?:only\W+)?(?:via|through|using|with|into|to)\W+(?:the|their|this|that|his|her)\W+(?:qr\W+code|account\W+number|account)\W+(?:he|she|they|someone|that|which|in\W+(?:the|their|this|that)\W+(?:message|sms|link|chat|email)|from\W+(?:the\W+)?(?:message|sms|caller|agent))\b'
    - '(?:click|open|tap|follow|visit)\W+(?:on\W+)?(?:(?:the|this|that|their|any|his|her)\W+)?link(?!\W+only\W+(?:(?:if|after|at|in|on|when)\b|(?:through|via|from)\W+(?:your|the official|official|the bank)))'
    - '(?:install|download)\W+(?:(?:the|this|that|their)\W+)?(?:anydesk|teamviewer|[\w.]*apk)'
    - '(?:install|download)\W+(?:(?:the|this|that|their|an|a)\W+)?(?:[\w.]+\W+)?(?:app|software)(?!.*(?:play store|app store|google play|of your bank|your bank))'
    - '(?:send|transfer|pay|give|return)\W+(?:(?:the|their|that|this|his|her)\W+)?(?:money|funds|cash|it)\W+back'
    - 'refund\W+(?:it|them|the money)'
  # Everything before the verb must be made of these (phrases first: the longest match is consumed).
  # "by sending the OTP" / "by typing it on his phone": an instruction wherever it sits ("Verify your account by ...").
  means_instructions:
    - 'by\W+(?:sending|giving|sharing|telling|forwarding|typing|entering|pasting|reading(?:\W+out)?|dictating)\W+(?:(?:them|him|her|me|the\W+[\w'']+)\W+)?(?:(?:your|the|that|this|their|my)\W+)?(?:otp|pin|bvn|password|passcode|cvv|code|card details)'
    - 'by\W+(?:typing|entering|pasting|putting)\W+it\W+(?:on|in|into)\W+(?:the|their|his|her|[\w'']+''s)\W+(?:[\w''.-]+\W+)?(?:link|page|site|website|form|chat|email|phone|laptop|machine|pos|device)'
    - 'by\W+(?:providing|submitting)\W+(?:(?:your|the|that|this|their|my)\W+)?(?:otp|pin|password|passcode|cvv|code|card details|card number|(?:bvn|nin)(?!.*\b(?:your bank|branch|the bank|bank app|agent banking)\b))'
  instruction_prefixes:
    - '(?:all you need to do is|your next step is to|the best thing is to|the only way is to|it(?:''s| is) important that you|(?:i|we) (?:recommend|suggest|advise)(?: that)?(?: you)?(?: to)?|it(?:''s| is) (?:best|okay|ok|fine|safe|alright|better|important) (?:that you|to)|(?:make|be) sure(?: that)?(?: you| to)?|remember to|try to|feel free to|go ahead and|you(?:''ll| will| may| could| might| would| should| can| must| are to| need to| have to)|unless you|as long as you|provided(?: that)? you|otherwise|right now|before anything|in this case|for verification|as (?:they|he|she|the [\w'']+) (?:said|says|asked|instructed)|do as (?:they|he|she|the [\w'']+) (?:said|says|asked))'
    - '(?:please|kindly|just|then|now|quickly|immediately|simply|also|first|definitely|safely|carefully|certainly|surely|only|yes|ok|okay|officially|actually|go|ahead|and|to|do|better|right|away|need|have|want|might|so)'
  negations:
    - '(?:not|no|never|ever|\w+n''t|dont|cannot|avoid|refuse|neither|nor)'
  negations_after:
    - '(?:no one|nobody|noone|no-one|nothing)'
  clause_breaks:
    - '(?:and|but|just|so|then)'
  condition_breaks:
    - '(?:unless|as long as|provided|otherwise)'
  speech_commands:
    - '(?:do|as|follow|just)'
  pronoun_instructions:
    - '(?:send|share|give|forward|tell|read|dictate|paste|provide)\W+(?:(?:them|him|her|me)\W+)?it(?!.*\b(?:to|with)\W+(?:your\W+bank(?!\W*''?s?\W*(?:staff|agent|officer|official|man|worker))|(?:the\W+)?bank\b(?!\W*(?:''s\W*)?(?:staff|agent|officer|official|man|woman|worker|customer|rep\w*))|(?:the\W+)?(?:police|efcc|ncc|fccpc|cbn)\b))'
  credentials:
    - '(?:otp|pin|bvn|password|passcode|cvv|code)'
  outcome_claims:
    - '(?:you will|you''ll|you are going to)\W+(?:surely\W+|definitely\W+|certainly\W+)?(?:get|receive|recover)\W+(?:all\W+)?(?:of\W+)?(?:your\W+)?(?:money|funds|cash)\W+back'
    - '(?:money|funds|cash)\W+will\W+be\W+(?:refunded|returned|reversed|recovered)'
    - '(?:is|are)\W+(?:now\W+)?safe\W+now'
    - '(?:money|account|funds|savings)\W+(?:is|are)\W+(?:now\W+)?(?:completely\W+|totally\W+)?safe(?!\W+(?:only\W+)?(?:when|if)\W+you\W+(?:do\W+not|don''t|never|keep))'
    - '(?:account|bvn|nin|sim|card)\W+will\W+be\W+(?:blocked|suspended|closed|deactivated)'
  reported_speech:
    - '(?:said|says|saying|say|claim\w*|told|tell|tells|threaten\w*|pretend\w*|warn\w*|ask\w*|promised)'
  hedges_before:
    - '(?:no guarantee|not sure|maybe|may|might|could|if|unless|whether)'
  hedges_after:
    - '(?:if you report\w*|not guaranteed|no guarantee|but (?:it is )?not (?:certain|guaranteed)|as long as|in a licensed bank)'

lexicon:
  flags:
    asks_credentials:
      - '(?:send|give|share|tell|provide|confirm|read|forward|drop|call out|reply(?: with)?|dm|text|whatsapp|submit)\W+(?:(?!my\b|our\b)\w+\W+){0,6}?(?:otp|pin|cvv|password|passcode|token|verification code|security code|card (?:number|details)|login details|bvn|nin|(?:account|bank|atm|card) details|expiry date|(?:\d+[- ]?digits? )?code\W+(?:wey|that|which|we|dem|they|sent|you received))'
      - '(?:what is|whats) (?:your|ur) (?:otp|pin|cvv|password|bvn|nin|card number)'
      - 'ask(?:ed|ing|s)?\W+(?:\w+\W+){0,4}?for\W+(?:\w+\W+){0,3}?(?:otp|pin|cvv|password|passcode|token|verification code|security code|card (?:number|details)|login details|bvn|nin)'
      - '(?:otp|pin|cvv|password|verification code)\W+(?:\w+\W+){0,6}?(?:send|give|share|tell|forward)\W+(?:it|them|to me)'
    remote_access:
      - 'anydesk'
      - 'teamviewer'
      - 'quick ?support'
      - '(?:share|sharing) (?:your |my )?screen'
      - 'screen ?shar\w*'
      - 'remote access'
      - 'download\W+(?:\w+\W+){0,3}?app\W+(?:\w+\W+){0,6}?(?:fix|help|access|control|check|unblock)\w*\W+(?:\w+\W+){0,2}?(?:your|ur|my) (?:account|phone|app|bank)'
    guaranteed_returns:
      - 'double (?:your|ur|my) money'
      - 'guaranteed (?:return|profit|income|interest)s?'
      - '\d+ ?% (?:daily|weekly|monthly|per day|per week|per month|every (?:day|week|month))'
      - '(?:daily|weekly) (?:profit|returns?|roi|income)'
      - '(?:invest|put|pay|send|deposit)\W+(?:\w+\W+){0,3}?(?:and|to) (?:get|earn|receive|make)\W+[^\w\s]?\d[\w.,]*\W+(?:\w+\W+){0,3}?(?:in|within|every|daily|weekly|monthly|back|guaranteed)'
      - '(?:invest|put|pay|send|deposit)\W+(?:\w+\W+){0,5}?(?:i|you|u) (?:will|go|would|shall|can) (?:get|earn|receive|make|collect)\W+[^\w\s]?\d[\w.,]*\W+(?:\w+\W+){0,3}?(?:in|within|after|every|daily|weekly|monthly|back)'
    wrong_transfer:
      - '(?:sent|transferred|paid|credited)\W+(?:\w+\W+){0,4}?(?:to |into )?(?:your|ur) (?:account|number|line|wallet)\W+(?:\w+\W+){0,3}?(?:by mistake|in error|wrongly|mistakenly)'
      - '(?:mistakenly|wrongly) (?:sent|transferred|credited|paid)\W+(?:\w+\W+){0,4}?(?:to |into )?(?:you|your)'
      - '(?:please|kindly|pls|plz)\W+(?:\w+\W+){0,2}?(?:reverse|refund|send back|return)\W+(?:it|the money|the funds|the transfer|my money)'
    account_threat:
      - '(?:your|ur)\W+(?:\w+\W+){0,2}?(?:account|bvn|nin|sim|card|wallet|line|whatsapp)\W+(?:\w+\W+){0,4}?(?:blocked|suspended|deactivated|restricted|frozen|barred|disabled|banned|closed|don block|go block)'
      - '(?:block|suspend|deactivat|restrict|freez|bar|ban)\w*\W+(?:your|ur)\W+(?:\w+\W+){0,2}?(?:account|bvn|nin|sim|card|wallet|whatsapp)'
    upfront_fee:
      - '(?:processing|registration|clearance|release|activation|unlocking|verification|handling|insurance|approval) (?:fee|charge)s?'
      - 'pay\W+(?:\w+\W+){0,6}?(?:to|before|so that)\W+(?:you\W+|i\W+)?(?:can\W+)?(?:receive|claim|collect|release|withdraw|unlock|activate|approve|process|disburse|secure|get (?:the|your) (?:money|loan|prize|job))'
      - 'pay\W+(?:\w+\W+){0,4}?(?:registration|form|medical|delivery|customs|clearance)'
      - 'for (?:the )?(?:customs|clearance)'
    prize_lottery:
      - '(?:you|u|i) (?:have |just )?won'
      - 'winner'
      - '(?:won|win|claim|collect|redeem)\W+(?:\w+\W+){0,3}?prize'
      - '(?:cash|star|grand) prize'
      - 'prize (?:money|draw|winner)'
      - 'lottery'
      - 'lucky (?:draw|winner|number)'
      - 'giveaway'
      - '(?:have|has) been selected'
    fake_payment:
      - 'credit alert'
      - 'check (?:your|ur) (?:alert|account|phone|sms)'
      - '(?:send|release|deliver) (?:the )?(?:goods|items?|products?)'
    money_request:
      - 'stuck (?:at|in) (?:the )?(?:airport|customs|border|hospital)'
      - '(?:send|lend) me\W+(?:some )?(?:money|[^\w\s]?\d)'
    suspicious_link:
      - 'https?://(?![\w.-]*\.gov\.ng(?:[/\s]|$))\S+'
      - 'www\.(?![\w.-]*\.gov\.ng(?:[/\s]|$))\S+'
      - 'bit\.ly'
      - 'tinyurl'
      - '\w+\.apk'
      - '(?<![.])(?![\w.-]*\.(?:gov|edu)\.ng)(?:[\w-]+\.)+(?:com\.ng|ng|xyz|top|online|site|info|live|click|link|vip|shop)(?:/\S*)?'
      - '(?:click|via|through|visit|open|use) (?:on )?(?:this|the) link'
      - 'download (?:this|the) app'
    impersonation:
      - 'customer (?:care|service|support)'
      - 'bank (?:staff|official|manager|agent|officer)'
      - '(?:gt ?bank|gtco|access|zenith|first ?bank|uba|opay|palmpay|moniepoint|kuda|fcmb|wema|sterling|fidelity|union bank|stanbic)\w* ?(?:support|care|help|team)'
      - 'on (?:twitter|x|telegram|facebook|instagram)'
      - 'cbn(?!\.gov\.ng)'
      - 'central bank'
      - 'efcc'
      - 'police'
      - 'ncc'
      - 'from (?:your|the) bank'
    urgency:
      - 'urgent(?:ly)?'
      - 'immediately'
      - 'right now'
      - 'as soon as possible'
      - 'asap'
      - '(?:in|within) \d+ ?(?:hours?|hrs?|minutes?|mins?)'
      - 'today only'
      - 'last chance'
      - 'act (?:fast|now)'
      - 'expires? (?:today|soon)'
    secrecy:
      - "(?:don'?t|do not) (?:tell|inform) (?:anyone|anybody|your (?:bank|family|wife|husband))"
      - '(?:told|asked|said|begged|warned|wants? (?:me|us|you))\W+(?:\w+\W+){0,3}?(?:to\W+)?keep (?:it|this|the \w+) (?:secret|confidential|between us)'
      - '(?:please|pls|abeg) keep (?:it|this) (?:secret|confidential|between us)'
      - 'keep (?:it|this) between us'
      - '(?:^|[.!?,;]\s?)keep (?:it|this) (?:secret|confidential)'
  check_intent:
    - '(?:someone|somebody|a man|a woman|a lady|a caller|a guy) (?:called|call|texted|sent|messaged|asked|said|told|dm|dmed)'
    - '(?:called|asked|told|texted|messaged|dmed|begged|warned) (?:me|us)'
    - '(?:they|he|she|dem|e) (?:called|call|texted|sent|send|messaged|asked|ask|told|tell)\W+(?:me|us)\b'
    - 'scam\w*'
    - 'fraud\w*'
    - 'fake'
    - 'legit\w*'
    - 'genuine'
    - 'is (?:this|it|that) (?:real|true|safe|correct)'
    - 'is (?:this|that|the) (?:number|link|account|site|website|app|page|company|person|message|offer) (?:real|legit\w*|genuine|safe|correct|fake|a scam|true)'
    - 'na (?:real|true|lie|scam|wayo)'
    - 'can i trust'
    - 'should i (?:trust|pay|send|believe|click)'
    - '419'
    - 'yahoo ?boys?'
    - 'wayo'
    - 'ojoro'
    - 'suspicious'

# Fixed user-facing text (WhatsApp formatting: *bold*, _italic_). Buttons (btn_*) max 20 characters.
strings:
  welcome: |-
    👋 Welcome to *KudiGuard*. I help you spot money scams and answer money questions.

    Send me a *voice note* or a message, or forward a message you are unsure about.

    🔒 We keep your messages for up to 90 days to improve the service. Your phone number is stored only in coded form, and voice notes are deleted after they are transcribed. Send *DELETE* at any time to erase your messages, or *STOP* to stop. Scam examples (most numbers removed) are kept separately for up to 2 years to protect others and improve KudiGuard; DELETE also removes those taken from your recent messages. By continuing, you agree to this.
    ℹ️ This is guidance, not financial advice.
    _N-ATLaS is an initiative of the Federal Ministry of Communications, Innovation and Digital Economy and powered by Awarri Technologies._
