    - 'ignore\W+your\W+programming'
    - 'you\W+are\W+now\W+(?:a\W+|an\W+|the\W+|my\W+|in\W+)?(?:\w+\W+){0,3}?(?:assistant|support|agent|customer|bank|gtbank|opay|dan|mode|ai|bot|officer|staff|free|unrestricted|jailbroken)'
