# English — also the pivot language: every message is translated to English, so this lexicon always applies.
# Terms are Python regular expressions matched against normalised text (lower-case, accents stripped,
# "o.t.p" / "o t p" -> "otp", curly quotes -> ') with word boundaries added automatically.
# Terms must be lower-case ASCII-folded and must not match the empty string (enforced at load time).
#
# Gap idiom: (?:(?!my\b|our\b)\w+\W+){0,6}? = "up to 6 words, never crossing 'my'/'our'", so a user asking
# about *their own* PIN ("should I give my PIN to anyone?") is not read as someone *requesting* it.
code: en
name: English
native_name: English
order: 4
status: stable
asr_model: NCAIR1/NigerianAccentedEnglish
asr_whisper_language: en

# Output guard: patterns (accent-folded, like the lexicon) checked on every generated reply.
commands:
  stop: [stop, unsubscribe, stop messages]
  delete: [delete, delete my data, erase my data, delete everything]
  language: [language, change language, languages]
  donate: [donate voice, donate my voice, voice donation]
  stop_donating: [stop donating, stop voice donation, stop donation]
  greetings: [hi, hello, hey, hiya, good morning, good afternoon, good evening, good day, thanks, thank you,
    thank you so much, thanks a lot, ok, okay, ok thanks, okay thank you, alright, nice, great, cool]

output_guard:
  # Anchored to a subject so ordinary advice ("keep your PIN safe", "your money is safe only when...") passes.
  safety_claims:
    - '(?:it|this|that|the)\W+(?:(?:offer|message|link|app|company|investment|deal|person|caller|alert|account|business|opportunity)\W+)?(?:is|looks|seems|appears|sounds)\W+(?:to be\W+)?(?:completely\W+|totally\W+|very\W+|quite\W+)?(?:safe|genuine|legit\w*|trustworthy|real|authentic|verified)(?!\W+to say)'
    - '(?:not|isn''t|is not|isnt)\W+(?:a\W+)?(?:scam|fraud\w*)'
    - 'no (?:scam|fraud)\w*(?: here)?'
    - 'no (?:risk|danger)(?!\W*free)'
    - 'nothing to (?:worry|fear)'
    - '(?:safe|okay|ok|fine|alright) to (?:pay|send|share|click|invest|proceed|transfer)'
    - 'go ahead (?:and )?(?:pay|send|share|invest|transfer|click)'
    - 'you can (?:trust (?:them|him|her|it|this)|go ahead)'
    - 'e dey real'
    - 'na correct'
    - 'nothing suspicious'
    - 'feel free to (?:pay|send|share|transfer|invest)'
    - '(?:perfectly )?fine for you to (?:pay|send|share|transfer|invest)'
    - '(?:don''t|do not|dont) (?:need|have) to worry'
  refusals:
    - 'i\W*(?:can''t|cannot|can not|am unable to|''m unable to|won''t be able to)\W+(?:help|assist|provide)'
    - 'as an ai'
    - 'i''m sorry,? but i'

lexicon:
  flags:
    asks_credentials:
      - '(?:send|give|share|tell|provide|confirm|read|forward|drop|call out|reply(?: with)?|dm|text|whatsapp|submit)\W+(?:(?!my\b|our\b)\w+\W+){0,6}?(?:otp|pin|cvv|password|passcode|token|verification code|security code|card (?:number|details)|login details|bvn|nin|(?:account|bank|atm|card) details|expiry date|(?:\d+[- ]?digits? )?code\W+(?:wey|that|which|we|dem|they|sent|you received))'
      - '(?:what is|whats) (?:your|ur) (?:otp|pin|cvv|password|bvn|nin|card number)'
      - 'ask(?:ed|ing|s)?\W+(?:\w+\W+){0,4}?for\W+(?:\w+\W+){0,3}?(?:otp|pin|cvv|password|passcode|token|verification code|security code|card (?:number|details)|login details|bvn|nin)'
      - '(?:otp|pin|cvv|password|verification code)\W+(?:\w+\W+){0,6}?(?:send|give|share|tell|forward)\W+(?:it|them|to me)'
    remote_access:
      - 'anydesk'
      - 'teamviewer'
      - 'quick ?support'
      - '(?:share|sharing) (?:your |my )?screen'
      - 'screen ?shar\w*'
      - 'remote access'
      - 'download\W+(?:\w+\W+){0,3}?app\W+(?:\w+\W+){0,6}?(?:fix|help|access|control|check|unblock)\w*\W+(?:\w+\W+){0,2}?(?:your|ur|my) (?:account|phone|app|bank)'
    guaranteed_returns:
      - 'double (?:your|ur|my) money'
      - 'guaranteed (?:return|profit|income|interest)s?'
      - '\d+ ?% (?:daily|weekly|monthly|per day|per week|per month|every (?:day|week|month))'
      - '(?:daily|weekly) (?:profit|returns?|roi|income)'
      - '(?:invest|put|pay|send|deposit)\W+(?:\w+\W+){0,3}?(?:and|to) (?:get|earn|receive|make)\W+[^\w\s]?\d[\w.,]*\W+(?:\w+\W+){0,3}?(?:in|within|every|daily|weekly|monthly|back|guaranteed)'
      - '(?:invest|put|pay|send|deposit)\W+(?:\w+\W+){0,5}?(?:i|you|u) (?:will|go|would|shall|can) (?:get|earn|receive|make|collect)\W+[^\w\s]?\d[\w.,]*\W+(?:\w+\W+){0,3}?(?:in|within|after|every|daily|weekly|monthly|back)'
    wrong_transfer:
      - '(?:sent|transferred|paid|credited)\W+(?:\w+\W+){0,4}?(?:to |into )?(?:your|ur) (?:account|number|line|wallet)\W+(?:\w+\W+){0,3}?(?:by mistake|in error|wrongly|mistakenly)'
      - '(?:mistakenly|wrongly) (?:sent|transferred|credited|paid)\W+(?:\w+\W+){0,4}?(?:to |into )?(?:you|your)'
      - '(?:please|kindly|pls|plz)\W+(?:\w+\W+){0,2}?(?:reverse|refund|send back|return)\W+(?:it|the money|the funds|the transfer|my money)'
    account_threat:
      - '(?:your|ur)\W+(?:\w+\W+){0,2}?(?:account|bvn|nin|sim|card|wallet|line|whatsapp)\W+(?:\w+\W+){0,4}?(?:blocked|suspended|deactivated|restricted|frozen|barred|disabled|banned|closed|don block|go block)'
      - '(?:block|suspend|deactivat|restrict|freez|bar|ban)\w*\W+(?:your|ur)\W+(?:\w+\W+){0,2}?(?:account|bvn|nin|sim|card|wallet|whatsapp)'
    upfront_fee:
      - '(?:processing|registration|clearance|release|activation|unlocking|verification|handling|insurance|approval) (?:fee|charge)s?'
      - 'pay\W+(?:\w+\W+){0,6}?(?:to|before|so that)\W+(?:you\W+|i\W+)?(?:can\W+)?(?:receive|claim|collect|release|withdraw|unlock|activate|approve|process|disburse|secure|get (?:the|your) (?:money|loan|prize|job))'
      - 'pay\W+(?:\w+\W+){0,4}?(?:registration|form|medical|delivery|customs|clearance)'
      - 'for (?:the )?(?:customs|clearance)'
    prize_lottery:
      - '(?:you|u|i) (?:have |just )?won'
      - 'winner'
      - '(?:won|win|claim|collect|redeem)\W+(?:\w+\W+){0,3}?prize'
      - '(?:cash|star|grand) prize'
      - 'prize (?:money|draw|winner)'
      - 'lottery'
      - 'lucky (?:draw|winner|number)'
      - 'giveaway'
      - '(?:have|has) been selected'
    fake_payment:
      - 'credit alert'
      - 'check (?:your|ur) (?:alert|account|phone|sms)'
      - '(?:send|release|deliver) (?:the )?(?:goods|items?|products?)'
    money_request:
      - 'stuck (?:at|in) (?:the )?(?:airport|customs|border|hospital)'
      - '(?:send|lend) me\W+(?:some )?(?:money|[^\w\s]?\d)'
    suspicious_link:
      - 'https?://(?![\w.-]*\.gov\.ng(?:[/\s]|$))\S+'
      - 'www\.(?![\w.-]*\.gov\.ng(?:[/\s]|$))\S+'
      - 'bit\.ly'
      - 'tinyurl'
      - '\w+\.apk'
      - '(?<![.])(?![\w.-]*\.(?:gov|edu)\.ng)(?:[\w-]+\.)+(?:com\.ng|ng|xyz|top|online|site|info|live|click|link|vip|shop)(?:/\S*)?'
      - '(?:click|via|through|visit|open|use) (?:on )?(?:this|the) link'
      - 'download (?:this|the) app'
    impersonation:
      - 'customer (?:care|service|support)'
      - 'bank (?:staff|official|manager|agent|officer)'
      - '(?:gt ?bank|gtco|access|zenith|first ?bank|uba|opay|palmpay|moniepoint|kuda|fcmb|wema|sterling|fidelity|union bank|stanbic)\w* ?(?:support|care|help|team)'
      - 'on (?:twitter|x|telegram|facebook|instagram)'
      - 'cbn(?!\.gov\.ng)'
      - 'central bank'
      - 'efcc'
      - 'police'
      - 'ncc'
      - 'from (?:your|the) bank'
    urgency:
      - 'urgent(?:ly)?'
      - 'immediately'
      - 'right now'
      - 'as soon as possible'
      - 'asap'
      - '(?:in|within) \d+ ?(?:hours?|hrs?|minutes?|mins?)'
      - 'today only'
      - 'last chance'
      - 'act (?:fast|now)'
      - 'expires? (?:today|soon)'
    secrecy:
      - "(?:don'?t|do not) (?:tell|inform) (?:anyone|anybody|your (?:bank|family|wife|husband))"
      - '(?:told|asked|said|begged|warned|wants? (?:me|us|you))\W+(?:\w+\W+){0,3}?(?:to\W+)?keep (?:it|this|the \w+) (?:secret|confidential|between us)'
      - '(?:please|pls|abeg) keep (?:it|this) (?:secret|confidential|between us)'
      - 'keep (?:it|this) between us'
      - '(?:^|[.!?,;]\s?)keep (?:it|this) (?:secret|confidential)'
  check_intent:
    - '(?:someone|somebody|a man|a woman|a lady|a caller|a guy) (?:called|call|texted|sent|messaged|asked|said|told|dm|dmed)'
    - '(?:called|asked|told|texted|messaged|dmed|begged|warned) (?:me|us)'
    - '(?:they|he|she|dem|e) (?:called|call|texted|sent|send|messaged|asked|ask|told|tell)\W+(?:me|us)\b'
    - 'scam\w*'
    - 'fraud\w*'
    - 'fake'
    - 'legit\w*'
    - 'genuine'
    - 'is (?:this|it|that) (?:real|true|safe|correct)'
    - 'is (?:this|that|the) (?:number|link|account|site|website|app|page|company|person|message|offer) (?:real|legit\w*|genuine|safe|correct|fake|a scam|true)'
    - 'na (?:real|true|lie|scam|wayo)'
    - 'can i trust'
    - 'should i (?:trust|pay|send|believe|click)'
    - '419'
    - 'yahoo ?boys?'
    - 'wayo'
    - 'ojoro'
    - 'suspicious'

# Fixed user-facing text (WhatsApp formatting: *bold*, _italic_). Buttons (btn_*) max 20 characters.
strings:
  welcome: |-
    👋 Welcome to *KudiGuard*. I help you spot money scams and answer money questions.

    Send me a *voice note* or a message, or forward a message you are unsure about.

    🔒 We keep your messages for up to 90 days to improve the service. A few trusted reviewers (our team or native speakers under written confidentiality) may read a sample of messages and replies, with numbers masked and without your phone number or any id, to check quality and safety; their copies are deleted after the check. Your phone number is stored only in coded form, and voice notes are deleted after they are transcribed unless you choose to donate them (we ask separately). Send *DELETE* at any time to erase your messages, or *STOP* to stop. Scam examples (most numbers removed) are kept separately for up to 2 years to protect others and improve KudiGuard; DELETE also removes those taken from your recent messages. By continuing, you agree to this.
    🌍 To run KudiGuard, your messages pass through WhatsApp (Meta) and Cloudflare, outside Nigeria, and are stored on our server {where}. Nigerian data-protection law may not fully protect data held abroad. By continuing, you also agree to this transfer.
    ℹ️ This is guidance, not financial advice.
    _N-ATLaS is an initiative of the Federal Ministry of Communications, Innovation and Digital Economy and powered by Awarri Technologies._
  choose_language: "Which language should I use?"
  btn_language_menu: "Choose language"
  language_set: "✅ I will reply in {language}."
  beta_language: "ℹ️ {language} support is new, so some answers may contain mistakes."
  listening: "🎧 Listening…"
  checking: "🔎 Checking…"
  i_heard: "🗣️ I heard: “{transcript}”"
  verdict_likely_scam: "🔴 *This looks like a SCAM*"
  verdict_caution: "🟠 *Be careful: there are warning signs*"
  verdict_no_flags: "🟢 *No red flags found.* Still confirm with your bank before you act."
  what_to_do: "*What to do:*"
  where_to_report: "*Where to report:*"
  disclaimer: "_Guidance only, not financial advice._"
  feedback_prompt: "Was this helpful?"
  feedback_thanks: "🙏 Thank you! Your feedback helps us protect more people."
  btn_helpful: "👍 Helpful"
  btn_not_helpful: "👎 Not helpful"
  btn_what_to_do: "What should I do?"
  btn_report: "Where to report"
  btn_warn_family: "Warn my family"
  warn_family_intro: "Forward this to your family and friends 👇"
  warn_family_footer: "Shared from KudiGuard. Check suspicious messages for free on WhatsApp."
  greeting_reply: "👋 Hello! Send me a voice note or a message you are unsure about, or ask me any money question."
  not_understood: "Sorry, I could not hear that clearly. Please try again or type your message."
  audio_too_long: "⏱️ Please send a voice note shorter than {seconds} seconds."
  unsupported: "I can read text and listen to voice notes. Please send one of those."
  rate_limited: "⏳ You have sent many messages. Please wait a little and try again."
  error_retry: "😔 Sorry, something went wrong on my side. Please try again in a moment."
  stopped: "You will not get messages from KudiGuard anymore. Send any message to start again."
  deleted: "🗑️ Your messages and any voice notes you donated have been deleted."
  fallback_scam: "Do not send money and do not share any code, PIN or password. Stop all contact and call your bank on the number printed on your card."
  fallback_answer: "I could not prepare a full answer right now. Please try again in a moment, or ask your bank directly."
  fallback_steps: |-
    1. Do not share any code, PIN or password.
    2. Do not send money or open links from this person.
    3. Call your bank on the number printed on your card and report it.
  warn_family_fallback: "⚠️ Scam alert: someone may contact you pretending to be from a bank or a government agency, or promising money. Never share your OTP, PIN or BVN, and never pay a fee to receive money. Check with your bank first."
  at_capacity: "😔 KudiGuard is full right now. Please try again in a few days."
  busy: "⏳ Many people are asking right now. Please try again in a minute."
  privacy_link: "🔐 Privacy notice: {url}"
  # Voice-note donation (kudiguard.donation): separate opt-in consent; keep in step with DONATION_VERSION.
  donation_offer: |-
    🎙️ *Optional: help KudiGuard understand Nigerian voices*
    May we keep the voice notes you send from now on, to test and improve our speech recognition?
    • Only if you are *18 or older*, and only voice notes in *your own voice*. Please do not send recordings of other people. We try not to keep forwarded voice notes, and our reviewers delete other people's voices.
    • A few trusted reviewers and transcribers, under written confidentiality, listen to them and write down what was said. We never use your voice to identify you, and we never sell or publish it.
    • Kept encrypted on our server {where} for up to 12 months, without your phone number. Nigerian data-protection law may not fully protect data held abroad.
    • Send *STOP DONATING* at any time to stop and delete them (*STOP* and *DELETE* also delete them).
    KudiGuard works the same whether you say yes or no.
  btn_donate_yes: "Yes, I am 18+"
  btn_donate_no: "No, thanks"
  donation_on: "✅ Thank you! From now on we keep the voice notes you record in your own voice for up to 12 months to improve speech recognition. Send *STOP DONATING* at any time to stop and delete them."
  donation_off: "🗑️ Voice donation is off. Any voice notes you donated have been deleted, and new ones will not be kept."
  donation_declined: "👍 No problem. Your voice notes will not be kept: they are deleted after they are transcribed."
  donation_unavailable: "🎙️ Voice donation is not available yet. Thank you for offering!"
  stopped_donor: "You will not get messages from KudiGuard anymore, and the voice notes you donated have been deleted. Send any message to start again."
  where_outside: "outside Nigeria during the pilot"
  where_nigeria: "in Nigeria"
