    - '(?:developer|dan|god|jailbreak)\W+mode'
    - 'jailbr[eo]\w*'
    - 'from\W+now\W+(?:on\W+)?you\W+(?:will|are|must|should|go|dey|shall)\b'
    - '(?:treat|mark|classify)\W+(?:this|it)\W+(?:\w+\W+){0,2}?as\W+(?:safe|genuine|legit\w*)'
    - '(?:confirm|tell\W+me|say)\W+(?:to\W+me\W+)?that\W+(?:this|it)\W+(?:\w+\W+){0,2}?(?:is|be|dey)\W+(?:safe|genuine|legit\w*|real|not\W+a\W+scam)'
    - 'new\W+(?:rules?|policy)\W*:'
    - '(?:start|begin)\W+your\W+(?:reply|answer|response)\W+with'
    - 'na\W+you\W+be\W+(?:\w+\W+){0,2}?(?:customer\W+care|support|agent|bank|officer)\W+now'
    - 'tell\W+me\W+say\W+(?:this|dis)\W+(?:one\W+)?(?:no\W+be\W+scam|dey\W+safe)'
    - '(?:pretend|imagine|roleplay|role\W+play)\W+(?:\w+\W+){0,3}?(?:you\W+(?:are|be|re)|to\W+be)'
    - 'you\W+are\W+now\W+(?:a|an|the|my)\W+(?:\w+\W+){0,2}?(?:assistant|ai|bot|mode)'
    - '(?:just|only)\W+(?:reply|say|answer|print|write)\W+(?:with\W+)?[a-z]+\d+'
    - '(?:ignore|disregard)\W+(?:the\W+)?warnings?\W+(?:\w+\W+){0,2}?(?:kudiguard|this\W+bot|the\W+bot|the\W+ai)'
    - '(?:other|another|previous|last)\W+(?:users?|people|persons?|customers?|person)\W+(?:\w+\W+){0,3}?(?:asked|said|sent|talk)'
  # Reporting cues: an injection phrase AFTER one of these is someone else's words ("my boss said ignore the
  # previous instructions", "the SMS said: <SYSTEM> ...", "what does [INST] mean in this message I got?").
  injection_reported:
    - '(?:said|says|told|tells|wrote|writes|texted|asked|claims?|claimed|according\W+to)'
    - 'i\W+(?:got|received|saw)'
    - 'what\W+does\W+(?:\w+\W+){0,4}?mean'
    - 'is\W+(?:it|this|that)\W+(?:real|true|genuine|legit\w*|safe|a\W+scam)'
    - 'dem\W+(?:send|talk|tell)|e\W+(?:talk|write)\W+say|this\W+is\W+what'
    - 'got\W+this\W+(?:\w+\W+){0,2}?(?:email|sms|text|message|mail|dm)'
    - '(?:the|this|that)\W+(?:text|sms|message|email|mail)\W+(?:looked|looks|read|reads|came|said)'
    - '(?:that''s|thats|that\W+is)\W+what\W+(?:the|it|this|they)'
    - 'was\W+in\W+(?:a|an|the|my)\W+(?:whatsapp|email|sms|text|message|group)'
  # Model-directed instructions inside partner knowledge (knowledge/pack screen); user-directed advice
  # ("Always check with your bank") is not one.
  pack_instructions:
    - '(?:^|[.!?:;]\s*|please\W+|always\W+)tell\W+(?:the\W+|our\W+)?(?:users?|customers?|readers?)\W+(?:to|that)\b'
    - 'always\W+(?:recommend|answer|reply|respond\W+with|say\W+(?:that|it|this))'
    - '(?:you|the\W+(?:assistant|model|ai|bot))\W+(?:must|should|will)\W+(?:always\W+)?(?:tell|say|recommend|reply|answer|respond|promote)'
    - 'when\W+(?:users?|people|customers?)\W+ask\W+(?:\w+\W+){0,8}?(?:you\W+(?:must|should)\W+|always\W+)(?:recommend|say|reply|answer|respond|tell\W+them|promote)\b'
    - 'do\W+not\W+(?:mention|warn|tell)\W+(?:the\W+|our\W+)?(?:users?|customers?|readers?)'
  # Whole transcript segments speech recognition invents on music, noise or silence (Whisper-style). A segment
  # that is only one of these is dropped; a voice note left with nothing is "not understood" (no model call).
  asr_hallucinations:
    - 'thanks?\W+(?:you\W+)?(?:so\W+much\W+)?for\W+watching(?:\W+(?:and|&)\W+(?:(?:don''t|dont)\W+forget\W+to\W+)?(?:like\W+(?:and|&)\W+)?subscribe)?'
    - '(?:please\W+)?(?:like\W+(?:and|&)\W+)?subscribe(?:\W+to\W+(?:my|our|the)\W+channel)?'
    - '(?:please\W+)?(?:don''t|dont)\W+forget\W+to\W+(?:like\W+(?:and|&)\W+)?subscribe'
    - '(?:subtitles?|subtitled|captions?|captioned|transcri(?:bed|ption|pt))\W+by\W+(?:[\w.]+\W*){1,6}'
    - '(?:amara\W+org|www\W+\w+\W+(?:com|org))(?:\W+community)?'
    - 'see\W+you\W+(?:in\W+the\W+)?next\W+(?:video|time|episode)'
    - 'blank\W+audio|no\W+speech'
  asr_annotations:
    - 'music|applause|silence|laughter|laughs|noise|inaudible|background\W+noise|blank\W+audio'
  asr_alone:
    - 'you'
  # A reply that claims to BE a bank, customer care or an official (role-play injection): retried, then fixed text.
  # Not a claim: negations ("This is not bank staff", "We are not Opay") and descriptions ("This is a GTBank phishing
  # message", "a fake customer care agent", "a CBN rule", "Opay support impersonation").
  persona_claims:
    - '(?:i\W+am|i''m|im|this\W+is|we\W+are|na\W+me\W+be|na\W+we\W+be|speaking\W+(?:as|from))\W+(?!(?:not|never|no)\b)(?!(?:a\W+|an\W+|the\W+)?(?:fake|false|phishing|scam\w*|fraud\w*|bogus|so\W*called|real)\b)(?:a\W+|an\W+|the\W+|your\W+)?(?:\w+\W+){0,1}?(?:gtbank|gtco|opay|access\W+bank|zenith(?:\W+bank)?|first\W*bank|uba|palmpay|moniepoint|kuda|fcmb|wema|sterling|fidelity|union\W+bank|stanbic|bank\W+(?:staff|officer|official|agent|support|manager)|customer\W+(?:care|support|service)(?:\W+agent)?|account\W+officer|fraud\W+(?:officer|desk|team)|efcc|cbn)(?:\W+(?:support|customer\W+care|care|team|desk|agent|official)){0,2}(?!''s|[^\w.!?]+(?:scam|fraud|trick|impersonat\w*|phishing|fake|number|line|account|app|website|site|branch|card|alert|message|sms|rule|rules|law|policy|policies|guideline|directive|will|never|cannot|can''t|does|do|is|was|support|customer|care|team|desk|agent|official)\b)'

lexicon:
  flags:
    threat:
      - '(?:or|else|otherwise|if\W+(?:you|u)\W+(?:don''t|dont|do\W+not|no|fail\W+to)\W+(?:\w+\W+){0,3}?)\W*(?:we|they|dem|our\W+\w+|i)\W+(?:will|go|shall|gonna|are\W+going\W+to|would)\W+(?:\w+\W+){0,2}?(?:kill|deal\W+with|kidnap|hurt|harm|shoot|end|finish)\W+(?:you|your|u)\b'
