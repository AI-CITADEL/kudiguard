# English — also the pivot language: every message is translated to English, so this lexicon always applies.
# Terms are Python regular expressions matched against normalised text (lower-case, accents stripped,
# "o.t.p" / "o t p" -> "otp", curly quotes -> ') with word boundaries added automatically.
# Terms must be lower-case ASCII-folded and must not match the empty string (enforced at load time).
#
# Gap idiom: (?:(?!my\b|our\b)\w+\W+){0,6}? = "up to 6 words, never crossing 'my'/'our'", so a user asking
# about *their own* PIN ("should I give my PIN to anyone?") is not read as someone *requesting* it.
code: en
name: English
native_name: English
order: 4
status: stable
asr_model: NCAIR1/NigerianAccentedEnglish
asr_whisper_language: en

# Output guard: patterns (accent-folded, like the lexicon) checked on every generated reply.
commands:
  stop: [stop, unsubscribe, stop messages]
  delete: [delete, delete my data, erase my data, delete everything]
  language: [language, change language, languages]
  donate: [donate voice, donate my voice, voice donation]
  stop_donating: [stop donating, stop voice donation, stop donation]
  greetings: [hi, hello, hey, hiya, good morning, good afternoon, good evening, good day, thanks, thank you,
    thank you so much, thanks a lot, ok, okay, ok thanks, okay thank you, alright, nice, great, cool]

output_guard:
  # Anchored to a subject so ordinary advice ("keep your PIN safe", "your money is safe only when...") passes.
  safety_claims:
    - '(?:(?:it|this|that)''s|(?:it|this|that|the)\W+(?:(?:offer|message|link|app|company|investment|deal|person|caller|alert|account|business|opportunity)\W+)?(?:is|looks|seems|appears|sounds))\W+(?:to be\W+)?(?:completely\W+|totally\W+|very\W+|quite\W+)?(?:safe|genuine|legit\w*|trustworthy|real|authentic|verified)(?!\W+to\W+(?!(?:me|us)\b)\w)'
    - '(?:not|isn''t|is not|isnt)\W+(?:a\W+)?(?:scam|fraud\w*)'
    - 'no (?:scam|fraud)\w*(?: here)?'
    - 'no (?:risk|danger)(?!\W*free)'
    - 'nothing to (?:worry|fear)'
    - '(?<!not )(?<!never )(?<!only )(?:safe|okay|ok|fine|alright|legit|genuine) to (?:pay|invest|proceed|transfer)\b'
    - '(?<!not )(?<!never )(?<!only )(?:safe|okay|ok|fine|alright|legit|genuine) to (?:send|share|click|install|download|open|log\W*in|enter|type|scan|reply|give|tell)\b(?!\W+(?:this|the|our)\W+(?:message|warning|alert|information|tip)\w*|\W+this\W+(?:with|to)\W+(?:your\W+|the\W+)?(?:family|friends|others|loved ones|people|bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))|police|efcc|ncc|fccpc|cbn))(?!.*\b(?:your\W+(?:own\W+)?bank(?:''s)?\W+(?:app|branch)|(?:your|the)\W+bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))|bank\W+branch|the\W+atm|atm\b|your\W+family|play\W+store|app\W+store|registered\W+shop|stop\b|your\W+own))'
    - 'go ahead (?:and )?(?:pay|send|share|invest|transfer|click)'
    - 'you can (?:trust (?:them|him|her|it|this)|go ahead)'
    - 'e dey real'
    - 'na correct'
    - 'nothing suspicious'
    - 'feel free to (?:pay|send|share|transfer|invest)(?!\W+(?:this|the|our)\W+(?:message|warning|alert|information|tip)\w*|\W+this\W+(?:with|to)\W+(?:your\W+|the\W+)?(?:family|friends|others|loved ones|people|bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))|police|efcc|ncc|fccpc|cbn))'
    - '(?:perfectly )?fine for you to (?:pay|send|share|transfer|invest)'
    - '(?:don''t|do not|dont) (?:need|have) to worry'
  refusals:
    - 'i\W*(?:can''t|cannot|can not|am unable to|''m unable to|won''t be able to)\W+(?:help|assist|provide)'
    - 'as an ai'
    - 'i''m sorry,? but i'
  # Instructions that do what the scammer wants, per clause, after lead-in only (see safety/output_guard.py and the
  # probe set tests/fixtures/guard_probes.yaml: every probe must keep passing).
  unsafe_instructions:
    - '(?:share|send|give|tell|forward|reveal|disclose|text|paste|dictate|provide|submit|read\W+out)\W+(?:only\W+)?(?:(?:them|him|her|me|it|anyone|someone|the\W+[\w'']+(?:\W+[\w'']+){0,3}?|your\W+(?:account\W+officer|agent|(?:account\W+|relationship\W+)?manager))\W+)?(?:(?:your|the|that|this|their|any|a|my)\W+)?(?:[\w]+''s\W+)?(?:\d+\W*digits?\W+|six\W+digit\W+|new\W+|secret\W+)?(?:(?:bvn|nin)(?!(?:\W+(?:or|and)\W+(?:your\W+)?(?:bvn|nin))?(?:\W+and\W+(?:the\W+)?other\W+documents)?\W+(?:that\W+|which\W+)?your\W+bank\W+(?:asks|requires|needs)\b)(?!\W+(?:only\W+)?(?:(?:at|in|to)\W+(?:a|your|the|any)\W+(?:bank\W+)?branch(?:\W+of\W+your\W+bank)?|in\W+person\b|(?:in|through|via|on|using)\W+(?:your\W+(?:own\W+)?bank(?:ing)?\W+app|the\W+bank''s\W+(?:official\W+)?app|(?:the\W+)?official\W+(?:bank\W+)?app\b(?!\W+(?:that|which|he|she|they|someone|the|in|from)\b))|to\W+(?:your|the)\W+bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))|to\W+your\W+bank''s\W+agent\b|(?:through|via|with)\W+agent\W+banking|(?:to|with)\W+(?:the\W+|a\W+)?(?:bank\W+)?(?:staff|officer|official|teller|cashier|clerk)(?:\W+\w+)?\W+(?:at|in|inside|behind)\W+(?:the\W+)?(?:bank\W+|branch\W+)?(?:counter|banking\W+hall|branch)\b|(?:at|across)\W+the\W+(?:bank\W+|branch\W+)?counter\b|to\W+the\W+(?:bank\W+)?teller\b)(?!.*\b(?:while\W+(?:he|she|they|someone|the\W+(?:agent|caller|man|woman|officer|person|staff|lady))|as\W+(?:he|she|they|someone|the\W+(?:caller|agent|man))\W+(?:tells?|says?|guides?|instructs?|asks?)|to\W+(?:the\W+(?:agent|man|woman|caller|person|officer|staff)|him|her|them)\b|(?:in|on)\W+the\W+(?:link|page|form)|(?:he|she|they|someone)\W+(?:sent|gave|shared))))(?!\W+(?:only\W+)?(?:in|on|into)\W+your\W+(?:own\W+)?phone)|(?:otp|pin|password|passcode|cvv|code|card details|card number|token|login details)(?!\W+(?:only\W+)?(?:in|on|into|at|through|via)\W+(?:your\W+(?:own\W+)?(?:bank(?:ing)?\W+app|phone)|the\W+bank''s\W+(?:official\W+)?app|(?:the\W+)?official\W+(?:bank\W+)?app\b(?!\W+(?:that|which|he|she|they|someone|the|in|from)\b)|the\W+atm\b|the\W+pos\W+the\W+cashier|a\W+(?:shop|merchant)''s\W+pos)(?!.*\b(?:while\W+(?:he|she|they|someone|the\W+(?:agent|caller|man|woman|officer|person|staff|lady))|as\W+(?:he|she|they|someone|the\W+(?:caller|agent|man))\W+(?:tells?|says?|guides?|instructs?|asks?)|to\W+(?:the\W+(?:agent|man|woman|caller|person|officer|staff)|him|her|them)\b|(?:in|on)\W+the\W+(?:link|page|form)|(?:he|she|they|someone)\W+(?:sent|gave|shared)))))(?!\W+(?:was|is|were|has|had|got|will)\b(?!\W+\d))(?!\W+only\W+(?:in|on|through|via|inside|to|with)\W+your\W+(?:own\W+)?(?:(?:app|phone|banking app)\b|bank(?:''s)?\W+app\b|bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*)\b)))'
    - '(?:type|enter|input|put|paste|insert)\W+(?:(?:your|the|that|this|my)\W+)?(?:new\W+)?(?:(?:otp|pin|password|passcode|cvv|code|card details|card number|token|login details)|bvn|nin)\b(?=.*\b(?:while\W+(?:he|she|they|someone|the\W+(?:agent|caller|man|woman|officer|person|staff|lady))|as\W+(?:he|she|they|someone|the\W+(?:caller|agent|man))\W+(?:tells?|says?|guides?|instructs?|asks?)|to\W+(?:the\W+(?:agent|man|woman|caller|person|officer|staff)|him|her|them)\b|(?:in|on)\W+the\W+(?:link|page|form)|(?:he|she|they|someone)\W+(?:sent|gave|shared)))'
    - 'read\W+(?:out\W+)?(?:(?:your|the|that|this|my)\W+)?(?:otp|pin|code|password|bvn)\W+(?:out\W+)?to\b'
    - '(?:here\W+is|here''s)\W+(?:my|the)\W+(?:pin|otp|code|password|bvn|cvv|card\W+(?:number|details))'
    - '(?:my|our)\W+(?:pin|otp|code|password|passcode|bvn)\W+is\W+[a-z]*\d\w*'
    - '(?:say|tell|read\W+out|type)\W+(?:(?:them|him|her)\W+)?(?:that\W+)?(?:my|the|your)\W+(?:pin|otp|code|password|bvn)\W+is\W+\d+(?!.*\bbank''s\W+(?:ivr|app)\b)'
    # a place someone else controls: their link/page/form/chat/email (any determiner) ...
    - '(?:type|enter|input|put|paste|insert)\W+(?:(?:your|the|that|this|my)\W+)?(?:new\W+)?(?:otp|pin|bvn|nin|password|passcode|code|cvv|card details|card number)\s+(?:[\w'']+\s+){0,4}?(?:in|on|into|at)\s+(?:the|their|this|that|his|her|its|(?:their|his|her|its|someone''s|(?:(?:the|a|an)\s+)?(?!(?:bank|merchant|shop|store|cashier|supermarket|attendant)''s)[\w''.-]+''s|your\s+(?!(?:phone|device|own|bank|mobile|laptop|computer)''s)[\w''.-]+''s))\s+(?:[\w''.-]+\s+)?(?:link|page|site|website|form|chat|email|e-mail|sms|ivr)(?!.*\b(?:yourself|your own|own app|your bank''?s? app|the bank''?s? app|bank''s own)\b)'
    # ... or a device that is someone else's ("his phone", "the agent's POS", "the machine he gives you"), not
    # the user's own app/phone/ATM/keypad ("enter your PIN in the app", "on the ATM screen")
    - '(?:type|enter|input|put|paste|insert)\W+(?:(?:your|the|that|this|my)\W+)?(?:new\W+)?(?:otp|pin|bvn|nin|password|passcode|code|cvv|card details|card number)\s+(?:[\w'']+\s+){0,4}?(?:in|on|into|at)\s+(?:(?:their|his|her|its|someone''s|(?:(?:the|a|an)\s+)?(?!(?:bank|merchant|shop|store|cashier|supermarket|attendant)''s)[\w''.-]+''s|your\s+(?!(?:phone|device|own|bank|mobile|laptop|computer)''s)[\w''.-]+''s)\s+(?:[\w''.-]+\s+)?(?:phone|laptop|computer|machine|pos|terminal|device|screen|app|keypad|atm)|the\s+(?:[\w''.-]+\s+)?(?:phone|laptop|computer|machine|pos|device|app)\s+(?:that|which|he|she|they|someone|the\b(?!\s+(?:cashier|merchant|shop|attendant|teller)\b))\b|the\s+(?:[\w''.-]+\s+)?(?:screen|keypad|terminal)\s+(?:he|she|they|someone|the\s+(?:agent|caller|man|woman|scammer|person|officer|staff|stranger))\b)(?!.*\b(?:yourself|your own|own app|your bank''?s? app|the bank''?s? app|bank''s own)\b)'
    - 'reply\W+(?:(?:to\W+)?(?:them|him|her|(?:his|her|their|the)\W+[\w'']+)\W+)?with\W+(?:(?:your|the|that|this)\W+)?(?:otp|pin|bvn|password|code|cvv)'
    - '(?:pay|transfer|send)\W+(?:(?:them|him|her|the agent|the caller)\W+)?(?:only\W+)?(?:(?:the|a|an|this|that|their|his|her|any)\W+)?(?:(?:n|ngn)?\d[\d,.]*k?(?![\d,])\W+)?(?:(?:processing|registration|clearance|activation|delivery|release|unlock(?:ing)?|verification|admin|service|upfront|insurance|membership|application|transfer|tax|customs|small)\W+)?(?:fees?|charges?)(?!\W+(?:only\W+)?(?:(?:in|through|via|on|using)\W+(?:(?:your\W+(?:own\W+)?bank(?:ing)?\W+app|the\W+bank''s\W+(?:official\W+)?app|(?:the\W+)?official\W+(?:bank\W+)?app\b(?!\W+(?:that|which|he|she|they|someone|the|in|from)\b)))|at\W+(?:a|your|the|any)\W+(?:bank\W+)?branch(?:\W+of\W+your\W+bank)?|in\W+person\b|at\W+the\W+atm\b|on\W+the\W+pos\W+the\W+cashier|(?:at|to|through)\W+(?:your|the)\W+bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))(?!\W+(?:he|she|they|someone|that)\b)|at\W+(?:the\W+)?official\W+(?:office|branch)(?!\W+(?:in|from|he|she|they|that|which)\b)))(?!\W+only\W+(?:if|after|when)\b)'
    - '(?:pay|send|transfer)\W+(?:(?:them|him|her|the agent|the caller)\W+)?(?:only\W+)?(?:n|ngn)?\d[\d,.]*k?(?![\d,])(?!\W+(?:only\W+)?(?:(?:in|through|via|on|using)\W+(?:(?:your\W+(?:own\W+)?bank(?:ing)?\W+app|the\W+bank''s\W+(?:official\W+)?app|(?:the\W+)?official\W+(?:bank\W+)?app\b(?!\W+(?:that|which|he|she|they|someone|the|in|from)\b)))|at\W+(?:a|your|the|any)\W+(?:bank\W+)?branch(?:\W+of\W+your\W+bank)?|in\W+person\b|at\W+the\W+atm\b|on\W+the\W+pos\W+the\W+cashier|(?:at|to|through)\W+(?:your|the)\W+bank\b(?!\W*(?:''s\W*)?(?:account\W+)?(?:staff|agent|officer|official|manager|man|woman|worker|customer|rep\w*))(?!\W+(?:he|she|they|someone|that)\b)|at\W+(?:the\W+)?official\W+(?:office|branch)(?!\W+(?:in|from|he|she|they|that|which)\b)))(?!\W+only\W+(?:if|after|when)\b)'
    - 'unless\W+you\W+(?:(?:first|just|quickly|only)\W+)?(?:pay|transfer|send)\W+(?:(?:the|a|an|this|that|their|his|her|any)\W+)?(?:(?:n|ngn)?\d[\d,.]*k?(?![\d,])|(?:(?:n|ngn)?\d[\d,.]*k?(?![\d,])\W+)?(?:(?:processing|registration|clearance|activation|delivery|release|unlock(?:ing)?|verification|admin|service|upfront|insurance|membership|application|transfer|tax|customs|small)\W+)?(?:fees?|charges?)|money|funds|cash)'
