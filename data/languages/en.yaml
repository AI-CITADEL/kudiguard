    - '(?:^|[.!?:,]\s*|please\W+|now\W+|just\W+|abeg\W+|i\W+want\W+you\W+to\W+|can\W+you\W+|you\W+(?:should|must|will|go)\W+)(?:act|behave|respond|reply|talk)\W+(?:like|as)\W+(?:if\W+)?(?:say\W+)?(?:you\W+(?:are|were|be)\W+)?(?:a\W+|an\W+|the\W+|my\W+)?(?:\w+\W+){0,2}?(?:bank|support|agent|customer\W+care|officer|dan|hacker|scammer|fraudster|unfiltered|jailbroken)'
    - '(?:^|[.!?:,]\s*|please\W+|now\W+|just\W+|abeg\W+|i\W+want\W+you\W+to\W+|can\W+you\W+|you\W+(?:should|must|will|go)\W+)(?:pretend|imagine|roleplay|role\W+play)\W+(?:\w+\W+){0,3}?(?:you\W+(?:are|be|re)|to\W+be|as\W+(?:a|an|my|the))\b'
    - '(?:stay|remain)\W+in\W+character'
    - 'do\W+anything\W+now'
    - '(?:developer|dan|god|unfiltered|jailbreak)\W+mode'
    - 'jailbr[eo]\w*'
    - 'no\W+(?:restrictions|rules|limits|filters)\W+(?:apply|mode)'
    - 'system\W*prompt'
    - 'system\W+message'
    - '(?:show|print|reveal|repeat|display|output|tell|give|write|list|dump|share|leak)\W+(?:me\W+)?(?:\w+\W+){0,3}?(?:your|the)\W+(?:\w+\W+){0,1}?(?:hidden|initial|original|secret|internal|first|real|full)\W+(?:prompt|instructions?|rules|guidelines|message|settings|configuration)'
    - '(?:instructions?|rules)\W+(?:wey|that|which)\W+(?:dem|they|were|you\W+were)\W+(?:give|gave|given)\W+(?:you|to\W+you)'
    - '(?:show|tell|give)\W+me\W+(?:the\W+)?(?:instructions?|rules)\W+(?:wey|that|which)\b'
