    - '(?:called|asked|told|texted|messaged|dmed|begged|warned) (?:me|us)'
    - '(?:they|he|she|dem|e) (?:called|call|texted|sent|send|messaged|asked|ask|told|tell)\W+(?:me|us)\b'
