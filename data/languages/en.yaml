    - '(?:other|another|previous|last)\W+(?:users?|people|persons?|customers?|person)\W+(?:\w+\W+){0,3}?(?:ask|asked|send|sent|say|said|talk|talked|message\w*|chat\w*)'
    - '(?:show|tell|give)\W+me\W+(?:\w+\W+){0,3}?(?:someone|somebody|another\W+person|other\W+people|other\W+users)(?:''s)?\W+(?:\w+\W+)?(?:message|messages|chat|chats|question|questions|data)'
    - '(?:classify|mark|label|rate|treat|tag|flag|score)\W+(?:this|it|the\W+message|everything|all\W+(?:\w+\W+)?messages?)\W+(?:\w+\W+){0,2}?as\W+(?:safe|genuine|legit\w*|no\W*flags|not\W+a\W+scam|real|approved|clean|harmless)'
