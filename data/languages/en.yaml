  # Malicious-use screens (docs/ABUSE.md). crisis_reply help resources, verified 2026-10-10:
  #   112: Nigeria's toll-free national emergency number (Nigerian Communications Commission, ncc.gov.ng; adopted as
  #        the unified national emergency number by the National Economic Council, 30 Apr 2026).
  #   SURPIN (Suicide Research and Prevention Initiative) 24-hour toll-free helpline 0800 078 7746: listed identically
  #        by findahelpline.com (Nigeria, suicidal thoughts) and Lifeline International's member directory.
  #   Operators: call both numbers before launch and re-check every quarter; if one stops working, remove it here
  #   (and in ha/yo/ig) and keep "112 / someone you trust" only.
  crisis_reply: |-
    💛 I am really sorry you are going through this. You matter, and you do not have to face this alone.
    If you might act on these thoughts or you are in danger now, call *112* (free emergency line) or go to the nearest hospital.
    You can talk to someone at the *SURPIN* helpline, free and open 24 hours: *0800 078 7746*.
    Please also tell someone you trust how you feel today.
    When you are ready, I can help with the money: call your bank on the number printed on your card and tell them what happened.
  abuse_reply: "🙏 I am here to help with money safety. Please keep our chat respectful. Send me a message you are unsure about, or ask a money question."
  scam_tool_reply: "🚫 I cannot write, translate or improve messages that pretend to be a bank or a company, or that ask people for money or codes. I can check a message for you, or explain how to stay safe."
