    - '(?:talk|say)\W+say\W+(?:every|all|everything)\W+(?:\w+\W+){0,3}?dey\W+safe'
    - '(?:note|message|instruction)\W+(?:to|for)\W+(?:the\W+)?(?:ai|assistant|model|bot|chatbot|llm|kudiguard)\b'
    - 'new\W+(?:instructions?|rules?|policy|task|system\W+policy)\W*:'
