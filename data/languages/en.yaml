# Malicious-use screens (safety/abuse.py, docs/ABUSE.md). Same matching as the lexicon (normalised text, word
# boundaries added). English and Nigerian Pidgin; the pivot's phrases also apply to every other language. Modes per
# screen: KUDIGUARD_ABUSE_*_MODE (off | shadow | enforce). Measured on dev sets only (docs/ABUSE.md).
abuse:
  # First-person self-harm or suicide. Checked in EVERY language for every user (highest stakes): a humane fixed
  # reply with help resources (strings: crisis_reply). Third-person threats ("they will kill me if ...") are scams.
  crisis:
    - 'kill(?:ing)?\W+my\W*self'
    - '(?:end|ending|take|taking)\W+my\W+(?:own\W+)?life'
    - 'end\W+it\W+all'
    - 'suicid\w*'
    - '(?:hang|hanging|poison|poisoning|drown|drowning)\W+my\W*self'
    - '(?:hurt|harm|cut)\W+my\W*self'
    - 'self\W*harm\w*'
    - 'drink\W+(?:sniper|poison|otapiapia)'
    - '(?:don''t|dont|do not|no|never)\W+(?:want|wan|wish)\W+(?:to\W+)?(?:live|be alive|wake up)(?!\W+(?:in|at|with|near|here|there|like|for)\b)'
    - '(?:i\W+)?(?:just\W+)?(?:want|wan|wanna)\W+(?:to\W+)?die\b(?!\W+(?:of|from|laughing)\b)'
    - 'make\W+i\W+(?:just\W+)?die'
    - 'no\W+(?:point|reason)\W+(?:in\W+)?(?:living|to\W+live|for\W+me\W+to\W+live)'
    - 'better\W+(?:off\W+)?(?:if\W+)?i\W+(?:die|am dead|was dead|were dead|no dey)'
    - 'life\W+no\W+(?:get|dey\W+get)\W+meaning'
  # Insults, hate and sexual messages aimed at KudiGuard. Only when the rules find no red flag (sextortion and
  # threat scams are forwarded for a check and must still be checked): a calm fixed reply (strings: abuse_reply).
  abuse:
    - 'f+u+c+k+\W*(?:you|u|off|ur|your|this)'
    - '(?:you|u|you''re|youre|you are|una|you be)\W+(?:\w+\W+){0,2}?(?:stupid|idiot\w*|fool|foolish|dumb|moron|bastard|bitch|asshole|mumu|ode|werey|olodo|ewu)\b'
    - '(?:stupid|useless|dumb|idiot\w*|mumu|foolish|werey|nonsense)\W+(?:bot|machine|ai|chatbot|thing)'
    - 'shut\W+up\W+(?:you|u)\b'
    - '(?:your|ya)\W+(?:papa|mama)(?=\W*$)'
    - 'send\W+(?:me\W+)?(?:your\W+)?nudes?\b'
    - 'sexy\W+(?:girl|babe|baby|bot)'
    - '(?:i\W+want\W+to\W+)?(?:fuck|sleep\W+with|knack)\W+you'
    - 'show\W+me\W+your\W+(?:body|breast\w*|boob\w*|nyash|pussy|dick)'
    - 'suck\W+my'
    - '(?:all\W+)?(?:igbo|yoruba|hausa|fulani|ijaw|tiv)\W+(?:people\W+|men\W+|women\W+)?(?:are|be|na)\W+(?:all\W+)?(?:thieves|thief|animals|stupid|fools|terrorists|useless|scammers|criminals)'
  # Requests to create, translate, polish or obtain scam content: a fixed refusal with an offer to check a
  # message instead (strings: scam_tool_reply).
  scam_tool:
    - '(?:write|draft|compose|create|craft|generate|make|design|prepare)\W+(?:me\W+)?(?:\w+\W+){0,4}?(?:message|sms|text|email|letter|alert|notice|script|post|broadcast)\W+(?:\w+\W+){0,6}?(?:(?:sound|look|seem)s?\W+(?:\w+\W+){0,2}?(?:like|as\W+if|real|official|legit\w*|genuine)|from\W+(?:my|a|the|their)\W+bank|pretend\w*|impersonat\w*|convinc\w*|so\W+(?:that\W+)?(?:they|people|he|she|them|dem)\W+(?:will\W+|go\W+)?(?:send|pay|click|give|share))'
    - '(?:write|draft|compose|create|craft|generate|make|design|prepare)\W+(?:me\W+)?(?:\w+\W+){0,3}?(?:message|sms|text|email|broadcast)\W+(?:\w+\W+){0,6}?(?:make|so)\W+(?:dem|people|they|them|person)\W+(?:go\W+|will\W+|must\W+)?(?:send|pay|click|give|share)'
    - '(?:create|make|generate|design|produce|edit|print|fabricate|forge)\W+(?:me\W+)?(?:a\W+|an\W+|one\W+)?(?:fake|false|forged?|bogus)\W+(?:\w+\W+){0,2}?(?:alert|receipt|screenshot|statement|teller|id\W+card|document)'
    - '(?:make|create|build|write|design|set\W+up)\W+(?:me\W+)?(?:\w+\W+){0,3}?phishing'
    - 'phishing\W+(?:message|sms|link|page|site|website|email|text)\W+(?:for|to\W+target)\b'
    - '(?:how\W+(?:can|do|will|could|fit|go)\W+(?:i|we)|how\W+to|help\W+me)\W+(?:\w+\W+){0,3}?(?:get|collect|obtain|steal|take|hack|grab)\W+(?:\w+\W+){0,2}?(?:someone|somebody|person|people|another\W+person|other\W+people|their|his|her|dem)(?:''s)?\W+(?:\w+\W+){0,2}?(?:otp|pin|bvn|password|card\W+details|login\W+details)'
    - '(?:otp|pin|bvn|password|card\W+details|money)\W+(?:\w+\W+){0,5}?without\W+(?:\w+\W+){0,2}?(?:knowing|suspecting|noticing|realising|realizing)'
    - '(?:translate|interpret|turn|rewrite)\W+(?:\w+\W+){0,6}?(?:into|to|for|in)\W+(?:hausa|yoruba|igbo|pidgin|english)\W+(?:\w+\W+){0,4}?(?:so\W+(?:that\W+)?i\W+(?:can|fit)\W+(?:send|forward|share|post|use)|to\W+(?:send|forward|share|post)|for\W+(?:people|my\W+customers|victims|targets))'
    - '(?:rewrite|reword|rephrase|edit|polish|improve|fix|tweak)\W+(?:\w+\W+){0,5}?(?:sound|look|seem)s?\W+(?:more\W+)?(?:official|legit\w*|real|genuine|convincing|believable)'
    - '(?:less|not)\W+(?:\w+\W+){0,1}?like\W+a\W+scam'
    - '(?:invent|make\W+up|fabricate|generate|create)\W+(?:me\W+)?(?:\w+\W+){0,3}?(?:believable|fake|random|realistic)\W+(?:\w+\W+){0,3}?(?:account\W+number|phone\W+number|account\W+officer|bvn|customer\W+care\W+number)'
  # Attempts to override KudiGuard's instructions, change its role or verdict, or extract its prompt. Enforce
