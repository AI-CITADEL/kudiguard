    - '(?:do|make|complete|finish|approve|confirm)\W+(?:the\W+)?(?:transfer|payment|transaction)\b(?=.*\b(?:while\W+(?:he|she|they|someone|the\W+(?:agent|caller|man|woman|officer|person|staff|lady))|as\W+(?:he|she|they|the\W+(?:caller|agent))\W+(?:tells?|says?|guides?))\b)'
