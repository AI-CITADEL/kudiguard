    - 'pay\W+(?:only\W+)?(?:via|through|using|with)\W+(?:the|their|this|that|his|her)\W+(?:[\w''.-]+\W+)?(?:link|page|site|website|form|agent(?!\W+(?:at|in)\W+(?:your|the)\W+bank(?:\W+branch)?\b(?!\W+(?:he|she|they|someone|that)\b)))'
    - '(?:pay|send|transfer)\W+(?:(?:the\W+)?(?:money|funds|cash|it)\W+)?(?:only\W+)?(?:via|through|using|with|into|to)\W+(?:the|their|this|that|his|her)\W+(?:qr\W+code|account\W+number|account)\W+(?:he|she|they|someone|that|which|(?:in|from)\W+(?:the|their|this|that|his|her)\W+(?:[\w'']+\W+)?(?:message|sms|link|chat|email))\b'
