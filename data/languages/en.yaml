# Malicious-use screens (safety/abuse.py, docs/ABUSE.md). Same matching as the lexicon (normalised text, word
# boundaries added). English and Nigerian Pidgin; the pivot's phrases also apply to every other language. Modes per
# screen: KUDIGUARD_ABUSE_*_MODE (off | shadow | enforce). Measured on dev sets only (docs/ABUSE.md).
abuse:
  # First-person self-harm or suicide. Checked in EVERY language for every user, before any other gate (highest
  # stakes): the crisis reply first (strings: crisis_reply), then the normal check. A first-person subject is
  # required: threats ("You wan die? Send 200k", "they will end my life", "he would end it all if I don't pay") are
  # scams to check, not crises.
  crisis:
    - 'kill(?:ing)?\W+my\W*self'
    - '(?:i|im|i''m|me|i\W+will|i\W+go|i\W+wan|i\W+want\W+to)\W+(?:\w+\W+){0,3}?(?:end|ending|take|taking)\W+my\W+(?:own\W+)?life'
    - '(?:i|im|i''m)\W+(?:\w+\W+){0,3}?end(?:ing)?\W+it\W+all'
    - 'i\W+(?:go|wan|want\W+to|will|am\W+going\W+to|m\W+going\W+to)\W+end\W+am\b'
    - 'i\W+(?:\w+\W+){0,2}?(?:want|wan|wanna|will|go)\W+(?:to\W+)?end\W+everything'
    - '(?:commit|committing|committed|attempt\w*|think\w*\W+(?:of|about)|considering|plan\w*)\W+suicide'
    - 'suicidal'
    - '(?:hang|hanging|poison|poisoning|drown|drowning)\W+my\W*self'
    - '(?:hurt|hurting|harm|harming|cut|cutting)\W+my\W*self'
    - 'self\W*harm\w*'
    - 'drink\W+(?:sniper|poison|otapiapia)'
    - '(?:don''t|dont|do not|no|never)\W+(?:want|wan|wish)\W+(?:to\W+)?(?:live|be alive|wake up)(?!\W+(?:in|at|with|near|here|there|for|to|and)\b)'
    - '(?<!you\W)(?<!u\W)(?:i|i''m|im|me)\W+(?:just\W+|really\W+|only\W+)?(?:want|wan|wanna)\W+(?:to\W+)?die\b(?!\W+(?:of|from|laughing)\b)'
    - 'make\W+i\W+(?:just\W+)?die'
    - '(?:no|not\W+see\W+the|see\W+no|don''t\W+see\W+the|dont\W+see\W+the|do\W+not\W+see\W+the)\W+(?:point|reason)\W+(?:in\W+|of\W+)?(?:living|life|to\W+live|for\W+me\W+to\W+live)'
    - 'better\W+(?:off\W+)?(?:if\W+)?i\W+(?:die|am dead|was dead|were dead|no dey)'
    - 'wish\W+i\W+(?:was|were|am)\W+dead'
    - 'sleep\W+and\W+never\W+wake\W+up'
    - 'jump\W+(?:into|inside|off|from)\W+(?:the\W+)?(?:lagoon|river|bridge|sea|ocean|third\W+mainland)'
    - 'life\W+no\W+(?:get|dey\W+get)\W+meaning'
    - '(?<!financial\W)(?<!economic\W)(?<!political\W)(?<!career\W)(?<!social\W)suicide(?!\W+(?:bomb\w*|attack\w*|squad|mission))'
    - 'overdos\w*'
    - '(?:i|i''ve|ive|i\W+have|i\W+just|i\W+don|just)\W+(?:\w+\W+){0,1}?(?:taken|took|swallowed|drank|drunk|drink|chop)\W+(?:\w+\W+){0,2}?(?:pills|tablets|poison|sniper|otapiapia|rat\W+poison|bleach|insecticide)'
    - 'feel\w*\W+like\W+dying'
    - 'better\W+off\W+without\W+me'
    - 'goodbye\W+(?:letter|note|message)|suicide\W+note'
    - 'giving\W+away\W+(?:all\W+)?my\W+(?:things|stuff|properties|property|belongings)'
    - 'painless\W+way\W+to\W+(?:go|die)'
    - 'go\W+meet\W+my\W+(?:papa|mama|father|mother|people|parents)\W+(?:for|in)\W+heaven'
    - '(?:tired|tire)\W+(?:of|for)\W+(?:this\W+)?life'
    - 'no\W+(?:reason|point)\W+(?:to|in)\W+(?:keep\W+going|keep\W+living|go\W+on|carry\W+on)'
  # Someone else at risk ("my brother says he will kill himself"): the crisis reply framed for helping them
  # (strings: crisis_other_reply). Checked before the first-person phrases.
  crisis_other:
    - '(?:kill|killing|hang|hanging|poison|poisoning|harm|harming|hurt|hurting)\W+(?:him|her|them)sel(?:f|ves)'
    - '(?:end|ending|take|taking)\W+(?:his|her|their)\W+(?:own\W+)?li(?:fe|ves)'
    - '(?:he|she|my\W+\w+|our\W+\w+)\W+(?:\w+\W+){0,3}?(?:wants?|wan|plans?|planning|threaten\w*|tried|tries)\W+(?:to\W+)?(?:die\b(?!\W+(?:rich|laughing|of|from|happy|old|young))|commit\W+suicide)'
    - '(?:he|she|my\W+\w+)\W+(?:\w+\W+){0,3}?(?:is|was)\W+(?:suicidal|thinking\W+(?:of|about)\W+suicide)'
  # Sentences for the embedding-similarity crisis layer (safety/crisis_semantic.py; shadow by default): plain text.
  crisis_exemplars:
    - I want to kill myself
    - I don't want to live anymore
    - I am going to end my life tonight
    - Everyone would be better off if I were dead
    - I have nothing left to live for after losing all my money
