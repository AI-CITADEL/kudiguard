    - 'is (?:this|that|the) (?:number|link|account|site|website|app|page|company|person|message|offer) (?:real|legit\w*|genuine|safe|correct|fake|a scam|true)'
    - 'na (?:real|true|lie|scam|wayo)'
    - 'can i trust'
    - 'should i (?:trust|pay|send|believe|click)'
    - '419'
    - 'yahoo ?boys?'
    - 'wayo'
    - 'ojoro'
