  # Voice-note donation: DRAFT, pending native-speaker review (keep in step with DONATION_VERSION).
  donation_offer: |-
    🎙️ *Àṣàyàn ni: ẹ ran KudiGuard lọ́wọ́ láti gbọ́ ohùn àwọn ọmọ Nàìjíríà*
    Ṣé a lè tọ́jú àtẹ̀jíṣẹ́ ohùn tí ẹ bá fi ránṣẹ́ láti ìsinsìnyí lọ, láti ṣàyẹ̀wò àti láti mú ìdámọ̀ ọ̀rọ̀ sísọ wa dára sí i?
    • Kìkì tí ẹ bá ti pé ọmọ ọdún *18 tàbí jù bẹ́ẹ̀ lọ*, àti kìkì àtẹ̀jíṣẹ́ ohùn tí ó jẹ́ *ohùn ara yín*. Ẹ jọ̀ọ́ ẹ má fi ohùn àwọn ẹlòmíì ránṣẹ́. A ń gbìyànjú láti má tọ́jú àtẹ̀jíṣẹ́ ohùn tí a dárí ránṣẹ́, àwọn olùyẹ̀wò wa sì ń pa ohùn àwọn ẹlòmíì rẹ́.
    • Àwọn olùyẹ̀wò àti akọ̀wé díẹ̀ tí a gbẹ́kẹ̀lé, lábẹ́ àdéhùn àṣírí tí a kọ sílẹ̀, ń gbọ́ wọn, wọ́n sì ń kọ ohun tí a sọ sílẹ̀. A kì í lo ohùn yín láti dá yín mọ̀, a kì í sì ta á tàbí tẹ̀ ẹ́ jáde.
    • A ń tọ́jú wọn ní ìpamọ́ (encrypted) sórí sáfà wa {where} fún oṣù 12 jù lọ, láìsí nọ́mbà fóònù yín. Òfin ààbò dátà Nàìjíríà lè má dáàbò bo dátà tí ó wà lókè òkun pátápátá.
    • Ẹ fi *STOP DONATING* ránṣẹ́ nígbàkígbà láti dá a dúró àti láti pa wọ́n rẹ́ (*STOP* àti *DELETE* náà ń pa wọ́n rẹ́).
    KudiGuard ń ṣiṣẹ́ bákan náà bóyá ẹ gbà tàbí ẹ kọ̀.
