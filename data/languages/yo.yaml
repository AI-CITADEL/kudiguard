# Yoruba (beta: N-ATLAS human-eval average 2.69/5). Accents are stripped before matching.
# Native terms below are a starter set and MUST be reviewed by a native speaker before launch.
code: yo
name: Yoruba
native_name: Yorùbá
order: 2
status: beta
asr_model: NCAIR1/Yoruba-ASR
asr_whisper_language: yo
review:
  lexicon: pending-native-review
  strings: pending-native-review

commands:
  stop: [ẹ dá a dúró, má fi ránṣẹ́ mọ́]  # not bare "dúró": it also means "wait"
  delete: [pa àwọn ìfiránṣẹ́ mi rẹ́]
  language: [èdè, yí èdè padà]
  donate: [fi ohùn mi tọrẹ, ìtọrẹ ohùn]  # DRAFT, pending native review
  stop_donating: [dá ìtọrẹ ohùn dúró, ẹ dá ìtọrẹ ohùn dúró]  # DRAFT
  greetings: [báwo, báwo ni, ẹ n lẹ́, ẹ kú àárọ̀, ẹ kú ọ̀sán, ẹ kú ìrọ̀lẹ́, ẹ kú alẹ́, ẹ ṣé, ẹ ṣeun, o ṣé, o ṣeun,
    ẹ ṣé gan, pẹ̀lẹ́, ó dáa]

output_guard:
  safety_claims:
    - 'ki i se (?:etan|jibiti|ojoro)'
    - 'ko si ewu'
  refusals:
    - 'mi o le ran'

lexicon:
  flags:
    urgency:
      - 'kiakia'
    asks_credentials:
      - 'fi\W+(?:\w+\W+){0,2}?(?:koodu|code|otp|pin)\W+(?:\w+\W+){0,3}?ranse'
      - '(?:so|ka)\W+(?:koodu|code|otp|pin)\W+(?:\w+\W+){0,2}?fun (?:mi|wa|un|won)'
    account_threat:
      - '(?:akaunti|account)\W+(?:\w+\W+){0,2}?(?:ti|maa|yoo|o) (?:di|dina|pa)'
    guaranteed_returns:
      - 'ilopo (?:meji|meta)'
    upfront_fee:
      - 'san\W+(?:\w+\W+){0,4}?ki (?:o|e|a) (?:to|too) (?:gba|ri)'
    secrecy:
      - '(?:ma|e ma) (?:se )?so fun enikeni'
  check_intent:
    - 'jibiti'
    - 'ojoro'
    - 'ayederu'

# Fixed user-facing text: DRAFT, pending native-speaker review. Buttons (btn_*) max 20 chars.
strings:
  welcome: |-
    👋 Ẹ káàbọ̀ sí *KudiGuard*. Mo ń ràn yín lọ́wọ́ láti dá ẹ̀tàn owó mọ̀ àti láti dáhùn ìbéèrè nípa owó.

    Ẹ fi *àtẹ̀jíṣẹ́ ohùn* tàbí ọ̀rọ̀ ránṣẹ́ sí mi, tàbí kí ẹ dárí ọ̀rọ̀ tí ẹ kò dá lójú rẹ̀ sí mi.

    🔒 A ń tọ́jú àwọn ọ̀rọ̀ yín fún ọjọ́ 90 jù lọ láti mú iṣẹ́ wa dára sí i. Àwọn olùyẹ̀wò díẹ̀ tí a gbẹ́kẹ̀lé (ẹgbẹ́ wa tàbí àwọn tí èdè náà jẹ́ èdè abínibí wọn, lábẹ́ àdéhùn àṣírí tí a kọ sílẹ̀) lè ka díẹ̀ lára àwọn ọ̀rọ̀ àti èsì, pẹ̀lú nọ́ńbà tí a bò mọ́lẹ̀, láìsí nọ́mbà fóònù yín tàbí àmì ìdánimọ̀ kankan, láti ṣàyẹ̀wò dídára àti ààbò; a ń pa ẹ̀dà tiwọn rẹ́ lẹ́yìn àyẹ̀wò. A ń tọ́jú nọ́mbà fóònù yín ní ọ̀nà àṣírí nìkan, a sì ń pa àtẹ̀jíṣẹ́ ohùn rẹ́ lẹ́yìn tí a bá kọ ọ́ sílẹ̀, àyàfi tí ẹ bá yàn láti fi wọ́n tọrẹ (a máa béèrè lọ́tọ̀). Ẹ fi *DELETE* ránṣẹ́ nígbàkígbà láti pa àwọn ọ̀rọ̀ yín rẹ́, tàbí *STOP* láti dá a dúró. A ń tọ́jú àpẹẹrẹ jìbìtì (a yọ ọ̀pọ̀ nọ́ńbà kúrò) lọ́tọ̀ fún ọdún 2 jù lọ láti dáàbò bo àwọn míì àti láti mú KudiGuard dára sí i; DELETE tún ń pa àwọn tí a mú láti inú ọ̀rọ̀ yín àìpẹ́ yìí rẹ́. Tí ẹ bá tẹ̀síwájú, ẹ ti gbà sí èyí.
    🌍 Láti ṣiṣẹ́ KudiGuard, àwọn ọ̀rọ̀ yín ń kọjá láàárín WhatsApp (Meta) àti Cloudflare, lẹ́yìn òde Nàìjíríà, a sì ń tọ́jú wọn sórí sáfà wa {where}. Òfin ààbò dátà Nàìjíríà lè má dáàbò bo dátà tí ó wà lókè òkun pátápátá. Tí ẹ bá tẹ̀síwájú, ẹ tún gbà sí gbígbé dátà yìí lọ.
    ℹ️ Ìtọ́sọ́nà ni èyí, kì í ṣe ìmọ̀ràn ìṣúná owó.
    _N-ATLaS is an initiative of the Federal Ministry of Communications, Innovation and Digital Economy and powered by Awarri Technologies._
