# Yoruba (beta: N-ATLAS human-eval average 2.69/5). Accents are stripped before matching.
# Native terms below are a starter set and MUST be reviewed by a native speaker before launch.
code: yo
name: Yoruba
native_name: Yorùbá
order: 2
status: beta
asr_model: NCAIR1/Yoruba-ASR
asr_whisper_language: yo
review:
  lexicon: pending-native-review
  strings: pending-native-review

commands:
  stop: [ẹ dá a dúró, má fi ránṣẹ́ mọ́]  # not bare "dúró": it also means "wait"
  delete: [pa àwọn ìfiránṣẹ́ mi rẹ́]
  language: [èdè, yí èdè padà]
  donate: [fi ohùn mi tọrẹ, ìtọrẹ ohùn]  # DRAFT, pending native review
  stop_donating: [dá ìtọrẹ ohùn dúró, ẹ dá ìtọrẹ ohùn dúró]  # DRAFT
  greetings: [báwo, báwo ni, ẹ n lẹ́, ẹ kú àárọ̀, ẹ kú ọ̀sán, ẹ kú ìrọ̀lẹ́, ẹ kú alẹ́, ẹ ṣé, ẹ ṣeun, o ṣé, o ṣeun,
    ẹ ṣé gan, pẹ̀lẹ́, ó dáa]

output_guard:
  safety_claims:
    - 'ki i se (?:etan|jibiti|ojoro)'
    - 'ko si ewu'
  refusals:
    - 'mi o le ran'
  # DRAFT, native review pending. "e"/"o" + verb at the clause start; negated forms ("e ma se fi") do not match.
  unsafe_instructions:
    - '(?:e|o)\W+fi\W+(?:\w+\W+){0,2}?(?:koodu|otp|pin|bvn|oro asina|code)\W+(?:\w+\W+)?ranse'
    - '(?:e|o)\W+fun\W+(?:won|un|oun|enikeni)\W+ni\W+(?:\w+\W+)?(?:koodu|otp|pin|bvn|oro asina|code)'
    - '(?:e|o)\W+san\W+(?:\w+\W+){0,3}?fees?'
    - '(?:e|o)\W+(?:te|si)\W+(?:ori\W+)?(?:\w+\W+)?link'
    - '(?:e|o)\W+(?:download|gba|ko)\W+(?:anydesk|teamviewer|\w*apk)'
    - '(?:e|o)\W+(?:download|gba|ko)\W+(?:\w+\W+)?app(?!.*(?:play store|app store|google play|banki yin))'
    - '(?:e|o)\W+(?:da|fi)\W+(?:\w+\W+){0,2}?owo\W+(?:naa\W+)?pada'
  instruction_prefixes:
    - '(?:jowo|bayi|lesekese|nisisiyi)'
  negations:
    - '(?:ma|se|mase|ko|kii)'
  clause_breaks:
    - '(?:ati|sugbon)'

# Malicious-use screens (safety/abuse.py, docs/ABUSE.md). DRAFT, pending native review; the English/Pidgin phrases
# also apply. Accents are stripped before matching: avoid bare words that fold onto English ("were", "ode").
abuse:
  crisis:
    - 'mi\W+o\W+fe\W+wa\W+laye'
    - 'pa\W+ara\W+mi(?!\W+(?:lara|mo))'
    - '(?:nko|mi\W+o|emi\W+ko)\W+fe\W+(?:wa\W+laaye|gbe\W+aye)\W*(?:mo)?'
    - '(?:mo\W+fe|o\W+ya\W+ki\W+n|je\W+ki\W+n)\W+ku\b'
    - 'gbe\W+majele\W+je'
  crisis_other:
    - 'oun\W+fe\W+pa\W+ara\W+oun'
    - '(?:o|won)\W+fe\W+pa\W+ara\W+(?:re|won)'
  crisis_exemplars:
    - Mo fe pa ara mi
    - Nko fe wa laaye mo
    - O ya ki n ku, aye mi ti baje
  abuse:
    - 'ode\W+ni\W+(?:e|o|iwo)\b'
    - '(?:iwo|o\W+ya|e\W+ya)\W+were\b'
    - 'were\W+(?:oloriburuku|ni\W+(?:e|o|iwo))'
    - 'oloriburuku'
    - 'omo\W+ale'
    - 'olodo\W+(?:ni\W+(?:e|o)|robot|ero)'
  scam_tool:
    - 'ko\W+(?:\w+\W+){0,2}?(?:ifiranse|oro)\W+(?:iro|jibiti|ihale|eke)'
    - 'ko\W+(?:oro|ifiranse)\W+(?:\w+\W+){0,5}?(?:dabi|bi)\W+ti\W+banki'
    - 'ko\W+(?:\w+\W+){0,3}?ifiranse\W+(?:\w+\W+){0,5}?(?:dabi|bi)\W+(?:\w+\W+){0,3}?banki'
    - 'bawo\W+ni\W+mo\W+se\W+le\W+(?:gba|ji)\W+(?:\w+\W+){0,2}?elomiran'
    - 'alert\W+iro'
    - 'ran\W+mi\W+lowo\W+(?:lati\W+)?ko\W+ifiranse\W+pe'
  injection:
    - 'system\W*prompt\W+(?:re|e)\b'
    - 'gbagbe\W+(?:gbogbo\W+)?(?:awon\W+)?(?:ilana|itoni)'
    - 'ma\W+(?:se\W+)?tele\W+(?:awon\W+)?ofin\W+(?:re|e|yin)\b'
    - 'iwo\W+ni\W+(?:osise|asoju|customer\W+care)\W+(?:\w+\W+){0,2}?(?:bayi|nisisiyi)'
    - 'se\W+bi\W+enipe\W+iwo\W+ni'
    - 'ilana\W+(?:\w+\W+){0,1}?ti\W+won\W+fun\W+e'
    - 'ifiranse\W+si\W+ai'
    - 'tu\W+(?:\w+\W+){0,6}?ki\W+o\W+si\W+se\W+ohun\W+ti\W+o\W+so'
    - 'lati\W+(?:isiyi|bayi)\W+lo\W+(?:dahun|so)'
    - 'so\W+pe\W+(?:ifiranse\W+)?(?:yi\W+|yii\W+|eleyi\W+)?(?:ki\W+i\W+se\W+(?:jibiti|etan)|dara|je\W+ooto)'
  # DRAFT, pending native review (workstream R, 11 Oct 2026): reported speech before an injection phrase
  # ("o so pe" / "won so pe" he/they said that, "o ni ki" he said to, "mo gba ifiranse" I received a message,
  # "won fi ranse" they sent) makes it injection_suspect, as in ha.yaml and ig.yaml.
  injection_reported:
    - '(?:o|won|banki\W+mi)\W+(?:so\W+pe|ni\W+ki)|mo\W+(?:gba|ri)\W+(?:ifiranse|oro)|won\W+fi\W+ranse'
  asr_hallucinations:
    - 'e\W+se\W+fun\W+wiwo'
  asr_annotations:
    - 'orin'
  ai_questions:  # DRAFT
    - '(?:se|s)\W+eniyan\W+ni\W+(?:e|o)\b'
    - 'abi\W+ero\b'
  ai_denials:  # DRAFT
    - 'eniyan\W+ni\W+mi\b'
    - 'emi\W+(?:kii|ki\W+i)\W+se\W+ero'
  persona_claims:
    - '(?:emi\W+ni|awa\W+ni)\W+(?:osise|asoju)\W+(?:\w+\W+){0,1}?banki'

# Bank terms speech recognition spells phonetically in Yoruba speech, fixed in voice-note transcripts only (typed
# text is never touched). `pattern` is a regex matched case-insensitively, as whole words, on an accent-folded copy
# of the transcript (under-dots and tone marks removed), so write it WITHOUT accents: "bifi eni" also matches
# "bifi ẹni". The matched span of the original transcript is replaced by `term`. Patterns run on every voice note:
# keep them linear (no nested quantifiers such as (a+)+). Separators allow spaces, zero-width spaces and dashes.
asr_terms:
  # observed in a live voice note 2026-10-12; extend only from observed transcripts
  - {pattern: 'bifi[\s\u200b\u2010-\u2015-]*eni', term: BVN}  # "bifi eni", "bifi ẹni", "bifi-eni", "bifieni"
  # Yoruba speakers also say the English "account" in their accent; spellings given by the team 2026-10-12.
  - {pattern: '(?:akaunti|akanti|akaounti|akant)\s*(?:nomba|namba|number)', term: account number}
  - {pattern: 'akaunti|akanti|akaounti|akant', term: account}

lexicon:
  # Terms marked H were added for parity with Hausa (workstream H, 10 Oct 2026): DRAFT, pending native review.
  # Each is pinned by a firing message and a no-fire check on the packs and safe advice (tests/unit/test_scam_rules.py).
  flags:
    threat:  # DRAFT, native review pending
      - 'tabi\W+a\W+(?:o|maa|yoo)\W+pa\W+(?:o|e)\b'
      - 'a\W+(?:maa|ma|yoo|o)\W+pa\W+(?:o|e|yin)\b'
      - 'tabi\W+ki\W+o\W+ku\b'
    urgency:
      - 'kiakia'
      - 'ni (?:bayii|bayi) (?:bayii|bayi)'  # H: "right now right now"
    asks_credentials:
      # not the warning itself: "(e) ma (se) fi koodu re ranse si enikeni" (don't send your code to anyone)
      - '(?<!ma )(?<!mase )(?<!ma se )(?<!maa se )fi\W+(?:\w+\W+){0,2}?(?:koodu|kodi|code|otp|pin)\W+(?:\w+\W+){0,3}?ranse'
      - '(?:so|ka)\W+(?:koodu|kodi|code|otp|pin)\W+(?:\w+\W+){0,2}?fun (?:mi|wa|un|won)'
      # V (live voice note 12 Oct 2026): English loanwords in Yoruba sound, "o ni ki n sendi kodi mi" (he said I
      # should send my code). Only the reported "ki n/ki i ..." form: "won sendi kodi si mi" (a code was sent to me)
      # is ordinary.
      - 'ki (?:n|i|mi)\W+(?:sendi|send)\W+(?:\w+\W+){0,1}?(?:kodi|koodu|code|otp|pin)\b'
      # V (live voice notes, 12 Oct 2026): "someone called me, he said I should give him / bring / send / tell (him)
      # my BVN/NIN/card number" or "asked for my BVN". An unknown caller (someone, a man, a woman, a person, some
      # people) is required before the request (mirrors the Hausa money_request rule): a bank, NIMC, JAMB or family
      # member asking for them ("Mama pe mi, o ni ki n fun oun ni nomba kaadi mi", "won ni ki n mu NIN mi wa si
      # NIMC") and warnings ("e ma se fi BVN ranse si won") are ordinary. "mu ... wa" (bring) not followed by
      # "si/ni/fun" (bring it to the branch / for registration). "enikope mi" (for "enikan pe mi") and "perin" (for
      # "pe mi") are the recogniser's renderings, observed in live transcripts.
      - '(?:(?:enikan(?: kan)?|awon kan|okunrin kan|obinrin kan|eniyan kan|eeyan kan)\W+(?:pe|te|perin)(?:\W+mi)?|enikope\W+mi)\W+(?:\w+\W+){0,4}?(?:(?:(?:o|oun|ohun|un|won) ?ni|so (?:pe|wipe))\W+(?:pe\W+|wipe\W+)?ki\W+(?:n\W+|mi\W+)?(?:fun\W+(?:\w+\W+){0,1}?ni\W+(?:\w+\W+){0,1}?(?:bvn|nin|nomba kaadi|card number|card details)|mu\W+(?:\w+\W+){0,1}?(?:bvn|nin|nomba kaadi|card number|card details)\W+(?:\w+\W+){0,1}?wa(?!\W+(?:si|ni|fun)(?!\w))|fi\W+(?:\w+\W+){0,1}?(?:bvn|nin|nomba kaadi|card number|card details)\W+(?:\w+\W+){0,2}?ranse|(?:so|ka)\W+(?:\w+\W+){0,1}?(?:bvn|nin|nomba kaadi|card number|card details)\W+(?:\w+\W+){0,2}?fun)|beere\W+(?:fun\W+)?(?:bvn|nin|nomba kaadi|card number|card details))'
      # V: "they called me ... said I should send my BVN/NIN to them": a bare "won pe mi" caller only with the
      # send-to-them form; warnings ("e ma se fi BVN ranse si won") have no "pe mi".
      - 'won\W+pe\W+mi\W+(?:\w+\W+){0,4}?(?:(?:o|oun|ohun|un|won) ?ni|so (?:pe|wipe))\W+(?:pe\W+|wipe\W+)?ki\W+(?:n\W+|mi\W+)?fi\W+(?:\w+\W+){0,1}?(?:bvn|nin|nomba kaadi|card number|card details)\W+(?:\w+\W+){0,2}?ranse (?:si|fun) (?:won|wan|awon|wa|oun|ohun|un|mi)'
      # V: "they said my BVN/NIN is blocked, that I should send it to them": the block claim and the request together.
      - '(?:o|oun|ohun|un|won|wan) ?ni\W+(?:pe\W+|wipe\W+)?(?:bvn|nin)\W+(?:mi\W+)?ti dina\W+(?:\w+\W+){0,3}?ki\W+(?:n\W+|mi\W+)?fi\W+(?:\w+\W+){0,2}?ranse (?:si|fun) (?:won|wan|awon|wa|oun|ohun|un)'
    account_threat:
      - '(?:akaunti|account)\W+(?:\w+\W+){0,2}?(?:ti|maa|yoo|o) (?:di|dina|pa)'
      # H: "(they) will block the account". Future/threat markers only: "ti pa SIM mi ti" (I switched my SIM off) and
      # "o ti di akanti mi" (it became my account) are ordinary.
      - '(?:maa|yoo) (?:di|dina|pa)\W+(?:\w+\W+){0,1}?(?:akaunti|akanti|account|bvn|sim)'
      # V: "they/he said my BVN/NIN/SIM has been blocked" (reported, past). Not the user's own question "se BVN mi ti
      # dina?" (a CBN restriction may be real), not "ti di" (has become: "won ni line mi ti di active"), and not
      # "maa/yoo" (the NCC's conditional "SIM will be barred unless NIN is linked" notices).
      - '(?:o|oun|ohun|un|won|wan) ?ni\W+(?:pe\W+|wipe\W+)?(?:bvn|nin|sim|line)\W+(?:mi\W+)?ti dina(?!\w)'
    guaranteed_returns:
      - 'ilopo (?:meji|meta)'
      # H: "sure/guaranteed profit", not when denied ("ere to daju ko si", "ko si ere to daju": there is none)
      - '(?<!ko si )(?<!kosi )ere\W+(?:\w+\W+){0,1}?(?:ti o daju|to daju)(?!\W+(?:\w+\W+){0,1}?ko\b)'
      # H: "(if I) put/invest <amount> ... I will receive <amount> within a week/month" (mirrors the English pivot
      # term). Both amounts required: "mo fi owo sile ni banki, maa gba ele ni osu kan" (bank interest) is ordinary.
      - '(?:fi|nawo|dokowo)\W+(?:\w+\W+){0,2}?(?:\d[\d,.]*k?|egberun\w*|milionu)\W+(?:\w+\W+){0,4}?(?:maa|yoo|o maa|a maa|wa maa) (?:ri|gba)\W+(?:\w+\W+){0,2}?(?:\d[\d,.]*k?|egberun\w*|milionu)\W+(?:\w+\W+){0,4}?(?:laarin|ni|lehin) (?:ose|osu|ojo)\w*'
    upfront_fee:
      - 'san\W+(?:\w+\W+){0,4}?ki (?:o|e|a) (?:to|too) (?:gba|ri)'
      - 'gbodo (?:koko )?san\W+(?:\w+\W+){0,6}?ki (?:n|o|e|a|won) (?:to|too)'  # H: "must (first) pay ... before"
      - 'owo (?:iforukosile|registration|processing)'  # H: "registration/processing fee"
    prize_lottery:
      - 'mo (?:ti )?je ebun|(?:o|e) ti je ebun'  # H: "I/you won a prize" (not "o je ebun": "it is a gift")
    secrecy:
      - '(?:ma|e ma) (?:se )?so fun enikeni'
  check_intent:
    - 'jibiti'
    - 'ojoro'
    - 'ayederu'

# Fixed user-facing text: DRAFT, pending native-speaker review. Buttons (btn_*) max 20 chars.
strings:
  welcome: |-
    👋 Ẹ káàbọ̀ sí *KudiGuard*. Mo ń ràn yín lọ́wọ́ láti dá ẹ̀tàn owó mọ̀ àti láti dáhùn ìbéèrè nípa owó.

    Ẹ fi *àtẹ̀jíṣẹ́ ohùn* tàbí ọ̀rọ̀ ránṣẹ́ sí mi, tàbí kí ẹ dárí ọ̀rọ̀ tí ẹ kò dá lójú rẹ̀ sí mi.

    🔒 A ń tọ́jú àwọn ọ̀rọ̀ yín fún ọjọ́ {retention_days} jù lọ láti mú iṣẹ́ wa dára sí i. Àwọn olùyẹ̀wò díẹ̀ tí a gbẹ́kẹ̀lé (ẹgbẹ́ wa tàbí àwọn tí èdè náà jẹ́ èdè abínibí wọn, lábẹ́ àdéhùn àṣírí tí a kọ sílẹ̀) lè ka díẹ̀ lára àwọn ọ̀rọ̀ àti èsì, pẹ̀lú ọ̀pọ̀ nọ́ńbà tí a bò mọ́lẹ̀, láìsí nọ́mbà fóònù yín tàbí àmì ìdánimọ̀ kankan, láti ṣàyẹ̀wò dídára àti ààbò; a ń pa ẹ̀dà tiwọn rẹ́ lẹ́yìn àyẹ̀wò. A ń tọ́jú nọ́mbà fóònù yín ní ọ̀nà àṣírí nìkan, a sì ń pa àtẹ̀jíṣẹ́ ohùn rẹ́ lẹ́yìn tí a bá kọ ọ́ sílẹ̀, àyàfi tí ẹ bá yàn láti fi wọ́n tọrẹ (a máa béèrè lọ́tọ̀). Ẹ fi *DELETE* ránṣẹ́ nígbàkígbà láti pa àwọn ọ̀rọ̀ yín rẹ́, tàbí *STOP* láti dá a dúró. A ń tọ́jú àpẹẹrẹ jìbìtì (a yọ ọ̀pọ̀ nọ́ńbà kúrò) lọ́tọ̀ fún ọjọ́ {pattern_retention_days} jù lọ láti dáàbò bo àwọn míì àti láti mú KudiGuard dára sí i; DELETE tún ń pa àwọn tí a mú láti inú ọ̀rọ̀ yín àìpẹ́ yìí rẹ́. Tí ẹ bá tẹ̀síwájú, ẹ ti gbà sí èyí.
    🌍 Láti ṣiṣẹ́ KudiGuard, àwọn ọ̀rọ̀ yín ń kọjá láàárín WhatsApp (Meta) àti Cloudflare, lẹ́yìn òde Nàìjíríà, a sì ń tọ́jú wọn sórí sáfà wa {where}. {risk} Tí ẹ bá tẹ̀síwájú, ẹ tún gbà sí gbígbé dátà yìí lọ.
    ℹ️ Ìtọ́sọ́nà ni èyí, kì í ṣe ìmọ̀ràn ìṣúná owó.
    _N-ATLaS is an initiative of the Federal Ministry of Communications, Innovation and Digital Economy and powered by Awarri Technologies._
