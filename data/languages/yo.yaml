  donation_declined: "👍 Kò burú. A kò ní tọ́jú àtẹ̀jíṣẹ́ ohùn yín: a ń pa wọ́n rẹ́ lẹ́yìn tí a bá kọ wọ́n sílẹ̀."
  donation_unavailable: "🎙️ Ìtọrẹ ohùn kò tíì sí nílẹ̀. Ẹ ṣé fún ìfẹ́ yín!"
  stopped_donor: "Ẹ kò ní gba ọ̀rọ̀ láti ọ̀dọ̀ KudiGuard mọ́, a sì ti pa àtẹ̀jíṣẹ́ ohùn tí ẹ fi tọrẹ rẹ́. Ẹ fi ọ̀rọ̀ èyíkéyìí ránṣẹ́ láti tún bẹ̀rẹ̀."
