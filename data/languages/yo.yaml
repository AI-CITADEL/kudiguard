  where_to_report: '*Ibi tí ẹ ti lè fi ẹjọ́ sùn:*'
  disclaimer: _Ìtọ́sọ́nà nìkan ni, kì í ṣe ìmọ̀ràn ìṣúná owó._
  feedback_prompt: Ṣé èyí ràn yín lọ́wọ́?
  feedback_thanks: 🙏 Ẹ ṣé! Èsì yín ń ràn wá lọ́wọ́ láti dáàbò bo ọ̀pọ̀ ènìyàn.
  btn_helpful: 👍 Ó wúlò
  btn_not_helpful: 👎 Kò wúlò
  btn_what_to_do: Kí ni kí n ṣe?
  btn_report: Ibi tí mo lè fi sùn
  btn_warn_family: Kìlọ̀ fún ẹbí mi
  warn_family_intro: Ẹ fi èyí ránṣẹ́ sí ẹbí àti ọ̀rẹ́ yín 👇
  warn_family_footer: Láti ọwọ́ KudiGuard. Ẹ ṣàyẹ̀wò àwọn ọ̀rọ̀ tí ẹ kò dá lójú lọ́fẹ̀ẹ́ lórí WhatsApp.
  greeting_reply: 👋 Ẹ n lẹ́ o! Ẹ fi ohùn tàbí ọ̀rọ̀ tí ẹ kò dá lójú ránṣẹ́ sí mi, tàbí kí ẹ béèrè ìbéèrè èyíkéyìí nípa owó.
  not_understood: Ẹ má bínú, mi ò gbọ́ ọ dáadáa. Ẹ jọ̀ọ́ ẹ tún gbìyànjú tàbí kí ẹ kọ ọ̀rọ̀ yín.
  audio_too_long: ⏱️ Ẹ jọ̀ọ́ ẹ fi ohùn tí kò ju ìṣẹ́jú-àáyá {seconds} lọ ránṣẹ́.
  unsupported: Mo lè ka ọ̀rọ̀ àti gbọ́ ohùn. Ẹ jọ̀ọ́ ẹ fi ọ̀kan nínú wọn ránṣẹ́.
  rate_limited: ⏳ Ẹ ti fi ọ̀pọ̀ ọ̀rọ̀ ránṣẹ́. Ẹ jọ̀ọ́ ẹ dúró díẹ̀ kí ẹ tó tún gbìyànjú.
  error_retry: 😔 Ẹ má bínú, nǹkan kan ṣẹlẹ̀ ní ẹ̀gbẹ́ mi. Ẹ jọ̀ọ́ ẹ tún gbìyànjú láìpẹ́.
  stopped: Ẹ kò ní gba ọ̀rọ̀ láti ọ̀dọ̀ KudiGuard mọ́. Ẹ fi ọ̀rọ̀ èyíkéyìí ránṣẹ́ láti tún bẹ̀rẹ̀.
  deleted: 🗑️ A ti pa àwọn ọ̀rọ̀ yín rẹ́.
  fallback_scam: "Ẹ má ṣe fi owó ránṣẹ́, ẹ má sì fún ẹnikẹ́ni ní kóòdù, PIN tàbí ọ̀rọ̀ aṣínà yín. Ẹ dá ìbáṣepọ̀ dúró, kí ẹ sì pe báǹkì yín ní nọ́ńbà tó wà lórí káàdì yín."
  fallback_answer: "Mi ò lè pèsè ìdáhùn kíkún báyìí. Ẹ jọ̀ọ́ ẹ gbìyànjú lẹ́ẹ̀kan sí i láìpẹ́, tàbí kí ẹ béèrè lọ́wọ́ báǹkì yín tààrà."
  fallback_steps: |-
    1. Ẹ má ṣe fún ẹnikẹ́ni ní kóòdù (OTP), PIN tàbí ọ̀rọ̀ aṣínà yín.
    2. Ẹ má ṣe fi owó ránṣẹ́ tàbí ṣí ìjápọ̀ (link) láti ọ̀dọ̀ ẹni yìí.
    3. Ẹ pe báǹkì yín ní nọ́ńbà tó wà lórí káàdì yín kí ẹ sì fi ẹjọ́ sùn.
  warn_family_fallback: "⚠️ Ìkìlọ̀ nípa jìbìtì: ẹnìkan lè kàn sí yín pé òun wá láti báǹkì tàbí ilé-iṣẹ́ ìjọba, tàbí kí ó ṣèlérí owó fún yín. Ẹ má ṣe fún ẹnikẹ́ni ní OTP, PIN tàbí BVN yín, ẹ má sì san owó kankan kí ẹ tó gba owó. Ẹ kọ́kọ́ bá báǹkì yín sọ̀rọ̀."
  at_capacity: "😔 KudiGuard ti kún báyìí. Ẹ jọ̀ọ́ ẹ gbìyànjú lẹ́ẹ̀kan sí i lẹ́yìn ọjọ́ díẹ̀."
  busy: "⏳ Ọ̀pọ̀ ènìyàn ló ń béèrè báyìí. Ẹ jọ̀ọ́ ẹ gbìyànjú lẹ́ẹ̀kan sí i lẹ́yìn ìṣẹ́jú kan."
  privacy_link: "🔐 Ìkéde àṣírí: {url}"
