  btn_language_menu: Yan èdè
  language_set: ✅ Màá dá yín lóhùn ní {language}.
  beta_language: ℹ️ Ìtìlẹ́yìn {language} ṣì jẹ́ tuntun, nítorí náà àwọn ìdáhùn kan lè ní àṣìṣe.
  listening: 🎧 Mo ń gbọ́…
