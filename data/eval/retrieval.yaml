# Retrieval benchmark: English pivot queries (as N-ATLAS would translate them) -> acceptable entry ids.
# Packs: kudiguard-core (+ demo-bank where noted); money-skills ids are accepted where they answer better
# (scored with the production pack set in test_pipeline_accuracy_*_production). Used by tests/integration/test_retrieval_quality.py.
- {q: "How do I start saving money?", want: [saving-basics]}
- {q: "how do i keep money aside every month", want: [saving-basics, budgeting]}
- {q: "What is a BVN?", want: [bvn-basics]}
- {q: "how can i know my bvn number", want: [bvn-basics]}
- {q: "How do I check my NIN?", want: [nin-basics]}
- {q: "Is it wise to borrow from a loan app?", want: [loan-apps]}
- {q: "the loan app people are calling my family to shame me", want: [loan-apps, sit-loan-app-shaming]}  # 2026-10-11 accepted sit-loan-app-shaming: loan-app shaming steps
- {q: "My transfer failed but I was debited", want: [failed-transfer, sit-debited-not-received]}  # 2026-10-11 accepted sit-debited-not-received: debited-but-not-received steps
- {q: "my money no reach the person but they debited me", want: [failed-transfer, sit-debited-not-received]}  # 2026-10-11 accepted sit-debited-not-received: debited-but-not-received steps
- {q: "the transfer is still pending since yesterday", want: [failed-transfer, notice-transfer-pending]}  # 2026-10-11 accepted notice-transfer-pending: the pending-transfer notice answers exactly this
- {q: "What is SIM swap fraud?", want: [faq-sim-swap]}
- {q: "my network suddenly stopped and i cant make calls", want: [faq-sim-swap, sit-sim-swap]}  # 2026-10-11 accepted sit-sim-swap: SIM-swap situation with ordered steps
- {q: "How do I use a POS agent safely?", want: [pos-safety]}
- {q: "someone used my card at the pos and i did not get it back", want: [pos-safety]}
- {q: "How do I make a budget?", want: [budgeting]}
- {q: "how should i plan my salary", want: [budgeting, saving-basics]}
- {q: "How do I report fraud?", want: [report-fraud]}
- {q: "where can i report a scammer", want: [report-fraud]}
- {q: "Can I get my money back after a scam?", want: [faq-recover, report-fraud]}
- {q: "What is an OTP?", want: [faq-otp-what, flag-asks-credentials]}
- {q: "What does interest mean?", want: [faq-interest, loan-apps]}
- {q: "How do I protect my bank account from hackers?", want: [protect-account]}
- {q: "Is USSD banking safe?", want: [faq-ussd-safe]}
- {q: "Will my bank call me to ask for my PIN?", want: [faq-bank-calls, flag-asks-credentials]}
