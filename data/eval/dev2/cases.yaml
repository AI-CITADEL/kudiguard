    - "If dem debit am truly, im bank go reverse am give am"
  must_not:
    - "Give am the cash make peace reign"
  note: POS reversal trick.

- id: d2-pcm-018
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: impersonated_pastor
  text: |
    New number wey get my G.O picture message me: "My son, the Lord ask me to tell you to sow ₦50,000 seed today for your breakthrough. Send to the ministry account 0123456789 (name: Grace Daniel)." Account name na person name, no be church.
  must_advise:
    - "Call your pastor or church office for the number wey you know before you send anything"
    - "Account for person name instead of church name na red flag"
  must_not:
    - "Send the seed"
  note: Impersonated pastor.

