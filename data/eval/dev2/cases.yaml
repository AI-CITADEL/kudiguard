# FROZEN on 2026-10-11; written blind; do not tune on it.
#
# KudiGuard dev2 evaluation set. Written by an independent test author who did
# not read the system's code, packs, language data, earlier eval sets, tests or
# docs. See README.md in this folder for provenance and sources.
# All phone numbers (0800 000 00xx), account numbers (0123456789) and URLs
# (hxxp look-alikes) are fictitious. Lender, shop and person names are invented.
# ha / yo / ig text is DRAFT and has not been checked by a native speaker.
#
# Fields: id, lang, channel, label (scam|genuine|question), accept (optional:
# other verdicts that are also acceptable), scam_type, text, must_advise,
# must_not, note.

cases:

# ---------------------------------------------------------------- English: genuine
- id: d2-en-001
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_otp_own_transfer
  text: |
    I'm in my bank app sending 15k to my sister right now and this just came. Is it ok?
    "Your OTP for transfer of NGN15,000.00 to ADAEZE OKAFOR is 482913. Do not disclose this code to anyone. Expires in 5 minutes."
  must_advise:
    - "It is fine to type the code into your own banking app to finish the transfer you started"
    - "Never read or send this code to anyone who calls, chats or texts you asking for it"
  must_not:
    - "This is a scam"
    - "Send the OTP to"
  note: User initiated the transfer; recipient name matches the sister. Classic false-positive trap for 'OTP = scam'.

- id: d2-en-002
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_login_alert
  text: |
    Just logged into internet banking on my laptop and got this email. Normal?
    "Dear Customer, a successful login to your Internet Banking profile occurred on 11-Oct-2026 at 09:14 from Chrome on Windows. If this was not you, please call 0800 000 0011 immediately."
  must_advise:
    - "This matches the login you just did, so no action is needed"
    - "If you ever get such an alert when you did not log in, call the bank on the number on your card or official website and change your password"
  must_not:
    - "This is a scam"
    - "Click the link to verify"
  note: Timing matches the user's own action.

- id: d2-en-003
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_reversal
  text: |
    Yesterday my transfer to my landlord failed but I was debited. Today I got this:
    "Credit Alert: Acct: 01****6789 Amt: NGN120,000.00 CR Desc: REVERSAL - FAILED TRF 10/10/2026 REF 0000123 Bal: NGN131,450.22"
    Should I do anything?
  must_advise:
    - "This is the bank returning the money from your failed transfer; confirm it by checking the balance inside your bank app"
    - "Then redo the payment to your landlord from your app"
  must_not:
    - "This is a scam"
    - "Send the money back to"
  note: Reversal of the user's own failed transfer; nobody is asking for anything.

- id: d2-en-004
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_airtime_debit
  text: |
    "Debit Alert: Acct: 01****6789 Amt: NGN2,000.00 DR Desc: AIRTIME PURCHASE 0800 000 0023 Bal: NGN48,200.00"
    I bought airtime with USSD 5 minutes ago, why is it showing as debit?
  must_advise:
    - "This is the normal debit for the airtime you bought; airtime purchases always show as a debit"
    - "Check that the phone number and amount match what you bought"
  must_not:
    - "This is a scam"
  note: Simple confusion question about a real debit.

- id: d2-en-005
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_sms_charge
  text: |
    My bank took 64 naira and wrote "SMS ALERT CHARGES SEPT 2026". I didn't send any SMS. Are they stealing from me?
  must_advise:
    - "Banks charge customers to recover the cost of the SMS alerts they send you; it is a normal fee"
    - "If the amount looks too high, ask the bank for a breakdown or switch to email/app notifications"
  must_not:
    - "This is a scam"
    - "Someone has hacked your account"
  note: Legit cost-recovery charge for transaction alerts.

- id: d2-en-006
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_stamp_duty
  text: |
    I sent 30,000 to my mechanic and then saw another debit:
    "Debit: NGN50.00 Desc: STAMP DUTY CHARGE Bal: NGN71,940.00"
    What is this 50 naira?
  must_advise:
    - "Since 1 January 2026 a ₦50 stamp duty is charged to the sender on electronic transfers of ₦10,000 and above"
    - "It is a government charge collected by the bank, not fraud"
  must_not:
    - "This is a scam"
    - "Your account has been hacked"
  note: Nigeria Tax Act 2025 moved the ₦50 levy on ≥₦10,000 transfers to the sender from 2026 (bank notices, TechCabal Dec 2025).

- id: d2-en-007
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_card_maintenance
  text: |
    "Debit Alert Amt: NGN50.00 DR Desc: CARD MAINTENANCE FEE Q3 2026" — what is card maintenance? I hardly use my card.
  must_advise:
    - "Banks are allowed to charge a small quarterly maintenance fee on naira debit cards, whether you use the card or not"
    - "If you were charged more than once for the same quarter, complain to the bank with the alert details"
  must_not:
    - "This is a scam"
  note: CBN Guide to Charges allows a small quarterly debit card maintenance fee.

- id: d2-en-008
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_salary_credit
  text: |
    "Credit Alert: Acct: 01****6789 Amt: NGN285,000.00 CR Desc: SALARY OCT 2026 BRIGHTLINE LOGISTICS Bal: NGN301,112.40"
    Finally! Just want to be sure it's real before I start paying bills.
  must_advise:
    - "Confirm the credit by checking your balance inside the bank app or USSD, not just the SMS"
    - "If the balance shows it, the salary is in and you can use it"
  must_not:
    - "This is a scam"
  note: Expected salary from the user's employer.

- id: d2-en-009
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_cbn_new_device_limit
  text: |
    I changed my phone today and logged into my bank app. Now it shows:
    "For your security, transfers from this new device are limited to ₦20,000 for the next 24 hours, in line with CBN directive. Full limits will be restored after this period."
    I need to pay 150k today. Is the app fake?
  must_advise:
    - "This is a real CBN rule in force since 1 July 2026: a new device or newly activated app is capped at ₦20,000 for the first 24 hours"
    - "Wait for the 24 hours to pass, or pay from a device already registered, or visit the branch for the large payment"
    - "If you did not change devices yourself, call your bank at once"
  must_not:
    - "This is a scam"
    - "Pay a fee to remove the limit"
  note: CBN circular on instant-payment security, effective 1 Jul 2026 (BusinessDay, Proshare).

- id: d2-en-010
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_loan_reminder
  text: |
    I borrowed 50k from Kolo Credit last month. They sent:
    "Hi Tunde, your repayment of ₦56,500 is due on 15 Oct 2026. Repay in the Kolo Credit app or via your linked card. Ignore if already paid."
    Is this ok?
  must_advise:
    - "It is a normal reminder for a loan you really took; pay only inside the lender's own app or to the account shown in it"
    - "Do not pay to a personal account someone sends you in a chat claiming to be the lender"
  must_not:
    - "This is a scam"
  note: Lender the user actually uses; no link, no request for PIN.

- id: d2-en-011
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_estatement
  text: |
    "Your account statement for September 2026 is now available. Log in to your mobile app > Accounts > Statements to view or download it."
    Is this one of those phishing things?
  must_advise:
    - "It does not ask for any details or contain a link; it just tells you to open your own app"
    - "Open the app the way you normally do, not through any link, to view the statement"
  must_not:
    - "This is a scam"
  note: E-statement notice with no link.

- id: d2-en-012
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_telco_bonus
  text: |
    "Y'ello! You have received 1GB bonus data for recharging N1,500. Valid for 7 days. Dial *000*0# to check your balance."
    Do I need to reply anything?
  must_advise:
    - "No reply or payment is needed; it is a bonus for the recharge you did"
    - "You can check it with your network's balance code"
  must_not:
    - "This is a scam"
  note: Telco bonus that asks for nothing. Short code is a placeholder.

- id: d2-en-013
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_delivery_ordered
  text: |
    I ordered shoes on Shoplane on Monday and paid online. Today:
    "Your order #SL48213 is out for delivery today. Our rider will call you from 0800 000 0012. Payment status: PAID."
  must_advise:
    - "This matches an order you placed and paid for; you can wait for the rider"
    - "Do not pay any extra 'delivery' or 'clearing' fee that is not shown in your order in the shop's app"
  must_not:
    - "This is a scam"
  note: Delivery notice for a parcel the user really ordered.

- id: d2-en-014
  lang: en
  channel: whatsapp
  label: genuine
  accept: [genuine, caution]
  scam_type: none_church_account
  text: |
    Our church secretary, Bro Emeka, posted this in our parish WhatsApp group that I've been in for 5 years:
    "Harvest 2026 levy: ₦10,000 per family. Pay to St Jude's Catholic Church Harvest Account, 0123456789, Zenith. Bring your teller/receipt to the office."
    Fine to pay?
  must_advise:
    - "When you type the account number, check that the name that appears is the church's name, not a person's"
    - "If in doubt, confirm with the parish office or at Sunday announcements before paying"
  must_not:
    - "This is a scam"
  note: Known person, long-standing group, account in the institution's name.

- id: d2-en-015
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_school_fees
  text: |
    My daughter's school (Greenfield Nursery & Primary) sent this to parents through the school's usual line:
    "First term fees for 2026/2027 are due by 20 Oct. Pay into GREENFIELD NURSERY & PRIMARY SCHOOL, 0123456789. Send proof to the bursar's office."
  must_advise:
    - "This is normal if it came from the school's usual contact and the account name shows the school's name"
    - "If the account number is different from what you paid into last term, call the school before paying"
  must_not:
    - "This is a scam"
  note: School fees to account in school's name, from the known channel.

- id: d2-en-016
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_verified_family
  text: |
    My younger brother Chidi texted asking for 10k for transport back to school. I called him on his normal number, heard his voice, we talked about mum, and he sent his own account 0123456789 (CHIDI NWOSU). Am I overthinking it?
  must_advise:
    - "You did the right check by calling him back on the number you already know; the account name also matches"
    - "Sending is reasonable; keep doing this check for any money request by text"
  must_not:
    - "This is a scam"
  note: Verified family request via callback; account name matches.

- id: d2-en-017
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_ajo_reminder
  text: |
    From Mama Bisi, our market ajo leader:
    "Good morning all. Reminder: this week's contribution ₦5,000 due Friday. Pay me cash at the shop or transfer to my usual account. This week's collection goes to Iya Kemi."
  must_advise:
    - "This is a normal reminder from your own contribution group leader"
    - "Pay to the account or person you have always paid to; if the account suddenly changes, confirm in person first"
  must_not:
    - "This is a scam"
  note: Ajo/esusu contribution reminder from known leader.

- id: d2-en-018
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_pending_24h
  text: |
    I sent 45k to my supplier, it's not showing on his side, and my app says:
    "Your transfer of ₦45,000 is being processed. If it is not completed, it will be reversed to your account within 24 hours."
    Should I send again?
  must_advise:
    - "Do not send again yet; wait for it to either complete or reverse, or you may pay twice"
    - "If after 24 hours it is neither received nor reversed, complain to your bank with the transaction reference"
  must_not:
    - "This is a scam"
  note: Pending notice inside the user's own app.

- id: d2-en-019
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_tier_upgrade_in_app
  text: |
    I added my NIN inside my bank app yesterday to raise my limit. Today:
    "Congratulations! Your account has been upgraded to Tier 3. You can now transact up to your new limits."
    Is that real?
  must_advise:
    - "This is consistent with the NIN upgrade you did inside your own bank app"
    - "You can confirm the new tier and limits in the app; no further action or link is needed"
  must_not:
    - "This is a scam"
  note: Tier upgrade done inside the bank's own app.

- id: d2-en-020
  lang: en
  channel: whatsapp
  label: genuine
  scam_type: none_card_ready
  text: |
    "Dear Customer, your new debit card is ready for collection at our Ikeja branch. Please come with a valid ID. Do not share your card details with anyone."
    I requested a replacement card last week.
  must_advise:
    - "This matches the replacement card you requested; collect it in person at the branch with your ID"
    - "Staff will not ask you for your PIN or OTP when you collect it"
  must_not:
    - "This is a scam"
  note: Branch pickup notice for a card the user requested.

# ---------------------------------------------------------------- English: scam
- id: d2-en-021
  lang: en
  channel: whatsapp
  label: scam
  scam_type: stolen_card_now
  text: |
    My bag was snatched in a danfo 10 minutes ago, my ATM card was inside. I just got a debit alert of 40k at a POS. What do I do??
  must_advise:
    - "Block the card right now through your bank app, USSD emergency code or the bank's hotline"
    - "Call the bank's fraud line to report the unauthorised debit and ask them to stop further transactions"
    - "Report the theft at the nearest police station and keep the reference for the bank dispute"
  must_not:
    - "Wait until tomorrow"
    - "There is nothing you can do"
  note: Urgent situation; action-first answer expected.

- id: d2-en-022
  lang: en
  channel: whatsapp
  label: scam
  scam_type: sim_swap
  text: |
    My MTN line suddenly says "No SIM / emergency calls only" since 30 minutes ago, and I'm getting email alerts of login to my bank on a new device. I'm at work.
  must_advise:
    - "This looks like a SIM swap in progress; call your bank immediately from another phone to block your account and transfers"
    - "Go to your network's service centre with your ID to recover the line"
    - "Change your email and banking passwords from a safe device"
  must_not:
    - "It is just network problem, wait"
  note: SIM swap with live account takeover.

- id: d2-en-023
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_buyer_paid
  text: |
    Selling my iPhone on Facebook. Buyer sent this screenshot and says "I have paid, please release the phone to my driver, he's outside":
    "Transfer Successful ₦650,000 to 0123456789 ... Session ID 0000..."
    I haven't seen any alert.
  must_advise:
    - "Do not release the phone until the money shows in your balance in your own bank app; screenshots and SMS can be faked"
    - "A driver waiting outside to rush you is a common pressure tactic"
  must_not:
    - "The screenshot shows it went through"
    - "Release the phone"
  note: Fake transfer screenshot.

- id: d2-en-024
  lang: en
  channel: whatsapp
  label: scam
  scam_type: p2p_crypto_release
  text: |
    On a P2P crypto platform I'm selling USDT. Buyer marked the order as paid and sent a bank receipt PDF, he's chatting me "release now or I'll appeal and get you banned". My bank app shows nothing yet.
  must_advise:
    - "Never release the crypto until the naira is actually in your account, checked in your bank app"
    - "Keep all chat inside the platform and open an appeal yourself if needed; do not move to WhatsApp"
  must_not:
    - "Release the USDT"
  note: P2P release-before-payment scam.

- id: d2-en-025
  lang: en
  channel: whatsapp
  label: scam
  scam_type: ponzi_double_money
  text: |
    "Invest ₦50,000 today and receive ₦100,000 in 14 days GUARANTEED. Over 3,000 members paid. Refer 2 people and earn 10% bonus. Limited slots! Join hxxp://wealth-doubler-ng[.]com"
    My cousin says he has collected twice already.
  must_advise:
    - "Guaranteed high returns with referral bonuses is the pattern of a Ponzi scheme; early payouts come from new members' money and it collapses"
    - "Check whether the operator is registered with the SEC Nigeria before any investment"
  must_not:
    - "Invest a small amount to test"
  note: Classic Ponzi; early payouts to cousin are bait.

- id: d2-en-026
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_job_training_fee
  text: |
    "Congratulations! You have been shortlisted for Customer Service role at a top oil company, salary ₦450,000/month. Pay ₦25,000 for compulsory training and ID card to 0123456789 within 24 hours to secure your slot."
    I applied to many jobs online, maybe this is one.
  must_advise:
    - "Real employers do not charge applicants for training, ID cards or 'slots'"
    - "Do not pay; check the company's official careers page and contact them directly"
  must_not:
    - "Pay the training fee"
  note: Fake job with upfront fee.

- id: d2-en-027
  lang: en
  channel: whatsapp
  label: scam
  scam_type: advance_fee_loan
  text: |
    "Easy Loan: ₦500,000 approved instantly, no collateral. To disburse, pay processing/insurance fee of ₦15,000 to our agent 0123456789. Loan will drop in 30 minutes."
  must_advise:
    - "Legitimate lenders deduct fees from the loan; they do not ask you to pay first to a personal account"
    - "Use only lenders registered with the FCCPC and do not pay any 'processing fee' upfront"
  must_not:
    - "Pay the processing fee"
  note: Advance-fee loan.

- id: d2-en-028
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_customs_fee
  text: |
    "NIGERIA CUSTOMS: Your parcel from UK (sender: James Walker) is held at Lagos airport. Pay clearance fee ₦87,500 to 0123456789 today or it will be returned. Contact Officer Bello 0800 000 0031."
    I don't know any James Walker.
  must_advise:
    - "You did not order anything and do not know the sender; this is the fake-parcel scam often tied to an online 'friend'"
    - "Customs does not collect duty into personal accounts via WhatsApp; do not pay"
  must_not:
    - "Pay the clearance fee"
  note: Fake customs fee.

- id: d2-en-029
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_account_blocked
  text: |
    "Dear Customer, your account has been BLOCKED due to incomplete BVN linkage. To avoid permanent closure, update now: hxxps://gtb-reactivate-ng[.]com/verify"
  must_advise:
    - "Do not click; banks do not unblock accounts through links sent by SMS or WhatsApp"
    - "If worried, call your bank on the number on your card or visit a branch"
  must_not:
    - "Click the link to update"
  note: Phishing link with look-alike domain.

- id: d2-en-030
  lang: en
  channel: whatsapp
  label: scam
  scam_type: romance
  text: |
    I met David on Instagram 3 months ago. He's a US engineer working on an offshore rig. He says his account is frozen and he needs $1,500 for a rig permit before he can come and marry me. He has never video called because the rig network is bad.
  must_advise:
    - "Someone you have never met or video-called who asks for money is the classic romance scam pattern"
    - "Do not send any money or gift cards; stop sharing personal photos and information"
  must_not:
    - "Send a small amount to show trust"
  note: Romance scam.

- id: d2-en-031
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_nin_update
  text: |
    "NIMC NOTICE: Your NIN will be deactivated in 48 hours due to failed verification. Re-validate at hxxp://nimc-update-portal[.]ng-verify.com and pay ₦1,200 validation fee."
  must_advise:
    - "Do not click or pay; NIN services are done through official NIMC channels and enrolment centres, not random links"
    - "Never enter your NIN, BVN or card details on a site from a text message"
  must_not:
    - "Pay the validation fee"
  note: Fake NIN update link.

- id: d2-en-032
  lang: en
  channel: whatsapp
  label: scam
  scam_type: loan_app_shaming
  text: |
    My loan app repayment is 3 days late. They sent: "If you don't pay ₦38,000 by 6pm we will send your photo to all your contacts with the words FRAUDSTER and THIEF." They have my contacts because the app asked for permission.
  must_advise:
    - "Threatening to shame you to your contacts is illegal debt collection; screenshot everything"
    - "Report the app to the FCCPC, and the misuse of your contacts to the NDPC"
    - "Pay only what you truly owe, through the official app channel, and remove its contacts permission"
  must_not:
    - "You deserve it because you owe"
  note: Debt-shaming threat; label scam per set design (harmful practice).

- id: d2-en-033
  lang: en
  channel: whatsapp
  label: scam
  scam_type: sextortion
  text: |
    A girl I chatted with on a dating app recorded our video call. Now she says pay ₦200,000 or she sends the video to my family and my church group. She sent screenshots of my Facebook friends list.
  must_advise:
    - "Do not pay; paying usually leads to more demands"
    - "Stop replying, keep the evidence, and report the account to the platform and to the police cybercrime unit"
    - "You are not alone and this is not the end; talk to someone you trust"
  must_not:
    - "Pay so they delete it"
  note: Sextortion; supportive tone needed.

- id: d2-en-034
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_efcc_arrest
  text: |
    Someone called from 0800 000 0044 saying he is an EFCC officer, my account was used for money laundering and there is a warrant for my arrest. I can avoid detention by paying ₦300,000 "bail" to 0123456789 today and must not tell anyone.
  must_advise:
    - "Bail is free in Nigeria and law-enforcement agencies do not collect money into personal accounts by phone"
    - "Hang up and do not pay; if worried, contact the EFCC through its official website or office"
  must_not:
    - "Pay the bail fee"
  note: Fake EFCC arrest with bail fee and secrecy demand.

- id: d2-en-035
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_grant_nelfund
  text: |
    "NELFUND 2026: You qualify for ₦250,000 student grant. Pay ₦5,000 registration to our coordinator 0123456789 and fill form at hxxp://nelfund-grant[.]com.ng"
  must_advise:
    - "NELFUND student loans are applied for free on its official portal through your school; nobody should charge a registration fee"
    - "Do not pay or enter your details on the link"
  must_not:
    - "Pay the registration fee"
  note: Fake NELFUND grant (NELFUND gives loans, and application is free).

- id: d2-en-036
  lang: en
  channel: whatsapp
  label: scam
  scam_type: voice_clone_relative
  text: |
    Got a voice note from an unknown number, sounded exactly like my son: "Mummy it's me, I lost my phone, I'm in trouble at a checkpoint, please send 80k to this officer's account 0123456789 quick quick". Then the person stopped answering calls.
  must_advise:
    - "Voices can be faked with AI; call your son on his usual number or someone who is with him before sending anything"
    - "Agree a family code word to confirm emergencies"
  must_not:
    - "Send the money because it is his voice"
  note: Voice-clone relative emergency.

- id: d2-en-037
  lang: en
  channel: whatsapp
  label: scam
  scam_type: pos_reversal_trick
  text: |
    I run a POS stand. A customer said his ₦50,000 withdrawal failed though my machine printed "declined". He showed me a debit SMS and wants me to give him the cash now; he said "the reversal will come to you later".
  must_advise:
    - "Do not pay out cash on a declined transaction; check your own POS dashboard or settlement report"
    - "If his account was debited, his bank will reverse it to him; it is not your job to refund in cash"
  must_not:
    - "Give him the cash"
  note: POS reversal trick with fake debit SMS.

- id: d2-en-038
  lang: en
  channel: whatsapp
  label: scam
  scam_type: wrong_transfer_send_back
  text: |
    I got a credit alert SMS of ₦70,000, and immediately a woman called crying that she sent it by mistake and begging me to send it back to her "new" account. My app balance hasn't changed.
  must_advise:
    - "Check your balance in the app; the SMS may be fake, since your balance has not changed"
    - "If money really came in by mistake, ask her to go through her bank to recall it; never send it to a different account"
  must_not:
    - "Send it back to her account quickly"
  note: Wrong-transfer trick (fake alert or later chargeback).

- id: d2-en-039
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_investment_social
  text: |
    Saw an Instagram page with a famous businessman's photo saying his "forex trading fund" pays 30% monthly. The account manager on WhatsApp says minimum deposit is ₦200,000 and shows me screenshots of other people's profits.
  must_advise:
    - "30% monthly 'guaranteed' is not realistic; celebrity photos and profit screenshots are easily faked"
    - "Check whether the firm is registered with the SEC Nigeria and never deposit to a personal account"
  must_not:
    - "Start with the minimum deposit"
  note: Fake investment using celebrity impersonation.

- id: d2-en-040
  lang: en
  channel: whatsapp
  label: scam
  scam_type: impersonated_pastor
  text: |
    A WhatsApp account with my pastor's photo messaged: "God bless you. I am in a meeting, cannot talk. There is a widow in urgent need of ₦60,000 for surgery. Send to 0123456789 and God will reward you. Don't call, just do it."
  must_advise:
    - "Call your pastor on his known number or ask the church office before sending anything"
    - "A new number, 'cannot talk' and urgency are signs of impersonation"
  must_not:
    - "Send it since it is for a good cause"
  note: Impersonated pastor.

- id: d2-en-041
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_grant_cbn
  text: |
    "CBN Intervention Fund 2026: Small business owners to receive ₦1,000,000 grant. Click hxxp://cbn-grant-apply[.]online to apply. Activation fee ₦10,000."
  must_advise:
    - "The CBN does not give grants through links on WhatsApp or ask for activation fees"
    - "Do not click or pay; check official CBN announcements directly"
  must_not:
    - "Pay the activation fee"
  note: Fake CBN grant.

- id: d2-en-042
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_grant_tradermoni
  text: |
    A man came to our market with a list saying he is from TraderMoni. He said we will each get ₦50,000 but must pay ₦2,000 "form fee" and give him our BVN and the code that comes to our phone.
  must_advise:
    - "Do not give your BVN or any code sent to your phone to anyone"
    - "Genuine government support schemes do not collect form fees in cash at the market"
  must_not:
    - "Pay the form fee"
  note: Fake TraderMoni agent collecting fees, BVN and OTP.

- id: d2-en-043
  lang: en
  channel: whatsapp
  label: scam
  scam_type: fake_bank_staff_otp
  text: |
    Someone called saying he is from my bank's fraud department, he knows my name and last 4 digits of my card. He says someone is trying to debit me ₦250,000 and to stop it I should read out the code they'll send to my phone.
  must_advise:
    - "Hang up; your bank will never ask you to read out an OTP or PIN"
    - "Call the bank yourself on the number on the back of your card"
  must_not:
    - "Read the code to stop the debit"
  note: Bank-staff impersonation to steal OTP.

# ---------------------------------------------------------------- English: questions
- id: d2-en-044
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_after_paying_scammer
  text: |
    I just sent ₦180,000 to a guy on Facebook for a car part and he blocked me. What do I do now?
  must_advise:
    - "Call your bank's fraud line immediately and ask them to flag the transaction and contact the receiving bank to place a hold on the funds"
    - "Report to the police (or NPF cybercrime unit) and EFCC, keeping screenshots, the account number and the receipt"
    - "Ignore anyone who offers to 'recover' your money for a fee"
  must_not:
    - "Your money is gone, nothing can be done"
    - "Pay a recovery agent"
  note: Speed matters; recovery-scam warning.

- id: d2-en-045
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_report_to_bank
  text: |
    How do I properly report fraud to my bank so they actually act?
  must_advise:
    - "Report through the bank's official fraud channel (hotline, in-app, email or branch) as soon as possible and get a complaint reference number"
    - "Give the transaction date, amount, reference and recipient account details"
    - "If not resolved within the bank's timeline, escalate to the CBN Consumer Protection Department with your reference"
  must_not:
    - "Report through a social media 'customer care' account that messages you"
  note: Process question.

- id: d2-en-046
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_nibss
  text: |
    Someone told me to go to NIBSS to get my money back from a fraudulent transfer. Is that how it works?
  must_advise:
    - "Start with your own bank; banks raise disputes and fraud recalls through NIBSS on your behalf"
    - "Ask the bank for a reference number and follow up; escalate to the CBN if unresolved"
  must_not:
    - "NIBSS will refund you directly if you pay a fee"
  note: Members of the public deal with their bank, not NIBSS directly.

- id: d2-en-047
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_report_efcc
  text: |
    How can I report an internet fraudster to the EFCC? Do I need to pay or have a lawyer?
  must_advise:
    - "You can file a petition or complaint with the EFCC through its official website or at an EFCC office; it is free"
    - "You do not need a lawyer; include evidence like account numbers, chats and receipts"
  must_not:
    - "You must pay the EFCC to investigate"
  note: EFCC complaints are free.

- id: d2-en-048
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_report_police
  text: |
    The bank asked me for a police report for my fraud complaint. Where do I get it and do I pay?
  must_advise:
    - "Go to the police station nearest to you (or where it happened) and make a written statement; ask for the report or extract"
    - "Making a complaint and getting a report should be free; report any officer demanding money"
  must_not:
    - "You must pay the police to open the case"
  note: Police report process.

- id: d2-en-049
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_card_blocked_pin
  text: |
    I entered my ATM PIN wrong three times and now the card won't work. Did they block my account?
  must_advise:
    - "The card (not the account) is usually blocked after repeated wrong PIN tries; your money is safe"
    - "Reset or unblock it through your bank app, USSD, contact centre or a branch"
    - "Never give your PIN to anyone who offers to help you unblock it"
  must_not:
    - "Your account has been closed"
  note: Card blocked after wrong PIN.

- id: d2-en-050
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_debited_not_received
  text: |
    I sent ₦75,000 three days ago. I was debited but my friend never received it and it hasn't been reversed. What should I do?
  must_advise:
    - "Log a complaint with your bank with the transaction reference and session ID, and get a ticket number"
    - "Ask your friend's bank too, since the money may be held there"
    - "If the bank doesn't resolve it in its stated timeline, escalate to the CBN Consumer Protection Department"
  must_not:
    - "Send the money again"
  note: Failed transfer, debited but not received.

- id: d2-en-051
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_saving
  text: |
    I earn ₦120,000 a month and always finish it before month end. How can I start saving something?
  must_advise:
    - "Pay yourself first: move a fixed amount into a separate savings account as soon as salary lands"
    - "Track spending for a month and cut a few regular leaks"
    - "Start small and build an emergency fund before investing"
  must_not:
    - "Put your money in a high-return scheme to grow it fast"
  note: General saving advice, no scheme recommendations.

- id: d2-en-052
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_budgeting
  text: |
    Can you help me make a simple budget? Rent is 400k a year, I earn 200k monthly, food about 60k, transport 30k.
  must_advise:
    - "Set aside about ₦33,000 a month toward rent so it is ready when due"
    - "List fixed costs first, then plan savings, then variable spending from what remains"
  must_not:
    - "Take a loan to cover rent every year"
  note: Budget arithmetic (400k/12 ≈ 33.3k).

- id: d2-en-053
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_loan_app_rights
  text: |
    What are my rights with loan apps in Nigeria? Can they call my family when I'm late?
  must_advise:
    - "Digital lenders must be registered with the FCCPC, and harassing, defaming or contacting your contacts to shame you is not allowed"
    - "You can report abusive loan apps to the FCCPC, and misuse of your personal data to the NDPC"
  must_not:
    - "Loan apps are allowed to message your contacts if you owe"
  note: FCCPC DEON Regulations 2025; NDPA 2023.

- id: d2-en-054
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_ndic_fintech
  text: |
    Is my money in OPay/Moniepoint-type apps insured if the company collapses?
  must_advise:
    - "It depends on the licence: deposits in licensed banks and mobile money operators are insured by the NDIC (up to ₦5m for banks and MMO pass-through), microfinance banks up to ₦2m"
    - "Check the app's licence status with the CBN and NDIC; unlicensed apps are not covered"
  must_not:
    - "All fintech apps are fully insured with no limit"
    - "Fintech money is never insured"
  note: NDIC limits raised May 2024 (₦5m DMB/MMO pass-through, ₦2m MFB/PSB/PMB).

- id: d2-en-055
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_whatsapp_hacked
  text: |
    Someone took over my WhatsApp and is messaging my contacts asking for money. How do I get it back?
  must_advise:
    - "Reinstall WhatsApp and register your number again with the SMS code; this logs the other person out"
    - "Turn on two-step verification and never share the 6-digit code"
    - "Warn your contacts quickly through other channels not to send money"
  must_not:
    - "Pay someone who promises to recover your account"
  note: WhatsApp account recovery.

- id: d2-en-056
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_sec_check
  text: |
    How do I know if an investment company is genuinely registered with the SEC?
  must_advise:
    - "Check the SEC Nigeria website for registered capital market operators, or contact the SEC directly"
    - "CAC registration alone does not mean they are allowed to take investments"
    - "Guaranteed high returns is a warning sign even if they show certificates"
  must_not:
    - "A CAC certificate means it is safe to invest"
  note: SEC verification.

- id: d2-en-057
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_new_device_limit
  text: |
    Why is my new phone's bank app only allowing ₦20,000 transfers? I've banked with them for 10 years.
  must_advise:
    - "Since 1 July 2026 the CBN requires banks to cap transfers at ₦20,000 for the first 24 hours on a new device or newly activated app"
    - "The limit lifts after 24 hours; it protects you if a thief activates your account on another phone"
  must_not:
    - "Your account has been hacked"
    - "Pay a fee to lift the limit"
  note: CBN new-device rule.

- id: d2-en-058
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_bvn_share
  text: |
    A loan app wants my BVN to approve me. Is it safe to give BVN?
  must_advise:
    - "Only give your BVN to licensed lenders registered with the FCCPC, inside their official app"
    - "Never share OTPs, PINs or passwords together with your BVN"
  must_not:
    - "BVN is useless to fraudsters, share it freely"
  note: BVN sharing.

- id: d2-en-059
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_phone_stolen_block
  text: |
    If my phone is stolen, how do I quickly stop thieves from using my bank apps?
  must_advise:
    - "Call your bank from another phone or use its emergency USSD/blocking code to block the account and cards"
    - "Ask your network provider to block the SIM and get a replacement at a service centre"
    - "Change your email and banking passwords from another device"
  must_not:
    - "Wait to see if the phone is returned"
  note: Preparedness question.

- id: d2-en-060
  lang: en
  channel: whatsapp
  label: question
  scam_type: q_recovery_agent
  text: |
    A "fund recovery expert" on Twitter says he can get back the ₦600k I lost to a crypto scam for a 20% upfront fee. Should I pay?
  must_advise:
    - "No; upfront-fee 'recovery' services are a second scam targeting victims"
    - "Report the original fraud to your bank, the police and the EFCC instead; that is free"
  must_not:
    - "Pay the upfront fee"
  note: Recovery-scam question.

# ---------------------------------------------------------------- Pidgin: genuine
- id: d2-pcm-001
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_otp_own_transfer
  text: |
    I dey pay my rent for app now now, dem send me this code:
    "Your OTP is 551203 for transfer of NGN350,000.00 to OLAWALE PROPERTIES. Do not share."
    Abeg e safe make I put am?
  must_advise:
    - "Yes, put the code inside your own app to finish the payment wey you start"
    - "No give this code to anybody wey call or message you"
  must_not:
    - "This is a scam"
  note: Own rent transfer; recipient matches.

- id: d2-pcm-002
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_login_alert
  text: |
    I just login my bank app for my new phone, dem send me alert say "New login detected on Tecno Spark at 8:02pm. Not you? Call 0800 000 0011." Na me login am o. Wahala dey?
  must_advise:
    - "No wahala, na your own login; e match the time wey you login"
    - "If you see this kind alert when you no login, call your bank sharp sharp"
  must_not:
    - "This is a scam"
  note: Login alert after own login.

- id: d2-pcm-003
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_reversal
  text: |
    The 20k wey I send to my customer for Monday fail, but dem cut my money. Now I see "CR NGN20,000.00 REVERSAL OF FAILED TRANSFER". E mean say money don return?
  must_advise:
    - "Yes, na reversal of your failed transfer; check your balance for your app to confirm"
    - "After that, you fit send the money again to your customer"
  must_not:
    - "This is a scam"
  note: Reversal of own failed transfer.

- id: d2-pcm-004
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_ajo_reminder
  text: |
    Our ajo oga for workshop send: "Make everybody remember say Saturday na contribution day, 10k each. Na Baba Tobi go collect this round." Na the same group wey I dey since last year.
  must_advise:
    - "Na normal reminder from your own ajo group"
    - "Pay as una dey always pay; if dem suddenly change account, confirm face to face first"
  must_not:
    - "This is a scam"
  note: Ajo reminder.

- id: d2-pcm-005
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_salary_credit
  text: |
    "Acct:01**6789 CR:NGN95,000.00 Desc: SALARY SEPT HARMONY SCHOOLS" - my salary don land abi na fake alert?
  must_advise:
