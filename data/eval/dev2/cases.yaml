    - "Na expected salary from your employer, nothing to pay or click"
  must_not:
    - "This is a scam"
  note: Salary credit.

- id: d2-pcm-006
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_delivery_ordered
  text: |
    I order rice cooker for Jumpmart, I don pay. Now dem text: "Your package will be delivered between 10am-4pm today. Rider: Musa 0800 000 0013." Abeg e good?
  must_advise:
    - "E match the order wey you pay for; you fit wait for the rider"
    - "If anybody ask you for extra delivery money wey no dey your order, no pay am"
  must_not:
    - "This is a scam"
  note: Delivery for real order.

- id: d2-pcm-007
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_pending_24h
  text: |
    Bank app talk say "Transaction pending. Your account will be credited or reversed within 24 hours." I don send 15k since morning, the person never see am. Make I send again?
  must_advise:
    - "No send again yet; wait make e complete or reverse, so you no go pay double"
    - "If 24 hours pass and nothing happen, complain to your bank with the transaction reference"
  must_not:
    - "This is a scam"
  note: Pending notice.

- id: d2-pcm-008
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_cbn_new_device_limit
  text: |
    I change phone yesterday evening, now my bank app dey talk say I no fit send pass 20k until 24 hours finish. Dem don block me ni?
  must_advise:
    - "Dem no block you; na CBN rule since 1 July 2026 - new device or new app activation get ₦20,000 limit for first 24 hours"
    - "After 24 hours your normal limit go come back"
  must_not:
    - "This is a scam"
    - "Pay to unblock"
  note: CBN new-device rule.

- id: d2-pcm-009
  lang: pcm
  channel: whatsapp
  label: genuine
  scam_type: none_verified_family
  text: |
    My mama for village message say make I send 15k for her drugs. I call her normal number, she pick, na her voice, she say make I send am to my uncle account wey I don dey send to before. Make I send?
  must_advise:
    - "You don do correct check - you call her back for her known number"
    - "Since na account wey you don use before, you fit send"
  must_not:
    - "This is a scam"
  note: Verified family request.

# ---------------------------------------------------------------- Pidgin: scam
- id: d2-pcm-010
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: stolen_phone_now
  text: |
    Dem just snatch my phone for Oshodi now now! All my bank apps dey inside. I dey use my friend phone. Wetin I go do?
  must_advise:
    - "Call your bank now from this phone or use their emergency code to block your account and apps"
    - "Call your network make dem block the SIM, then go collect new SIM with your ID"
    - "Report for police station make you get report"
  must_not:
    - "Wait till tomorrow"
  note: Stolen phone just now.

- id: d2-pcm-011
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: fake_buyer_paid
  text: |
    One customer wan buy my generator for Jiji. E send screenshot say "I don pay 280k, abeg give my boy the gen". My phone never show alert o, but e say na network.
  must_advise:
    - "No give the generator until you see the money for your balance inside your bank app"
    - "Screenshot and SMS alert fit be fake"
  must_not:
    - "Give am the generator"
  note: Fake 'I have paid' buyer.

- id: d2-pcm-012
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: ponzi_double_money
  text: |
    Dem dey tell me for one group: "Put 20k, collect 40k for 7 days. Bring 3 people collect bonus." My neighbor don collect once. Make I enter?
  must_advise:
    - "Na Ponzi style; dem dey use new people money pay old people until e crash"
    - "No enter; check if dem register with SEC Nigeria"
  must_not:
    - "Put small money try am"
  note: Double your money.

- id: d2-pcm-013
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: fake_job_training_fee
  text: |
    "You don pass interview for driver work for one embassy, salary 350k. Pay 30k for uniform and medical test to this account 0123456789." I never even do any interview sef.
  must_advise:
    - "Real job no dey collect money for uniform or medical before you start"
    - "You never do interview - na clear sign say na fake"
  must_not:
    - "Pay the uniform money"
  note: Fake job with fee.

- id: d2-pcm-014
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: fake_account_blocked
  text: |
    SMS: "Your acct has been restricted. Call our customer care on 0800 000 0055 to unrestrict and verify your card." I call am, dem dey ask for my card number and PIN.
  must_advise:
    - "Stop the call; bank no dey ever ask for your PIN"
    - "Call your bank with the number wey dey back of your card or go branch"
    - "If you don already give dem anything, block your card now"
  must_not:
    - "Give dem the card details make dem verify"
  note: Fake account-blocked with callback number.

- id: d2-pcm-015
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: loan_app_shaming
  text: |
    Loan app don send message to my oga for office say I be thief because I owe 25k. Now dem dey threaten say dem go post my picture for Facebook. I fit do anything?
  must_advise:
    - "Wetin dem dey do no legal - report the app to FCCPC and the data misuse to NDPC"
    - "Screenshot all their messages as evidence"
    - "Pay only wetin you really owe through the official app"
  must_not:
    - "Na your fault, make you just bear am"
  note: Loan app shaming.

- id: d2-pcm-016
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: wrong_transfer_send_back
  text: |
    One man call me say e mistakenly send 50k enter my account, make I send am back to im wife account. I see SMS of 50k but my app balance never change.
  must_advise:
    - "Your balance never change, so the SMS fit be fake; no send anything"
    - "If money really enter, make e go through im bank to reverse am; no send am to another account"
  must_not:
    - "Send am back quick"
  note: Wrong transfer trick.

- id: d2-pcm-017
  lang: pcm
  channel: whatsapp
  label: scam
  scam_type: pos_reversal_trick
  text: |
    For my POS shop, one guy withdraw 40k, machine show "Transaction Failed", but e show me SMS say dem debit am. E dey shout say make I give am cash. Wetin I go do?
