- {lang: yo, expect: question, text: "Báwo ni mo ṣe lè máa fi owó pamọ́ ní gbogbo oṣù?"}
- {lang: ig, expect: scam_check, text: "Onye kpọrọ m sị na m meriri ego na ha chọrọ ka m kwụọ ụgwọ tupu ha zite ya."}
- {lang: ig, expect: question, text: "Kedu ka m ga-esi chekwaa ego kwa ọnwa?"}
- {lang: en, expect: scam_check, text: "abeg dem say make i pay 5k registration fee to collect the government grant, e real?"}
