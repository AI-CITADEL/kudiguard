# Prompt-quality eval cases (live N-ATLAS). `expect` = intent the analyse step should return;
# optional `verdicts` = the verdicts acceptable for the case (default: scam_check -> likely_scam/caution, else neither).
# Used by scripts/eval_prompts.py; results recorded in docs/SPIKES.md.
- {lang: ha, expect: scam_check, text: "Wani ya kira ni ya ce an toshe BVN dina, ya ce in tura masa lambar OTP da aka turo min."}
- {lang: ha, expect: question, text: "Ta yaya zan fara tara kuɗi kowane wata?"}
- {lang: ha, expect: scam_check, text: "Sun ce na ci kyautar naira dubu dari biyar, amma sai na biya kuɗin rajista tukuna."}
- {lang: ha, expect: question, text: "Menene BVN kuma me yasa nake bukatarsa?"}
