  must:
    - {point: "Nobody can guarantee high profits; real investments can lose money.", from: flag-guaranteed-returns}
    - {point: "Schemes that promise to multiply your money are usually Ponzi schemes.", from: flag-guaranteed-returns}
    - {point: "Check if the company is registered with the SEC.", from: flag-guaranteed-returns}
  must_not: ["This investment has no risk."]

