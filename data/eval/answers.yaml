    - {point: "Your bank cannot take the money back without the account owner's consent or a legal process.", from: sent-to-wrong-account}
    - {point: "Be careful of strangers who promise to recover it for a fee.", from: sent-to-wrong-account}
  must_not: ["You will get your money back."]

# --- Igbo (ig) - DRAFT wording ----------------------------------------------------------------------------
