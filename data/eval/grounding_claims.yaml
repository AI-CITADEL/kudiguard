# Grounding-check calibration set: one reply sentence ("claim") vs the evidence it was composed from.
# Evidence = facts + actions of `entries` (kudiguard-core) + the verdict line for `verdict` + generic framing
# (``kudiguard.safety.grounding.evidence_for``). `supported: false` = an invented fact the check must catch:
# wrong numbers/days, made-up agencies, promises of an outcome, advice the knowledge base does not give.
# Written 2026-10-10 by the grounding workstream; ha/yo/ig wording by a non-native author, native review pending.
# Used by tests/integration/test_grounding_quality.py (-m live). Never tune the threshold on fewer cases than this.

