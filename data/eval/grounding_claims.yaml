# Grounding-check calibration. `claims`: one reply sentence vs the evidence it was composed from (facts + actions
# of `entries` in kudiguard-core, the verdict line for `verdict`, generic framing; see safety/grounding.py).
# `supported: false` = an invention the check must catch: wrong numbers/days, made-up agencies, promised outcomes,
# advice the knowledge base does not give, and polarity inversions ("share the code with your bank staff").
# `replies`: whole replies as production builds them (knowledge search on `message` + `flags`, the message passed
# as the user's message). `acceptable: false` = must be blocked by the grounding check or the output guard.
#
# set: dev  = the threshold is chosen on these only (written 2026-10-10 with the first version of the check).
# set: test = held out: written after the threshold was fixed, never tuned on (incl. the reviewer's probe replies).
# Author: the grounding workstream (not N-ATLAS output; real replies come from workstream D's answer eval later).
# ha/yo/ig wording by a non-native author, native review pending. Used by tests/integration/test_grounding_quality.py.
