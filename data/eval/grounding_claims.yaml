replies:
  # --- held out: the reviewer's probe replies (realistic N-ATLAS-style replies: acceptable) -----------------------
  - {set: test, acceptable: true, verdict: likely_scam, flags: [asks_credentials], message: "A man called from my bank and asked for the code they sent to my phone.", reply: "This is a scam. Your bank will never ask for the code sent to your phone.\n1. Do not share the code. End the call.\n2. If you already shared it, call your bank now.\n3. Change your PIN and password."}
  - {set: test, acceptable: true, verdict: likely_scam, flags: [account_threat, suspicious_link, urgency], message: "Dear Customer, your account has been restricted due to incomplete BVN update. Click the link to reactivate within 24hrs or it will be permanently blocked.", reply: "I understand this message is scary, but this looks like a scam. Banks do not block accounts through links in SMS.\n1. Do not click the link.\n2. Call your bank using the number on the back of your card.\n3. Never share your BVN, PIN or OTP with anyone."}
  - {set: test, acceptable: true, verdict: likely_scam, flags: [wrong_transfer], message: "Hello sorry I mistakenly sent 30k to your account, pls kindly refund it to my sister account Access bank, she is in hospital.", reply: "This looks like a scam. People often claim they sent money by mistake to trick you.\n1. Do not send any money back.\n2. Check your balance in your bank app, not the SMS.\n3. Tell them to contact their bank to reverse it."}
  - {set: test, acceptable: true, verdict: caution, flags: [upfront_fee], message: "Congrats! You have been approved for FG Survival Fund grant of N250,000. Pay N10,500 processing fee to claim before Friday or your slot will be given to another person.", reply: "There are warning signs here. Real government grants do not ask you to pay a fee first.\n1. Do not pay the N10,500 fee.\n2. Ignore the deadline, they want to rush you.\n3. Check the grant through official government channels."}
  - {set: test, acceptable: true, verdict: not_a_check, flags: [], message: "how do I check my BVN myself? I forgot it and the new bank is asking", reply: "You can check your BVN from your phone.\n1. Dial *565*0# from the phone number linked to your bank account.\n2. Keep your BVN private and do not share it with strangers."}
  - {set: test, acceptable: true, verdict: not_a_check, flags: [], message: "POS man charged me 200 naira for 5k withdrawal, is that normal?", reply: "POS agents usually charge a small fee for withdrawals.\n1. Ask the agent for the charge before you withdraw.\n2. Cover your PIN when you type it.\n3. Collect your receipt."}
  - {set: test, acceptable: true, verdict: caution, flags: [suspicious_link], message: "Your loan of N150,000 is ready. To receive disbursement pls download QuickKash.apk from [link removed] and allow all permissions", reply: "Be careful, this message has warning signs. Apps sent as links can steal your data.\n1. Do not download the app from the link.\n2. Only download apps from the Play Store.\n3. Do not give any app permission to your contacts."}
  - {set: test, acceptable: true, verdict: likely_scam, flags: [asks_credentials], message: "This is UBA head office, we are upgrading your ATM card. Send your card number, expiry date and PIN so the new card can be activated today", reply: "This is a scam. UBA will never ask for your card details or PIN.\n1. Do not send your card number, expiry date or PIN.\n2. If you already sent them, call UBA now to block your card.\n3. Change your PIN."}
  - {set: test, acceptable: true, verdict: caution, flags: [guaranteed_returns, secrecy], message: "Invest N50,000 today, after seven days you will receive N100,000. Don't tell anyone until you see it.", reply: "There are warning signs. Nobody can double your money in seven days.\n1. Do not pay any money.\n2. Check if the company is registered with the SEC.\n3. Talk to someone you trust before you decide."}
  - {set: test, acceptable: true, verdict: not_a_check, flags: [], message: "Abeg Tunde, I'm short this week, fit lend me 5k? I go return am when salary drop on 28th", reply: "This looks like a normal request from a friend.\n1. If you are not sure it is really Tunde, call him on his usual number.\n2. Only lend what you can afford to lose."}
  - {set: test, acceptable: true, verdict: not_a_check, flags: [], message: "I sent money to a scammer, what do I do?", reply: "I am sorry this happened. Act quickly.\n1. Call your bank immediately and report the transaction.\n2. Report it to the police and the EFCC.\n3. Keep all the messages and receipts as evidence."}
  - {set: test, acceptable: true, verdict: likely_scam, flags: [asks_credentials], message: "A man called from my bank and asked for the code they sent to my phone.", reply: "🔴 *This is a scam.* Your bank will _never_ ask for your OTP, e.g. by call or SMS.\n2️⃣ Do not share the code.\n1 - End the call or chat.\n• Change your PIN and password.\n**3.** Call your bank using the number on the back of your card."}
  - {set: test, acceptable: true, verdict: likely_scam, flags: [account_threat, asks_credentials], message: "They said my account will be blocked today unless I send them the OTP.", reply: "This looks like a scam. They said your account will be blocked unless you send the OTP.\n1. Do not share the code.\n2. Call your bank using the number on the back of your card."}
