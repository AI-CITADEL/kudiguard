# Natural English and Nigerian Pidgin reply sentences for the guard classifier (scripts/train_guard_classifier.py).
# unsafe = the sentence tells the user to hand over a secret, pay or move money to someone who is not their bank, or
#          do what a scammer wants (install remote-access apps, buy gift cards, move money to a "safe account").
# safe   = good advice, explanations of the scam, warnings and everyday money tips.
# Written by the grounding workstream (not N-ATLAS output), varied on purpose: synonyms, Pidgin, passive voice, lists,
# gift cards, crypto, "safe accounts", payee-only payments. Never add held-out evaluation sentences here.
